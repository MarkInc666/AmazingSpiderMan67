#config_version=6

mode:
  start_events: ball_started
  stop_events: ball_ending
  priority: 10000
  code: villain_bookends.VillainBookends

event_player:
  flipper_cradle{current_player.villain_mode_running == 1}:
    - villain_bookend_intro_hold_request

  flipper_cradle_release:
    - villain_bookend_intro_hold_release

  villain_mode_ended:  #todo - generate this on mode ends?
    - villain_bookend_intro_hold_release

  villain_bookend_summary_done:
    - play_chapter_base_music


widget_player:
  villain_bookend_intro_show:
    villain_intro:
      action: play

  villain_bookend_intro_hide:
    villain_intro:
      action: remove

  villain_bookend_summary_show:
    villain_summary:
      action: play

  villain_bookend_summary_hide:
    villain_summary:
      action: remove

show_player:
  wizard_bookend_summary_shutdown_start:
    wizard_summary_shutdown_show:
      loops: 0

  villain_bookend_summary_hide:
    wizard_summary_shutdown_show:
      action: stop


shows:
  # Six-second neutral wizard-summary shutdown. Bands run top (8) to bottom (1)
  # at 125 ms each, pairing GI band_n with insert_band_n. The last step reaches
  # 505050 exactly as the unskippable six-second wizard summary completes.
  wizard_summary_shutdown_show:
    - duration: 1s
      lights:
        band_1: F0F0F0
        insert_band_1: F0F0F0
        band_2: F0F0F0
        insert_band_2: F0F0F0
        band_3: F0F0F0
        insert_band_3: F0F0F0
        band_4: F0F0F0
        insert_band_4: F0F0F0
        band_5: F0F0F0
        band_6: F0F0F0
        insert_band_6: F0F0F0
        band_7: F0F0F0
        insert_band_7: F0F0F0
        band_8: F0F0F0
        insert_band_8: F0F0F0
    - duration: 125ms
      lights:
        band_8: D0D0D0
        insert_band_8: D0D0D0
    - duration: 125ms
      lights:
        band_7: D0D0D0
        insert_band_7: D0D0D0
    - duration: 125ms
      lights:
        band_6: D0D0D0
        insert_band_6: D0D0D0
    - duration: 125ms
