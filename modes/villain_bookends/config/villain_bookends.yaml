#config_version=6

mode:
  start_events: ball_started
  stop_events: ball_ending
  priority: 10000
  code: villain_bookends.VillainBookends

event_player:
  flipper_cradle{current_player.villain_mode_running == 1}:
    - villain_bookend_intro_hold_request

  flipper_cradle_release:
    - villain_bookend_intro_hold_release

  villain_mode_ended:  #todo - generate this on mode ends?
    - villain_bookend_intro_hold_release

  villain_bookend_summary_done:
    - play_chapter_base_music


widget_player:
  villain_bookend_intro_show:
    villain_intro:
      action: play

  villain_bookend_intro_hide:
    villain_intro:
      action: remove

  villain_bookend_summary_show:
    villain_summary:
      action: play

  villain_bookend_summary_hide:
    villain_summary:
      action: remove

show_player:
  wizard_bookend_summary_shutdown_start:
    wizard_summary_shutdown_show:
      loops: 0

  villain_bookend_summary_wipe_start:
    villain_summary_wipe_show:
      loops: 0

  villain_bookend_summary_hide:
    wizard_summary_shutdown_show:
      action: stop
    villain_summary_wipe_show:
      action: stop


shows:
  # Ordinary-villain summary cleanup. Three one-second Spider-Man sweeps
  # erase the stopped villain mode lighting: blue bottom-to-top, red
  # top-to-bottom, then white bottom-to-top. The playfield then settles
  # to neutral 505050 for the remaining three seconds of the summary.
  villain_summary_wipe_show:
    - duration: 125ms
      lights:
        band_1: 4080F0
        insert_band_1: 4080F0
    - duration: 125ms
      lights:
        band_2: 4080F0
