#config_version=6

mode:
  start_events: start_mode_bolton_boomer
  stop_events:
    - ball_will_end
    - bonus_start
    - bolton_boomer_mode_complete
    - bolton_boomer_mode_completed_summary
    - ball_ended
  code: bolton_boomer.BoltonBoomer
  priority: 500

multiballs:
  bolton_boomer_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: (current_player.bolton_boomer_opening_save_seconds)
    start_events: bolton_boomer_start_multiball
    stop_events:
      - bolton_boomer_mode_completed_summary
      - ball_ended

variable_player:
  multiball_bolton_boomer_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_bolton_boomer_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

widget_player:
  mode_bolton_boomer_started:
    bolton_boomer: {action: play}
  mode_bolton_boomer_stopping:
    bolton_boomer: {action: remove}

event_player:
  s_web_target_left_active: bolton_boomer_target_left_web
  s_web_target_mid_active: bolton_boomer_target_center_web
  s_sling_l_active: bolton_boomer_target_left_sling
  s_sling_r_active: bolton_boomer_target_right_sling
  s_pop_left_active: bolton_boomer_target_left_pop
  s_pop_right_active: bolton_boomer_target_right_pop
  s_star_rollover_active: bolton_boomer_target_star

  s_left_drops_1_active: bolton_boomer_target_left_bank
  s_left_drops_2_active: bolton_boomer_target_left_bank
  s_left_drops_3_active: bolton_boomer_target_left_bank
  s_left_drops_rubber_active: bolton_boomer_target_left_bank
  s_left_drops_top_left_rubber_active: bolton_boomer_target_left_bank
  s_left_drops_top_right_rubber_active: bolton_boomer_target_left_bank

  s_right_drops_1_active: bolton_boomer_target_right_bank
  s_right_drops_2_active: bolton_boomer_target_right_bank
  s_right_drops_3_active: bolton_boomer_target_right_bank
  s_right_drops_4_active: bolton_boomer_target_right_bank
  s_right_drops_5_active: bolton_boomer_target_right_bank
  s_right_drops_rubber_active: bolton_boomer_target_right_bank
  s_right_drops_top_rubber_active: bolton_boomer_target_right_bank

  s_saucer_1_active: bolton_boomer_saucer_1
  s_saucer_2_active: bolton_boomer_saucer_2
  s_saucer_3_active: bolton_boomer_saucer_3
  s_vuk_switch_active: bolton_boomer_vuk_hit

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_bolton_boomer_started:
    - reset_drops
    - clear_saucers_delayed
  mode_bolton_boomer_stopping:
    - clear_saucers_delayed

show_player:
  bolton_boomer_light_left_web:
    bolton_boomer_left_web_pulse: {loops: -1}
  bolton_boomer_light_center_web:
    bolton_boomer_center_web_pulse: {loops: -1}
  bolton_boomer_light_left_sling:
    bolton_boomer_left_sling_pulse: {loops: -1}
  bolton_boomer_light_right_sling:
    bolton_boomer_right_sling_pulse: {loops: -1}
  bolton_boomer_light_left_pop:
    bolton_boomer_left_pop_pulse: {loops: -1}
  bolton_boomer_light_right_pop:
    bolton_boomer_right_pop_pulse: {loops: -1}
  bolton_boomer_light_left_bank:
    bolton_boomer_left_bank_pulse: {loops: -1}
  bolton_boomer_light_right_bank:
    bolton_boomer_right_bank_pulse: {loops: -1}
  bolton_boomer_light_star:
    bolton_boomer_star_pulse: {loops: -1}

  bolton_boomer_saucers_ready:
    bolton_boomer_saucers_pulse: {loops: -1}
  bolton_boomer_saucers_not_ready:
    bolton_boomer_saucers_pulse: {action: stop}
  bolton_boomer_saucer_1_held:
    bolton_boomer_saucer_1_solid: {loops: -1}
  bolton_boomer_saucer_2_held:
    bolton_boomer_saucer_2_solid: {loops: -1}
  bolton_boomer_saucer_3_held:
    bolton_boomer_saucer_3_solid: {loops: -1}
  bolton_boomer_vuk_ready:
    bolton_boomer_vuk_flash: {loops: -1}
  bolton_boomer_vuk_not_ready:
    bolton_boomer_vuk_flash: {action: stop}

  bolton_boomer_clear_targets:
    bolton_boomer_left_web_pulse: {action: stop}
    bolton_boomer_center_web_pulse: {action: stop}
    bolton_boomer_left_sling_pulse: {action: stop}
    bolton_boomer_right_sling_pulse: {action: stop}
    bolton_boomer_left_pop_pulse: {action: stop}
    bolton_boomer_right_pop_pulse: {action: stop}
    bolton_boomer_left_bank_pulse: {action: stop}
    bolton_boomer_right_bank_pulse: {action: stop}
    bolton_boomer_star_pulse: {action: stop}

  bolton_boomer_clear_lights:
    bolton_boomer_left_web_pulse: {action: stop}
    bolton_boomer_center_web_pulse: {action: stop}
    bolton_boomer_left_sling_pulse: {action: stop}
    bolton_boomer_right_sling_pulse: {action: stop}
    bolton_boomer_left_pop_pulse: {action: stop}
    bolton_boomer_right_pop_pulse: {action: stop}
    bolton_boomer_left_bank_pulse: {action: stop}
    bolton_boomer_right_bank_pulse: {action: stop}
    bolton_boomer_star_pulse: {action: stop}
    bolton_boomer_saucers_pulse: {action: stop}
    bolton_boomer_saucer_1_solid: {action: stop}
    bolton_boomer_saucer_2_solid: {action: stop}
    bolton_boomer_saucer_3_solid: {action: stop}
    bolton_boomer_vuk_flash: {action: stop}

light_player:
  mode_bolton_boomer_started:
    gi: 403010
  mode_bolton_boomer_stopping:
    gi: E0E0E0
  bolton_boomer_clear_lights:
    l_left_web_target: stop
    l_mid_web_target: stop
    l_gi_left_sling_upper: stop
    l_gi_left_sling_lower: stop
    l_gi_right_sling: stop
    l_pop_1_1: stop
    l_pop_2_1: stop
    l_gi_3bank: stop
    l_gi_5bank_lower: stop
    l_gi_5bank_upper: stop
    l_star: stop
    l_1_hole_l: stop
    l_1_hole_r: stop
    l_2_hole_l: stop
    l_2_hole_r: stop
    l_3_hole_l: stop
    l_3_hole_r: stop
    l_gi_left_upper: stop

shows:
  bolton_boomer_left_web_pulse:
    - duration: 500ms
      lights: {l_left_web_target: yellow}
    - duration: 500ms
      lights: {l_left_web_target: off}
  bolton_boomer_center_web_pulse:
    - duration: 500ms
      lights: {l_mid_web_target: yellow}
    - duration: 500ms
      lights: {l_mid_web_target: off}
  bolton_boomer_left_sling_pulse:
    - duration: 500ms
      lights: {l_gi_left_sling_upper: yellow, l_gi_left_sling_lower: yellow}
    - duration: 500ms
      lights: {l_gi_left_sling_upper: off, l_gi_left_sling_lower: off}
  bolton_boomer_right_sling_pulse:
    - duration: 500ms
      lights: {l_gi_right_sling: yellow}
    - duration: 500ms
      lights: {l_gi_right_sling: off}
  bolton_boomer_left_pop_pulse:
    - duration: 500ms
      lights: {l_pop_1_1: yellow}
    - duration: 500ms
      lights: {l_pop_1_1: off}
  bolton_boomer_right_pop_pulse:
    - duration: 500ms
      lights: {l_pop_2_1: yellow}
    - duration: 500ms
      lights: {l_pop_2_1: off}
  bolton_boomer_left_bank_pulse:
    - duration: 500ms
      lights: {l_gi_3bank: yellow}
    - duration: 500ms
      lights: {l_gi_3bank: off}
  bolton_boomer_right_bank_pulse:
    - duration: 500ms
      lights: {l_gi_5bank_lower: yellow, l_gi_5bank_upper: yellow}
    - duration: 500ms
      lights: {l_gi_5bank_lower: off, l_gi_5bank_upper: off}
  bolton_boomer_star_pulse:
    - duration: 500ms
      lights: {l_star: yellow}
    - duration: 500ms
      lights: {l_star: off}

  bolton_boomer_saucers_pulse:
    - duration: 500ms
      lights:
        l_1_hole_l: red
        l_1_hole_r: red
        l_2_hole_l: red
        l_2_hole_r: red
        l_3_hole_l: red
        l_3_hole_r: red
    - duration: 500ms
      lights:
        l_1_hole_l: 400000
        l_1_hole_r: 400000
        l_2_hole_l: 400000
        l_2_hole_r: 400000
        l_3_hole_l: 400000
        l_3_hole_r: 400000
  bolton_boomer_saucer_1_solid:
    - duration: -1
      lights: {l_1_hole_l: red, l_1_hole_r: red}
  bolton_boomer_saucer_2_solid:
    - duration: -1
      lights: {l_2_hole_l: red, l_2_hole_r: red}
  bolton_boomer_saucer_3_solid:
    - duration: -1
      lights: {l_3_hole_l: red, l_3_hole_r: red}
  bolton_boomer_vuk_flash:
    - duration: 300ms
      lights: {l_gi_left_upper: 30FF60}
    - duration: 300ms
      lights: {l_gi_left_upper: off}

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
