#config_version=6

# Invasion from Everywhere - Chapter 9 wizard.
# 3-ball repeating relay: LOAD VUK -> Igor/Molemen/DeVargas lower phase ->
# saucer lock condition -> VUK ball to rooftop -> Doctor Atlantean Jackpot.
# Ends when multiball collapses to one ball.

mode:
  start_events: start_mode_invasion_from_everywhere
  stop_events:
    - ball_will_end
    - bonus_start
    - stop_mode_invasion_from_everywhere
    - ball_ended
  code: invasion_from_everywhere.InvasionFromEverywhere
  priority: 800

multiballs:
  invasion_from_everywhere_multiball:
    ball_count: 3
    ball_count_type: total
    shoot_again: 20s
    start_events: invasion_from_everywhere_start_multiball
    add_a_ball_events:
      - invasion_from_everywhere_add_a_ball
    add_a_ball_shoot_again: 15s
    add_a_ball_hurry_up_time: 3s
    stop_events:
      - stop_mode_invasion_from_everywhere

variable_player:
  multiball_invasion_from_everywhere_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_invasion_from_everywhere_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

widget_player:
  mode_invasion_from_everywhere_started:
    invasion_from_everywhere:
      action: play
  invasion_from_everywhere_mode_complete:
    invasion_from_everywhere:
      action: remove
  mode_invasion_from_everywhere_stopping:
    invasion_from_everywhere:
      action: remove

# Keep banks playable during the wizard except while DeVargas deliberately
# restages the right bank in Python.
event_player:
  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset
  mode_invasion_from_everywhere_started:
    - disable_daily_bugle_mystery
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
  mode_invasion_from_everywhere_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - rooftop_diverter_close

