#config_version=6

mode:
  start_events:
    # Normal balls get a skill shot immediately.
    # Chapter-select transition balls wait until the player selects a chapter,
    # then the selected/plunged ball gets the normal skill shot.
    - normal_game_ball_started{current_player.chapter_select_needed != 1}
    - chapter_select_confirmed
  stop_events:
    - finish_skillshot2
    - start_mode_chapter_select
    - mode_chapter_select_started
  priority: 500
  code: skillshot.SkillShot


event_player:
  mode_skillshot_started:
    - play_chapter_base_music

  skillshot_awarded:
    - show_skillshot_result
    - skillshot_success_callout
    - skillshot_clear_lit_shot
    - finish_skillshot|2s

  skillshot_missed:
    - show_skillshot_result
    - skillshot_missed_callout
    - skillshot_clear_lit_shot
    - finish_skillshot|2s    

  finish_skillshot:
    - finish_skillshot2|100ms

variable_player:
  finish_skillshot:
    skillshot_active: 0

widget_player:
  mode_skillshot_started:
    skillshot:
      action: play

  mode_skillshot_stopping:
    skillshot:
      action: remove

  show_skillshot_result:
    skillshot_completed:
      action: play
      expire: 2s



sound_player:
  mode_skillshot_started:
    ticking:
      action: play
      bus: effects
      loops: -1

  skillshot_awarded:
    ticking:
      action: stop

  skillshot_missed:
    ticking:
      action: stop

  mode_skillshot_stopping:
    ticking:
      action: stop

  skillshot_success_callout:
    drum_1:
      action: play
      bus: effects


# ----------------------------
# Skill shot lights
# ----------------------------

show_player:

  # Cover normal guidance without stopping its shows or changing earned state.
  # Mode priority 500 beats Daily Bugle (300) and qualification (115 + 10).
  # The selected shot runs one priority higher than this off layer.
  mode_skillshot_started:
    skillshot_unselected_off:
      key: skillshot_unselected_mask
      priority: -1

  # Release normal lighting as soon as the attempt resolves, before the
  # two-second result display finishes. Navigation only clears the lit show.
  skillshot_awarded:
    skillshot_unselected_mask:
      action: stop
    skillshot_saucer_guidance:
      action: stop

  skillshot_missed:
    skillshot_unselected_mask:
      action: stop
    skillshot_saucer_guidance:
      action: stop

  skillshot_saucers_ready:
    skillshot_saucer_slow_red:
      key: skillshot_saucer_guidance

  skillshot_saucers_clear:
    skillshot_saucer_guidance:
      action: stop

  skillshot_clear_lit_shot:
    skillshot_lit_show:
      action: stop

  skillshot_lit_saucer_left:
    flash_skillshot:
      key: skillshot_lit_show
      show_tokens:
        lights: l_1

  skillshot_lit_saucer_center:
    flash_skillshot:
      key: skillshot_lit_show
      show_tokens:
        lights: l_2

  skillshot_lit_saucer_right:
    flash_skillshot:
      key: skillshot_lit_show
      show_tokens:
        lights: l_3

  skillshot_lit_star:
    flash_skillshot:
      key: skillshot_lit_show
      show_tokens:
        lights: l_star, l_star2

  skillshot_lit_upper_a:
    flash_skillshot:
      key: skillshot_lit_show
      show_tokens:
        lights: l_a_rollover

  skillshot_lit_upper_b:
    flash_skillshot:
      key: skillshot_lit_show
      show_tokens:
        lights: l_b_rollover

  mode_skillshot_stopping:
    skillshot_lit_show:
      action: stop
    skillshot_unselected_mask:
      action: stop
    skillshot_saucer_guidance:
      action: stop



shows:
  # Red hole lamps advertise any-saucer starts. The selected saucer also
  # flashes its numbered insert to advertise the full villain choice.
  skillshot_saucer_slow_red:
  - duration: 1s
    lights:
      l_1_hole_l: {color: FF0000, fade: 1s}
      l_1_hole_r: {color: FF0000, fade: 1s}
      l_2_hole_l: {color: FF0000, fade: 1s}
      l_2_hole_r: {color: FF0000, fade: 1s}
      l_3_hole_l: {color: FF0000, fade: 1s}
      l_3_hole_r: {color: FF0000, fade: 1s}
  - duration: 1s
    lights:
      l_1_hole_l: {color: "400000", fade: 1s}
      l_1_hole_r: {color: "400000", fade: 1s}
      l_2_hole_l: {color: "400000", fade: 1s}
      l_2_hole_r: {color: "400000", fade: 1s}
      l_3_hole_l: {color: "400000", fade: 1s}
      l_3_hole_r: {color: "400000", fade: 1s}

  skillshot_unselected_off:
  - duration: -1
    lights:
      l_1: off
      l_2: off
      l_3: off
      l_star: off
      l_star2: off
      l_a_rollover: off
      l_b_rollover: off
      l_right_a: off
      l_left_b: off

  flash_skillshot:
  - duration: 500ms
    lights:
      (lights): white

  - duration: 500ms
    lights:
      (lights): off  
