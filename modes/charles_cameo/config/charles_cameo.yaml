#config_version=6

# Charles Cameo — Double Identity.
# Complete mirrored pairs in order: Pops, Drops, A+B, then the two web targets
# for a 1M Super. More Jackpots inserts left/right upper targets first.

mode:
  start_events: start_mode_charles_cameo
  stop_events:
    - charles_cameo_mode_complete
    - charles_cameo_mode_completed_summary
    - ball_ended
  code: charles_cameo.CharlesCameo
  priority: 300

widget_player:
  mode_charles_cameo_started:
    charles_cameo: {action: play}
  charles_cameo_mode_complete:
    charles_cameo: {action: remove}
  mode_charles_cameo_stopping:
    charles_cameo: {action: remove}

event_player:
  s_upper_target_left_active: charles_cameo_upper_left_hit
  s_upper_target_right_active: charles_cameo_upper_right_hit

  s_pop_left_active: charles_cameo_pop_left_hit
  s_pop_right_active: charles_cameo_pop_right_hit

  s_left_drops_1_active: charles_cameo_drop_left_hit
  s_left_drops_2_active: charles_cameo_drop_left_hit
  s_left_drops_3_active: charles_cameo_drop_left_hit
  s_left_drops_rubber_active: charles_cameo_drop_left_hit
  s_left_drops_top_left_rubber_active: charles_cameo_drop_left_hit
  s_left_drops_top_right_rubber_active: charles_cameo_drop_left_hit

  s_right_drops_1_active: charles_cameo_drop_right_hit
  s_right_drops_2_active: charles_cameo_drop_right_hit
  s_right_drops_3_active: charles_cameo_drop_right_hit
  s_right_drops_4_active: charles_cameo_drop_right_hit
  s_right_drops_5_active: charles_cameo_drop_right_hit
  s_right_drops_rubber_active: charles_cameo_drop_right_hit
  s_right_drops_top_rubber_active: charles_cameo_drop_right_hit

  s_inlane_a_active: charles_cameo_a_hit
  s_inlane_b_active: charles_cameo_b_hit
  s_inlane_m_r_active: charles_cameo_a_hit
  s_inlane_m_l_active: charles_cameo_b_hit

  s_web_target_left_active: charles_cameo_web_left_hit
  s_web_target_mid_active: charles_cameo_web_right_hit

  # Saucers are not part of the mode.
  s_saucer_1_active: clear_saucers_delayed
  s_saucer_2_active: clear_saucers_delayed
  s_saucer_3_active: clear_saucers_delayed

  mode_charles_cameo_stopping:
    - clear_saucers_delayed
    - charles_cameo_clear_all
    - rooftop_diverter_close

sound_player:
  charles_cameo_jackpot_collected:
    jackpot:
      action: play
      bus: effects
  charles_cameo_super_jackpot_collected:
    jackpot:
      action: play
      bus: effects

show_player:
  mode_charles_cameo_started:
    charles_cameo_mode_gi: {action: play, loops: -1}

  charles_cameo_upper_left_source:
    charles_cameo_upper_left_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_upper_left_mirror:
    charles_cameo_upper_left_pulse: {action: play, loops: -1, speed: 2}
  charles_cameo_upper_right_source:
    charles_cameo_upper_right_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_upper_right_mirror:
    charles_cameo_upper_right_pulse: {action: play, loops: -1, speed: 2}

  charles_cameo_pops_left_source:
    charles_cameo_left_pop_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_pops_left_mirror:
    charles_cameo_left_pop_pulse: {action: play, loops: -1, speed: 2}
  charles_cameo_pops_right_source:
    charles_cameo_right_pop_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_pops_right_mirror:
    charles_cameo_right_pop_pulse: {action: play, loops: -1, speed: 2}

  charles_cameo_drops_left_source:
    charles_cameo_left_bank_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_drops_left_mirror:
    charles_cameo_left_bank_pulse: {action: play, loops: -1, speed: 2}
  charles_cameo_drops_right_source:
    charles_cameo_right_bank_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_drops_right_mirror:
    charles_cameo_right_bank_pulse: {action: play, loops: -1, speed: 2}

  charles_cameo_ab_a_source:
    charles_cameo_a_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_ab_a_mirror:
    charles_cameo_a_pulse: {action: play, loops: -1, speed: 2}
  charles_cameo_ab_b_source:
    charles_cameo_b_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_ab_b_mirror:
    charles_cameo_b_pulse: {action: play, loops: -1, speed: 2}

  charles_cameo_webs_left_source:
    charles_cameo_left_web_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_webs_left_mirror:
    charles_cameo_left_web_pulse: {action: play, loops: -1, speed: 2}
  charles_cameo_webs_right_source:
    charles_cameo_right_web_pulse: {action: play, loops: -1, speed: 1}
  charles_cameo_webs_right_mirror:
    charles_cameo_right_web_pulse: {action: play, loops: -1, speed: 2}

  charles_cameo_jackpot_collected:
    charles_cameo_jackpot_flash: {action: play, loops: 1}
  charles_cameo_super_jackpot_collected:
    charles_cameo_super_flash: {action: play, loops: 2}

  charles_cameo_clear_shots:
    charles_cameo_upper_left_pulse: {action: stop}
    charles_cameo_upper_right_pulse: {action: stop}
    charles_cameo_left_pop_pulse: {action: stop}
    charles_cameo_right_pop_pulse: {action: stop}
    charles_cameo_left_bank_pulse: {action: stop}
    charles_cameo_right_bank_pulse: {action: stop}
    charles_cameo_a_pulse: {action: stop}
    charles_cameo_b_pulse: {action: stop}
    charles_cameo_left_web_pulse: {action: stop}
    charles_cameo_right_web_pulse: {action: stop}

  charles_cameo_clear_all:
    charles_cameo_mode_gi: {action: stop}
    charles_cameo_upper_left_pulse: {action: stop}
    charles_cameo_upper_right_pulse: {action: stop}
    charles_cameo_left_pop_pulse: {action: stop}
    charles_cameo_right_pop_pulse: {action: stop}
    charles_cameo_left_bank_pulse: {action: stop}
    charles_cameo_right_bank_pulse: {action: stop}
    charles_cameo_a_pulse: {action: stop}
    charles_cameo_b_pulse: {action: stop}
    charles_cameo_left_web_pulse: {action: stop}
    charles_cameo_right_web_pulse: {action: stop}
    charles_cameo_jackpot_flash: {action: stop}
    charles_cameo_super_flash: {action: stop}

light_player:
  charles_cameo_clear_all:
    gi: stop
    l_upper_left: stop
    l_upper_right: stop
    l_gi_3bank: stop
    l_gi_5bank_lower: stop
    l_gi_5bank_upper: stop
    l_a_rollover: stop
    l_b_rollover: stop
    l_right_a: stop
    l_left_b: stop
    l_left_web_target: stop
    l_mid_web_target: stop

shows:
  charles_cameo_mode_gi:
    - duration: 1s
      lights: {gi: D0D8E8}

  charles_cameo_upper_left_pulse:
    - duration: 500ms
      lights: {l_upper_left: F0D060}
    - duration: 500ms
      lights: {l_upper_left: "302810"}
  charles_cameo_upper_right_pulse:
    - duration: 500ms
      lights: {l_upper_right: F0D060}
    - duration: 500ms
      lights: {l_upper_right: "302810"}

  charles_cameo_left_pop_pulse:
    - duration: 500ms
      lights:
        l_pop_1_1: F0D060
        l_pop_1_2: F0D060
        l_pop_1_3: F0D060
        l_pop_1_4: F0D060
        l_pop_1_5: F0D060
        l_pop_1_6: F0D060
        l_pop_1_7: F0D060
        l_pop_1_8: F0D060
        l_pop_1_9: F0D060
        l_pop_1_10: F0D060
        l_pop_1_11: F0D060
        l_pop_1_12: F0D060
    - duration: 500ms
      lights:
        l_pop_1_1: "302810"
        l_pop_1_2: "302810"
        l_pop_1_3: "302810"
        l_pop_1_4: "302810"
        l_pop_1_5: "302810"
        l_pop_1_6: "302810"
        l_pop_1_7: "302810"
        l_pop_1_8: "302810"
        l_pop_1_9: "302810"
        l_pop_1_10: "302810"
        l_pop_1_11: "302810"
        l_pop_1_12: "302810"

  charles_cameo_right_pop_pulse:
    - duration: 500ms
      lights:
        l_pop_2_1: F0D060
        l_pop_2_2: F0D060
        l_pop_2_3: F0D060
        l_pop_2_4: F0D060
        l_pop_2_5: F0D060
        l_pop_2_6: F0D060
        l_pop_2_7: F0D060
        l_pop_2_8: F0D060
        l_pop_2_9: F0D060
        l_pop_2_10: F0D060
        l_pop_2_11: F0D060
        l_pop_2_12: F0D060
    - duration: 500ms
      lights:
        l_pop_2_1: "302810"
        l_pop_2_2: "302810"
        l_pop_2_3: "302810"
        l_pop_2_4: "302810"
        l_pop_2_5: "302810"
        l_pop_2_6: "302810"
        l_pop_2_7: "302810"
        l_pop_2_8: "302810"
        l_pop_2_9: "302810"
        l_pop_2_10: "302810"
        l_pop_2_11: "302810"
        l_pop_2_12: "302810"

  charles_cameo_left_bank_pulse:
    - duration: 500ms
      lights: {l_gi_3bank: F0D060}
    - duration: 500ms
      lights: {l_gi_3bank: "302810"}
  charles_cameo_right_bank_pulse:
    - duration: 500ms
      lights:
        l_gi_5bank_lower: F0D060
        l_gi_5bank_upper: F0D060
    - duration: 500ms
      lights:
        l_gi_5bank_lower: "302810"
        l_gi_5bank_upper: "302810"

  charles_cameo_a_pulse:
    - duration: 500ms
      lights:
        l_a_rollover: yellow
        l_right_a: yellow
    - duration: 500ms
      lights:
        l_a_rollover: "302800"
        l_right_a: "302800"
  charles_cameo_b_pulse:
    - duration: 500ms
      lights:
        l_b_rollover: yellow
        l_left_b: yellow
    - duration: 500ms
      lights:
        l_b_rollover: "302800"
        l_left_b: "302800"

  charles_cameo_left_web_pulse:
    - duration: 500ms
      lights: {l_left_web_target: F0D060}
    - duration: 500ms
      lights: {l_left_web_target: "302810"}
  charles_cameo_right_web_pulse:
    - duration: 500ms
      lights: {l_mid_web_target: F0D060}
    - duration: 500ms
      lights: {l_mid_web_target: "302810"}

  charles_cameo_jackpot_flash:
    - duration: 150ms
      lights: {gi: FFFFFF}
    - duration: 150ms
      lights: {gi: D0D8E8}
  charles_cameo_super_flash:
    - duration: 150ms
      lights: {gi: FFFFFF}
    - duration: 150ms
      lights: {gi: F0D060}
