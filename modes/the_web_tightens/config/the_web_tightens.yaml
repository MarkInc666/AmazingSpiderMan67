#config_version=6

mode:
  start_events: start_mode_the_web_tightens
  stop_events:
    - ball_will_end
    - bonus_start
    - stop_mode_the_web_tightens
    - ball_ended
  code: the_web_tightens.TheWebTightens
  priority: 800

multiballs:
  the_web_tightens_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 15s
    start_events: the_web_tightens_start_multiball
    add_a_ball_events:
      - the_web_tightens_add_a_ball
    add_a_ball_shoot_again: 10s
    add_a_ball_hurry_up_time: 3s
    stop_events:
      - stop_mode_the_web_tightens

variable_player:
  multiball_the_web_tightens_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_the_web_tightens_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

widget_player:
  mode_the_web_tightens_started:
    the_web_tightens:
      action: play
  the_web_tightens_mode_complete:
    the_web_tightens:
      action: remove
  mode_the_web_tightens_stopping:
    the_web_tightens:
      action: remove

# Shared physical cleanup. Gameplay switches are claimed in the Python mode so
# phase dispatch can safely reuse the Fiddler, Slayer, and six-zone shot maps.
event_player:
  mode_the_web_tightens_started:
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
  mode_the_web_tightens_stopping:
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

show_player:
  the_web_tightens_vuk_lock_ready:
    shared_final_vuk_chase:
      loops: -1
      priority: 840
      show_tokens:
        color: 8060FF
  the_web_tightens_vuk_locked:
    shared_final_vuk_chase:
      action: stop

  the_web_tightens_conquistador_web:
    shared_center_web_chase:
      loops: -1
      priority: 840
      show_tokens:
        color: FFFFFF
  the_web_tightens_clear_phase_lights:
    shared_center_web_chase:
      action: stop
  the_web_tightens_super_ready:
    the_web_tightens_clock_tower_super_flash:
      loops: -1
      priority: 850
  the_web_tightens_super_collected:
    the_web_tightens_clock_tower_super_flash:
      action: stop

  the_web_tightens_clear_all:
    shared_final_vuk_chase:
      action: stop
    shared_center_web_chase:
      action: stop
    the_web_tightens_clock_tower_super_flash:
      action: stop

