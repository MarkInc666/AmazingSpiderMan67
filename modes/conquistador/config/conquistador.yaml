#config_version=6

# Conquistador placeholder villain mode.
# Mode idea: FIND THE FOUNTAIN.

mode:
  start_events: start_mode_conquistador
  stop_events:
    - conquistador_mode_complete
    - conquistador_mode_completed_summary
    - ball_ended
  code: conquistador.Conquistador
  priority: 300

widget_player:
  mode_conquistador_started:
    conquistador:
      action: play

  conquistador_mode_complete:
    conquistador:
      action: remove

  mode_conquistador_stopping:
    conquistador:
      action: remove

event_player:
  # Common playfield hits. Refine these later when the mode design is built out.
  s_pop_left_active: conquistador_shot_hit
  s_pop_right_active: conquistador_shot_hit
  s_trispinner_opto_active: conquistador_shot_hit
  s_web_spinner_active: conquistador_shot_hit
  s_star_rollover_active: conquistador_shot_hit
  s_upper_target_left_active: conquistador_shot_hit
  s_upper_target_center_active: conquistador_shot_hit
  s_upper_target_right_active: conquistador_shot_hit

  s_left_drops_1_active: conquistador_shot_hit
  s_left_drops_2_active: conquistador_shot_hit
  s_left_drops_3_active: conquistador_shot_hit
  s_right_drops_1_active: conquistador_shot_hit
  s_right_drops_2_active: conquistador_shot_hit
  s_right_drops_3_active: conquistador_shot_hit
  s_right_drops_4_active: conquistador_shot_hit
  s_right_drops_5_active: conquistador_shot_hit

  s_saucer_1_active:
    - conquistador_major_hit
    - clear_saucers
  s_saucer_2_active:
    - conquistador_major_hit
    - clear_saucers
  s_saucer_3_active:
    - conquistador_major_hit
    - clear_saucers
  s_vuk_switch_active: conquistador_major_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  mode_conquistador_started:
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_conquistador_stopping:
    - clear_saucers

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_conquistador_started:
    gi: 7050A0

  mode_conquistador_stopping:
    gi: E0E0E0

