#config_version=6

# HarleyClivendon placeholder villain mode.
# Mode idea: HYPNOTIC SCHEME.

mode:
  start_events: start_mode_harley_clivendon
  stop_events:
    - harley_clivendon_mode_complete
    - harley_clivendon_mode_completed_summary
    - ball_ended
  code: harley_clivendon.HarleyClivendon
  priority: 300

widget_player:
  mode_harley_clivendon_started:
    harley_clivendon:
      action: play

  harley_clivendon_mode_complete:
    harley_clivendon:
      action: remove

  mode_harley_clivendon_stopping:
    harley_clivendon:
      action: remove

event_player:
  # Common playfield hits. Refine these later when the mode design is built out.
  s_pop_left_active: harley_clivendon_shot_hit
  s_pop_right_active: harley_clivendon_shot_hit
  s_trispinner_opto_active: harley_clivendon_shot_hit
  s_web_spinner_active: harley_clivendon_shot_hit
  s_star_rollover_active: harley_clivendon_shot_hit
  s_upper_target_left_active: harley_clivendon_shot_hit
  s_upper_target_center_active: harley_clivendon_shot_hit
  s_upper_target_right_active: harley_clivendon_shot_hit

  s_left_drops_1_active: harley_clivendon_shot_hit
  s_left_drops_2_active: harley_clivendon_shot_hit
  s_left_drops_3_active: harley_clivendon_shot_hit
  s_right_drops_1_active: harley_clivendon_shot_hit
  s_right_drops_2_active: harley_clivendon_shot_hit
  s_right_drops_3_active: harley_clivendon_shot_hit
  s_right_drops_4_active: harley_clivendon_shot_hit
  s_right_drops_5_active: harley_clivendon_shot_hit

  s_saucer_1_active:
    - harley_clivendon_major_hit
    - clear_saucers
  s_saucer_2_active:
    - harley_clivendon_major_hit
    - clear_saucers
  s_saucer_3_active:
    - harley_clivendon_major_hit
    - clear_saucers
  s_vuk_switch_active: harley_clivendon_major_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  mode_harley_clivendon_started:
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_harley_clivendon_stopping:
    - clear_saucers

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_harley_clivendon_started:
    gi: 7050A0

  mode_harley_clivendon_stopping:
    gi: E0E0E0

