#config_version=6

mode:
  start_events: start_mode_harley_clivendon
  stop_events:
    - ball_will_end
    - bonus_start
    - harley_clivendon_mode_complete
    - harley_clivendon_mode_completed_summary
    - ball_ended
  code: harley_clivendon.HarleyClivendon
  priority: 500

multiballs:
  harley_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: (current_player.harley_opening_save_seconds)
    start_events: harley_start_multiball
    stop_events:
      - harley_clivendon_mode_completed_summary
      - ball_ended

variable_player:
  multiball_harley_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_harley_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0
  mode_harley_clivendon_stopping:
    multiball_autoplunge_active:
      action: set
      int: 0

widget_player:
  mode_harley_clivendon_started:
    harley_clivendon: {action: play}
  mode_harley_clivendon_stopping:
    harley_clivendon: {action: remove}

event_player:
  s_sling_l_active: harley_area_left_sling
  s_sling_r_active: harley_area_right_sling
  s_pop_left_active: harley_area_left_pop
  s_pop_right_active: harley_area_right_pop
  s_web_target_left_active: harley_area_left_web
  s_web_target_mid_active: harley_area_center_web

  s_left_drops_1_active: harley_area_left_bank
  s_left_drops_2_active: harley_area_left_bank
  s_left_drops_3_active: harley_area_left_bank
  s_left_drops_rubber_active: harley_area_left_bank
  s_left_drops_top_left_rubber_active: harley_area_left_bank
  s_left_drops_top_right_rubber_active: harley_area_left_bank

  s_right_drops_1_active: harley_area_right_bank
  s_right_drops_2_active: harley_area_right_bank
  s_right_drops_3_active: harley_area_right_bank
  s_right_drops_4_active: harley_area_right_bank
  s_right_drops_5_active: harley_area_right_bank
  s_right_drops_rubber_active: harley_area_right_bank
  s_right_drops_top_rubber_active: harley_area_right_bank

  s_saucer_1_active: harley_saucer_1
  s_saucer_2_active: harley_saucer_2
  s_saucer_3_active: harley_saucer_3
  s_vuk_switch_active: harley_vuk_hit

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_harley_clivendon_started:
    - harley_saucers_available
    - rooftop_diverter_close

light_player:
  mode_harley_clivendon_started:
    gi: yellow
  mode_harley_clivendon_stopping:
    gi: E0E0E0

show_player:
  harley_saucers_available:
    harley_saucers_available_show: {loops: -1}
    harley_saucer_1_held_show: {action: stop}
    harley_saucer_2_held_show: {action: stop}
    harley_saucer_3_held_show: {action: stop}
  harley_saucers_unavailable:
    harley_saucers_available_show: {action: stop}
  harley_saucer_1_held:
    harley_saucer_1_held_show: {loops: -1}
  harley_saucer_2_held:
    harley_saucer_2_held_show: {loops: -1}
  harley_saucer_3_held:
    harley_saucer_3_held_show: {loops: -1}
  harley_saucer_released:
    harley_saucer_1_held_show: {action: stop}
    harley_saucer_2_held_show: {action: stop}
    harley_saucer_3_held_show: {action: stop}
  harley_vuk_ready:
    harley_vuk_ready_show: {loops: -1}
  harley_vuk_not_ready:
    harley_vuk_ready_show: {action: stop}
  harley_area_build_started:
    harley_left_sling_available_show: {loops: -1}
    harley_left_sling_lit_show: {action: stop}
    harley_right_sling_available_show: {loops: -1}
    harley_right_sling_lit_show: {action: stop}
    harley_left_pop_available_show: {loops: -1}
    harley_left_pop_lit_show: {action: stop}
    harley_right_pop_available_show: {loops: -1}
    harley_right_pop_lit_show: {action: stop}
    harley_left_bank_available_show: {loops: -1}
    harley_left_bank_lit_show: {action: stop}
    harley_right_bank_available_show: {loops: -1}
    harley_right_bank_lit_show: {action: stop}
    harley_left_web_available_show: {loops: -1}
    harley_left_web_lit_show: {action: stop}
    harley_center_web_available_show: {loops: -1}
    harley_center_web_lit_show: {action: stop}
  harley_area_lights_clear:
    harley_left_sling_available_show: {action: stop}
    harley_left_sling_lit_show: {action: stop}
    harley_right_sling_available_show: {action: stop}
    harley_right_sling_lit_show: {action: stop}
    harley_left_pop_available_show: {action: stop}
    harley_left_pop_lit_show: {action: stop}
    harley_right_pop_available_show: {action: stop}
    harley_right_pop_lit_show: {action: stop}
    harley_left_bank_available_show: {action: stop}
    harley_left_bank_lit_show: {action: stop}
    harley_right_bank_available_show: {action: stop}
    harley_right_bank_lit_show: {action: stop}
    harley_left_web_available_show: {action: stop}
    harley_left_web_lit_show: {action: stop}
    harley_center_web_available_show: {action: stop}
    harley_center_web_lit_show: {action: stop}
  harley_area_left_sling_lit:
    harley_left_sling_available_show: {action: stop}
    harley_left_sling_lit_show: {loops: -1}
  harley_area_right_sling_lit:
    harley_right_sling_available_show: {action: stop}
    harley_right_sling_lit_show: {loops: -1}
  harley_area_left_pop_lit:
    harley_left_pop_available_show: {action: stop}
    harley_left_pop_lit_show: {loops: -1}
  harley_area_right_pop_lit:
    harley_right_pop_available_show: {action: stop}
    harley_right_pop_lit_show: {loops: -1}
  harley_area_left_bank_lit:
    harley_left_bank_available_show: {action: stop}
    harley_left_bank_lit_show: {loops: -1}
  harley_area_right_bank_lit:
    harley_right_bank_available_show: {action: stop}
    harley_right_bank_lit_show: {loops: -1}
  harley_area_left_web_lit:
    harley_left_web_available_show: {action: stop}
    harley_left_web_lit_show: {loops: -1}
  harley_area_center_web_lit:
    harley_center_web_available_show: {action: stop}
    harley_center_web_lit_show: {loops: -1}
  harley_mode_ended:
    harley_saucers_available_show: {action: stop}
    harley_saucer_1_held_show: {action: stop}
    harley_saucer_2_held_show: {action: stop}
    harley_saucer_3_held_show: {action: stop}
    harley_vuk_ready_show: {action: stop}
    harley_left_sling_available_show: {action: stop}
    harley_left_sling_lit_show: {action: stop}
    harley_right_sling_available_show: {action: stop}
    harley_right_sling_lit_show: {action: stop}
    harley_left_pop_available_show: {action: stop}
    harley_left_pop_lit_show: {action: stop}
    harley_right_pop_available_show: {action: stop}
    harley_right_pop_lit_show: {action: stop}
    harley_left_bank_available_show: {action: stop}
    harley_left_bank_lit_show: {action: stop}
    harley_right_bank_available_show: {action: stop}
    harley_right_bank_lit_show: {action: stop}
    harley_left_web_available_show: {action: stop}
    harley_left_web_lit_show: {action: stop}
    harley_center_web_available_show: {action: stop}
    harley_center_web_lit_show: {action: stop}

shows:
  harley_saucers_available_show:
    - duration: 600ms
      lights:
        l_1_hole_l: red
        l_1_hole_r: red
        l_2_hole_l: red
        l_2_hole_r: red
        l_3_hole_l: red
        l_3_hole_r: red
    - duration: 600ms
      lights:
        l_1_hole_l: 400000
        l_1_hole_r: 400000
        l_2_hole_l: 400000
        l_2_hole_r: 400000
        l_3_hole_l: 400000
        l_3_hole_r: 400000
  harley_saucer_1_held_show:
    - duration: -1
      lights: {l_1_hole_l: red, l_1_hole_r: red}
  harley_saucer_2_held_show:
    - duration: -1
      lights: {l_2_hole_l: red, l_2_hole_r: red}
  harley_saucer_3_held_show:
