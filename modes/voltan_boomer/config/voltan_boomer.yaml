#config_version=6

# Voltan and Boomer placeholder villain mode.
# Mode idea: Shots freeze one by one; hit thaw shots to restore them and cash freeze jackpot.

mode:
  start_events: start_mode_voltan_boomer
  stop_events:
    - voltan_boomer_mode_complete
    - voltan_boomer_mode_completed_summary
    - ball_ended
  code: voltan_boomer.VoltanBoomer
  priority: 300

widget_player:
  mode_voltan_boomer_started:
    voltan_boomer:
      action: play

  voltan_boomer_mode_complete:
    voltan_boomer:
      action: remove

  mode_voltan_boomer_stopping:
    voltan_boomer:
      action: remove

event_player:
  # Common playfield hits. Refine these later when the mode design is built out.
  s_pop_left_active: voltan_boomer_shot_hit
  s_pop_right_active: voltan_boomer_shot_hit
  s_trispinner_opto_active: voltan_boomer_shot_hit
  s_web_spinner_active: voltan_boomer_shot_hit
  s_star_rollover_active: voltan_boomer_shot_hit
  s_upper_target_left_active: voltan_boomer_shot_hit
  s_upper_target_center_active: voltan_boomer_shot_hit
  s_upper_target_right_active: voltan_boomer_shot_hit

  s_left_drops_1_active: voltan_boomer_shot_hit
  s_left_drops_2_active: voltan_boomer_shot_hit
  s_left_drops_3_active: voltan_boomer_shot_hit
  s_right_drops_1_active: voltan_boomer_shot_hit
  s_right_drops_2_active: voltan_boomer_shot_hit
  s_right_drops_3_active: voltan_boomer_shot_hit
  s_right_drops_4_active: voltan_boomer_shot_hit
  s_right_drops_5_active: voltan_boomer_shot_hit

  s_saucer_1_active:
    - voltan_boomer_major_hit
    - clear_saucers
  s_saucer_2_active:
    - voltan_boomer_major_hit
    - clear_saucers
  s_saucer_3_active:
    - voltan_boomer_major_hit
    - clear_saucers
  s_vuk_switch_active: voltan_boomer_major_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  mode_voltan_boomer_started:
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset



light_player:
  # Full-playfield GI theme while this mode is active.
  mode_voltan_boomer_started:
    gi: 50D8FF

  mode_voltan_boomer_stopping:
    gi: E0E0E0

