#config_version=6


mode:
  start_events: start_mode_electro
  stop_events:
    - ball_will_end
    - bonus_start
    - electro_mode_complete
    - electro_mode_completed_summary
    - ball_ended
  code: electro.Electro
  priority: 300


widget_player:
  mode_electro_started:
    electro:
      action: play

  electro_mode_complete:
    electro:
      action: remove

  mode_electro_stopping:
    electro:
      action: remove

random_event_player:
  electro_jackpot_collected:
    - electro_jackpot_collected_1  
    - electro_jackpot_collected_2  
    - electro_jackpot_collected_3  

  electro_lit_shot_changed:
    - electro_jackpot_moved_1  
    - electro_jackpot_moved_2  
    - electro_jackpot_moved_3  


sound_player:
  electro_jackpot_moved_1:
    spark_1:
      action: play
      bus: effects

  electro_jackpot_moved_2:
    spark_2:
      action: play
      bus: effects

  electro_jackpot_moved_3:
    electro_zap:
      action: play
      bus: effects

  electro_jackpot_collected_1:
    light_smash_1:
      action: play
      bus: effects

  electro_jackpot_collected_2:
    light_smash_2:
      action: play
      bus: effects

  electro_jackpot_collected_3:
    light_smash_3:
      action: play
      bus: effects

  electro_super_collected:
    jackpot:
      action: play
      bus: effects



event_player:
  electro_mode_almost_complete:
    - electro_mode_complete|2s

  electro_startup_complete:
    - reset_drops
    - clear_saucers_delayed

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  # -------------------------------
  # Real switches / shot groups -> Electro Python events
  # -------------------------------
  s_web_target_left_active: electro_left_web_hit
  s_pop_left_active: electro_left_pop_hit
  elect_left_drops_hit: electro_left_drops_hit
  s_pop_right_active: electro_right_pop_hit
  s_saucer_1_active: clear_saucers_delayed
  s_saucer_2_active: clear_saucers_delayed
  s_saucer_3_active: clear_saucers_delayed
  s_web_target_mid_active: electro_right_web_hit
  s_trispinner_opto_active: electro_upper_spinner_hit
  elect_upper_targets_hit: electro_upper_target_hit
  elect_right_drops_hit: electro_right_drops_hit

  # -------------------------------
  # Timer completions -> Python
  # -------------------------------
  timer_electro_shot_timer_complete: electro_lit_shot_timeout
  timer_electro_shot_assist_timer_complete: electro_lit_shot_timeout
  timer_electro_upper_shot_timer_complete: electro_lit_shot_timeout
  timer_electro_upper_shot_assist_timer_complete: electro_lit_shot_timeout
  timer_electro_super_timer_complete: electro_super_timeout
  timer_electro_upper_super_timer_complete: electro_super_timeout


shot_groups:
  elect_right_drops:
    shots: electro_right_drop_1, electro_right_drop_2, electro_right_drop_3, electro_right_drop_4, electro_right_drop_5

  elect_left_drops:
    shots: electro_left_drop_1, electro_left_drop_2, electro_left_drop_3

  elect_upper_targets:
    shots: electro_upper_target_left, electro_upper_target_center, electro_upper_target_right

shots:

  electro_upper_target_left:
    switch: s_upper_target_left

  electro_upper_target_center:
    switch: s_upper_target_center

  electro_upper_target_right:
    switch: s_upper_target_right

  electro_right_drop_1:
    switch: s_right_drops_1

  electro_right_drop_2:
    switch: s_right_drops_2

  electro_right_drop_3:
    switch: s_right_drops_3

  electro_right_drop_4:
    switch: s_right_drops_4

  electro_right_drop_5:
    switch: s_right_drops_5

  electro_left_drop_1:
    switch: s_left_drops_1

  electro_left_drop_2:
    switch: s_left_drops_2

  electro_left_drop_3:
    switch: s_left_drops_3


timers:
  electro_shot_timer:
    start_value: 5
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: electro_shot_timer_start
        action: restart
      - event: electro_shot_timer_stop
        action: stop
      - event: mode_electro_stopping
        action: stop

  electro_shot_assist_timer:
    start_value: 8
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: electro_shot_assist_timer_start
        action: restart
      - event: electro_shot_assist_timer_stop
        action: stop
      - event: mode_electro_stopping
        action: stop

  electro_upper_shot_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: electro_upper_shot_timer_start
        action: restart
      - event: electro_upper_shot_timer_stop
        action: stop
      - event: mode_electro_stopping
        action: stop

  electro_upper_shot_assist_timer:
    start_value: 13
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: electro_upper_shot_assist_timer_start
        action: restart
      - event: electro_upper_shot_assist_timer_stop
        action: stop
      - event: mode_electro_stopping
        action: stop

  electro_super_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: electro_super_timer_start
        action: restart
      - event: electro_super_timer_stop
        action: stop
      - event: mode_electro_stopping
        action: stop

  electro_upper_super_timer:
    start_value: 15
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: electro_upper_super_timer_start
        action: restart
      - event: electro_upper_super_timer_stop
        action: stop
      - event: mode_electro_stopping
        action: stop

  electro_value_timer:
    start_value: 100
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: electro_value_timer_start
        action: restart
      - event: electro_value_timer_stop
        action: stop
      - event: mode_electro_stopping
        action: stop

show_player:
  electro_vuk_chase_start:
    shared_final_vuk_chase:
      loops: -1
      priority: 340
      show_tokens:
        color: "F0F040"
  electro_vuk_chase_stop:
    shared_final_vuk_chase:
      action: stop
  electro_center_web_chase_start:
    shared_center_web_chase:
      loops: -1
      priority: 340
      show_tokens:
        color: "FFFFFF"
  electro_center_web_chase_stop:
    shared_center_web_chase:
      action: stop

  electro_mode_started:
    electro_mode_start_show:
      loops: 0

  # Normal lit shots
  electro_lite_left_web:
    electro_left_web_lit_show:
      loops: -1
  electro_lite_left_pop:
    electro_left_pop_lit_show:
      loops: -1
  electro_lite_left_drops:
    electro_left_drops_lit_show:
      loops: -1
  electro_lite_right_pop:
    electro_right_pop_lit_show:
      loops: -1
  electro_lite_right_web:
    electro_right_web_lit_show:
      loops: -1
  electro_lite_upper_spinner:
    electro_upper_spinner_lit_show:
      loops: -1
  electro_lite_upper_targets:
    electro_upper_targets_lit_show:
      loops: -1
  electro_lite_right_drops:
    electro_right_drops_lit_show:
      loops: -1

  # Stop normal lit shots
  electro_stop_left_web:
    electro_left_web_lit_show:
      action: stop
  electro_stop_left_pop:
    electro_left_pop_lit_show:
      action: stop
  electro_stop_left_drops:
    electro_left_drops_lit_show:
      action: stop
  electro_stop_right_pop:
    electro_right_pop_lit_show:
      action: stop
  electro_stop_right_web:
    electro_right_web_lit_show:
      action: stop
  electro_stop_upper_spinner:
    electro_upper_spinner_lit_show:
      action: stop
  electro_stop_upper_targets:
    electro_upper_targets_lit_show:
      action: stop
  electro_stop_right_drops:
    electro_right_drops_lit_show:
      action: stop

  # Super jackpot lit shots
  electro_super_lite_left_web:
    electro_left_web_super_show:
      loops: -1
  electro_super_lite_left_pop:
    electro_left_pop_super_show:
      loops: -1
  electro_super_lite_left_drops:
    electro_left_drops_super_show:
      loops: -1
  electro_super_lite_right_pop:
    electro_right_pop_super_show:
      loops: -1
  electro_super_lite_right_web:
    electro_right_web_super_show:
      loops: -1
  electro_super_lite_upper_spinner:
    electro_upper_spinner_super_show:
      loops: -1
  electro_super_lite_upper_targets:
    electro_upper_targets_super_show:
      loops: -1
  electro_super_lite_right_drops:
    electro_right_drops_super_show:
      loops: -1

  electro_super_collected:
    electro_super_collected_show:
      loops: 0
  electro_mode_complete:
    electro_mode_complete_show:
      loops: 0

