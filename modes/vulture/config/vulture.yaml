#config_version=6

mode:
  start_events: start_mode_vulture
  stop_events:
    - ball_will_end
    - bonus_start
    - vulture_mode_complete
    - vulture_mode_completed_summary
    - ball_ended
  code: vulture.Vulture
  priority: 300

multiballs:
  vulture_add_a_ball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 10s
    start_events: start_vulture_add_a_ball

variable_player:
  multiball_vulture_add_a_ball_started:
    multiball_autoplunge_active:
      action: set
      int: 1

  multiball_vulture_add_a_ball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

  timer_vulture_mode_timer_complete:
    vulture_time_expired:
      action: set
      int: 1

  mode_vulture_started:
    vulture_time_expired:
      action: set
      int: 0

widget_player:
  mode_vulture_started:
    vulture:
      action: play

  vulture_mode_complete:
    vulture:
      action: remove

  mode_vulture_stopping:
    vulture:
      action: remove

event_player:
  mode_vulture_started:
    - rooftop_diverter_open|500ms
    - clear_saucers_delayed
    - vulture_show_targets

  mode_vulture_stopping:
    - rooftop_diverter_close
    - vulture_gi_stop

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  s_saucer_1_active:
    - clear_saucers_delayed

  s_saucer_2_active:
    - clear_saucers_delayed

  s_saucer_3_active:
    - clear_saucers_delayed

  timer_vulture_mode_timer_complete{current_player.multiball_autoplunge_active == 0}:
    - vulture_mode_complete

  multiball_vulture_add_a_ball_ended{current_player.vulture_time_expired == 1}:
    - vulture_mode_complete

  s_upper_entrance_opto_active:
    - vulture_upper_entered

  s_upper_exit_left_opto_active:
    - vulture_upper_exited

  s_upper_exit_right_opto_active:
    - vulture_upper_exited

  s_inlane_m_r_active:
    - vulture_gi_lower

  s_upper_target_left_active:
    - vulture_left_target_hit

  s_upper_target_center_active:
    - vulture_center_target_hit

  s_upper_target_right_active:
    - vulture_right_target_hit

  s_trispinner_opto_active:
    - vulture_spinner_hit

  # Once rooftop entry starts the mode timer, the lower spinner contributes
  # the same combined target value as the upper spinner.
  s_web_spinner_active:
    - vulture_spinner_hit

timers:
  vulture_mode_timer:
    start_value: 40
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: vulture_timer_start
        action: start
      - event: vulture_mode_complete
        action: stop
      - event: mode_vulture_stopping
        action: stop

show_player:
  vulture_show_left_yellow:
    vulture_left_red:
      action: stop
    vulture_left_yellow:
      loops: -1

  vulture_show_left_red:
    vulture_left_yellow:
      action: stop
    vulture_left_red:
      loops: -1

  vulture_show_center_yellow:
    vulture_center_red:
      action: stop
    vulture_center_yellow:
      loops: -1

  vulture_show_center_red:
    vulture_center_yellow:
      action: stop
    vulture_center_red:
      loops: -1

  vulture_show_right_yellow:
    vulture_right_red:
      action: stop
    vulture_right_yellow:
      loops: -1

  vulture_show_right_red:
    vulture_right_yellow:
      action: stop
    vulture_right_red:
      loops: -1

  vulture_gi_lower:
    vulture_gi_upper_show:
      action: stop
    vulture_gi_lower_show:
      loops: -1
      priority: 320

  vulture_gi_upper:
    vulture_gi_lower_show:
      action: stop
    vulture_gi_upper_show:
      loops: -1
      priority: 320

  vulture_gi_stop:
    vulture_gi_lower_show:
      action: stop
    vulture_gi_upper_show:
      action: stop

  vulture_two_balls_upper:
    vulture_two_balls_upper_show:
      loops: 1

  vulture_add_a_ball:
    vulture_add_a_ball_show:
      loops: 1

  vulture_mode_complete:
    vulture_left_yellow:
      action: stop
    vulture_left_red:
      action: stop
    vulture_center_yellow:
      action: stop
    vulture_center_red:
      action: stop
    vulture_right_yellow:
      action: stop
    vulture_right_red:
      action: stop
    vulture_gi_lower_show:
      action: stop
    vulture_gi_upper_show:
      action: stop

shows:
  vulture_left_yellow:
    - duration: 250ms
      lights:
        l_upper_left: D0D020
    - duration: 250ms
      lights:
        l_upper_left: off

  vulture_left_red:
    - duration: 250ms
      lights:
        l_upper_left: red
    - duration: 250ms
      lights:
        l_upper_left: off

  vulture_center_yellow:
    - duration: 250ms
      lights:
        l_upper_middle: D0D020
    - duration: 250ms
      lights:
        l_upper_middle: off

  vulture_center_red:
    - duration: 250ms
      lights:
        l_upper_middle: red
    - duration: 250ms
      lights:
        l_upper_middle: off

  vulture_right_yellow:
    - duration: 250ms
      lights:
        l_upper_right: D0D020
    - duration: 250ms
      lights:
        l_upper_right: off

  vulture_right_red:
    - duration: 250ms
      lights:
        l_upper_right: red
    - duration: 250ms
      lights:
        l_upper_right: off

  vulture_gi_lower_show:
    - duration: 1s
      lights:
        gi: D0D020

  vulture_gi_upper_show:
    - duration: 1s
      lights:
        gi: 4080F0

  vulture_add_a_ball_show:
    - duration: 150ms
      lights:
        gi: white
    - duration: 150ms
      lights:
        gi: yellow

  vulture_two_balls_upper_show:
    - duration: 100ms
      lights:
        gi: red
    - duration: 100ms
      lights:
        gi: yellow

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
