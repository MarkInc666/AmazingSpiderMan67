#config_version=6

# The Plutonians coded rules:
# - All six areas begin frozen and can be thawed at any time by qualifying hits.
# - Active freeze ray fires every 12s and refreezes one thawed area.
# - Any upper target blocks/resets the ray for 20s / 25s with More Time.
# - Win by thawing all six areas simultaneously.

# THE PLUTONIANS — six-area freeze/thaw control mode.
# Areas reuse Super Swami's bottom/middle/upper x left/right switch map.
# Areas can be thawed at any time. The active ray randomly refreezes one thawed
# area every 12 seconds. Upper targets block it for 20 seconds (25 with More
# Time), and every target hit resets the full blocked period.

mode:
  start_events: start_mode_plutonians
  stop_events:
    - plutonians_mode_complete
    - plutonians_mode_failed
    - plutonians_mode_completed_summary
    - ball_ended
  code: plutonians.Plutonians
  priority: 300

widget_player:
  mode_plutonians_started:
    plutonians:
      action: play
  plutonians_mode_complete:
    plutonians:
      action: remove
  plutonians_mode_failed:
    plutonians:
      action: remove
  mode_plutonians_stopping:
    plutonians:
      action: remove

event_player:
  # Keep captive-ball devices and drop banks flowing normally.
  s_saucer_1_active: clear_saucers_delayed
  s_saucer_2_active: clear_saucers_delayed
  s_saucer_3_active: clear_saucers_delayed
  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_plutonians_started:
    - rooftop_diverter_open
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_plutonians_stopping:
    - plutonians_clear_lights
    - rooftop_diverter_close
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

show_player:
  plutonians_ray_active:
    plutonians_targets_red_pulse:
      loops: -1
    plutonians_targets_yellow_pulse:
      action: stop

  plutonians_ray_blocked:
    plutonians_targets_red_pulse:
      action: stop
    plutonians_targets_yellow_pulse:
      loops: -1

  plutonians_control_repaired:
    plutonians_targets_red_pulse:
      action: stop
    plutonians_targets_yellow_pulse:
      action: stop
    plutonians_control_repaired_flash:
      loops: 1

  plutonians_clear_lights:
    plutonians_targets_red_pulse:
      action: stop
    plutonians_targets_yellow_pulse:
      action: stop
    plutonians_control_repaired_flash:
      action: stop

