#config_version=6

mode:
  start_events: start_mode_crime_wave
  stop_events:
    - ball_will_end
    - bonus_start
    - stop_mode_crime_wave
    - ball_ended
  code: crime_wave.CrimeWave
  priority: 800

multiballs:
  crime_wave_multiball:
    ball_count: 3
    ball_count_type: total
    shoot_again: 20s
    start_events: crime_wave_start_multiball
    stop_events:
      - stop_mode_crime_wave

variable_player:
  multiball_crime_wave_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_crime_wave_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

event_player:
  s_pop_left_active: crime_wave_plotter_hit
  s_pop_right_active: crime_wave_plotter_hit

  s_upper_target_left_active: crime_wave_fly_hit
  s_upper_target_center_active: crime_wave_fly_hit
  s_upper_target_right_active: crime_wave_fly_hit

  s_right_drops_1_active: crime_wave_phantom_hit
  s_right_drops_2_active: crime_wave_phantom_hit
  s_right_drops_3_active: crime_wave_phantom_hit
  s_right_drops_4_active: crime_wave_phantom_hit
  s_right_drops_5_active: crime_wave_phantom_hit

  s_left_drops_1_active: crime_wave_enforcers_hit
  s_left_drops_2_active: crime_wave_enforcers_hit
  s_left_drops_3_active: crime_wave_enforcers_hit

  s_saucer_1_active:
    crime_wave_saucer_hit:
      saucer: 1
  s_saucer_2_active:
    crime_wave_saucer_hit:
      saucer: 2
  s_saucer_3_active:
    crime_wave_saucer_hit:
      saucer: 3

  # Crime Wave owns the VUK while Daily Bugle Mystery is disabled.
  s_vuk_switch_active: crime_wave_vuk_hit

  # Physical left/right roof exits.
  s_upper_exit_left_opto_active:
    crime_wave_upper_exit_hit:
      exit_name: left
  s_upper_exit_right_opto_active:
    crime_wave_upper_exit_hit:
      exit_name: right

  # There is no physical center-exit switch. These are the established
  # center-drain inference switches used by the other rooftop modes.
  s_right_drops_top_rubber_active: crime_wave_center_exit_hit
  s_inlane_m_r_active: crime_wave_center_exit_hit

  # Either web target collects an active Super Jackpot.
  s_web_target_left_active: crime_wave_web_hit
  s_web_target_mid_active: crime_wave_web_hit

  multiball_crime_wave_multiball_ended: crime_wave_complete_request

  mode_crime_wave_started:
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

widget_player:
  mode_crime_wave_started:
    crime_wave:
      action: play
  crime_wave_mode_complete:
    crime_wave:
      action: remove
  mode_crime_wave_stopping:
    crime_wave:
      action: remove

light_player:
  mode_crime_wave_started:
    gi: EFA0A0
  crime_wave_gi_restore:
    gi: EFA0A0
  crime_wave_super_gi_on:
    gi: FFFFFF
  crime_wave_super_gi_off:
    gi: off
  mode_crime_wave_stopping:
    gi: E0E0E0

show_player:
  # Plotter / pops: cyan. Pulse = available, solid = captured,
  # fast flash = under 5 seconds remaining.
  crime_wave_area_plotter_available:
    crime_wave_plotter_active: {action: stop}
    crime_wave_plotter_warning: {action: stop}
    crime_wave_plotter_available: {loops: -1}
  crime_wave_area_plotter_active:
    crime_wave_plotter_available: {action: stop}
    crime_wave_plotter_warning: {action: stop}
    crime_wave_plotter_active: {loops: -1}
  crime_wave_area_plotter_warning:
    crime_wave_plotter_available: {action: stop}
    crime_wave_plotter_active: {action: stop}
    crime_wave_plotter_warning: {loops: -1}

  # Fly Twins / upper targets: cyan.
  crime_wave_area_fly_twins_available:
    crime_wave_fly_twins_active: {action: stop}
    crime_wave_fly_twins_warning: {action: stop}
    crime_wave_fly_twins_available: {loops: -1}
  crime_wave_area_fly_twins_active:
    crime_wave_fly_twins_available: {action: stop}
    crime_wave_fly_twins_warning: {action: stop}
    crime_wave_fly_twins_active: {loops: -1}
  crime_wave_area_fly_twins_warning:
    crime_wave_fly_twins_available: {action: stop}
    crime_wave_fly_twins_active: {action: stop}
    crime_wave_fly_twins_warning: {loops: -1}

  # 5th Ave Phantom / right bank GI + inserts: cyan.
  crime_wave_area_phantom_available:
    crime_wave_phantom_active: {action: stop}
    crime_wave_phantom_warning: {action: stop}
    crime_wave_phantom_available: {loops: -1}
  crime_wave_area_phantom_active:
    crime_wave_phantom_available: {action: stop}
    crime_wave_phantom_warning: {action: stop}
    crime_wave_phantom_active: {loops: -1}
  crime_wave_area_phantom_warning:
    crime_wave_phantom_available: {action: stop}
    crime_wave_phantom_active: {action: stop}
    crime_wave_phantom_warning: {loops: -1}

  # Enforcers / left bank GI + inserts: cyan.
  crime_wave_area_enforcers_available:
    crime_wave_enforcers_active: {action: stop}
    crime_wave_enforcers_warning: {action: stop}
    crime_wave_enforcers_available: {loops: -1}
  crime_wave_area_enforcers_active:
    crime_wave_enforcers_available: {action: stop}
    crime_wave_enforcers_warning: {action: stop}
    crime_wave_enforcers_active: {loops: -1}
  crime_wave_area_enforcers_warning:
    crime_wave_enforcers_available: {action: stop}
    crime_wave_enforcers_active: {action: stop}
    crime_wave_enforcers_warning: {loops: -1}

  # Doctor Cool / saucer targets: white is deliberately brighter than red.
  crime_wave_area_doctor_cool_available:
    crime_wave_doctor_cool_active: {action: stop}
    crime_wave_doctor_cool_warning: {action: stop}
    crime_wave_doctor_cool_available: {loops: -1}
  crime_wave_area_doctor_cool_active:
    crime_wave_doctor_cool_available: {action: stop}
    crime_wave_doctor_cool_warning: {action: stop}
    crime_wave_doctor_cool_active: {loops: -1}
  crime_wave_area_doctor_cool_warning:
    crime_wave_doctor_cool_available: {action: stop}
    crime_wave_doctor_cool_active: {action: stop}
    crime_wave_doctor_cool_warning: {loops: -1}

  crime_wave_super_on:
    crime_wave_super_web_flash: {loops: -1}
  crime_wave_super_off:
    crime_wave_super_web_flash: {action: stop}

  crime_wave_area_shows_stop:
    crime_wave_plotter_available: {action: stop}
    crime_wave_plotter_active: {action: stop}
    crime_wave_plotter_warning: {action: stop}
    crime_wave_fly_twins_available: {action: stop}
    crime_wave_fly_twins_active: {action: stop}
    crime_wave_fly_twins_warning: {action: stop}
    crime_wave_phantom_available: {action: stop}
    crime_wave_phantom_active: {action: stop}
    crime_wave_phantom_warning: {action: stop}
    crime_wave_enforcers_available: {action: stop}
    crime_wave_enforcers_active: {action: stop}
    crime_wave_enforcers_warning: {action: stop}
    crime_wave_doctor_cool_available: {action: stop}
    crime_wave_doctor_cool_active: {action: stop}
    crime_wave_doctor_cool_warning: {action: stop}

  crime_wave_clear_lights:
    crime_wave_plotter_available: {action: stop}
    crime_wave_plotter_active: {action: stop}
    crime_wave_plotter_warning: {action: stop}
    crime_wave_fly_twins_available: {action: stop}
    crime_wave_fly_twins_active: {action: stop}
    crime_wave_fly_twins_warning: {action: stop}
    crime_wave_phantom_available: {action: stop}
    crime_wave_phantom_active: {action: stop}
    crime_wave_phantom_warning: {action: stop}
    crime_wave_enforcers_available: {action: stop}
    crime_wave_enforcers_active: {action: stop}
    crime_wave_enforcers_warning: {action: stop}
    crime_wave_doctor_cool_available: {action: stop}
    crime_wave_doctor_cool_active: {action: stop}
    crime_wave_doctor_cool_warning: {action: stop}
    crime_wave_super_web_flash: {action: stop}

