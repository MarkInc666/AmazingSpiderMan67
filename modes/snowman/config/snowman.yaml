#config_version=6

# The Snowman coded rules:
# - Web-to-opposite-web connection: 16s base / 20s More Time.
# - First spinner spin defeats Snowman and starts 10s bonus spins / 16s More Time.
# - Spins are unlimited until expiry; More Jackpots increases each following spin by 25K.
# - Repeating the starting web resets the wire timer; Shot Assist can complete it once.

mode:
  start_events: start_mode_snowman
  stop_events:
    - snowman_mode_complete
    - snowman_mode_completed_summary
    - ball_ended
  code: snowman.Snowman
  priority: 300

widget_player:
  mode_snowman_started:
    snowman: {action: play}
  snowman_mode_complete:
    snowman: {action: remove}
  mode_snowman_stopping:
    snowman: {action: remove}

event_player:
  s_web_target_left_active: snowman_left_web_hit
  s_web_target_mid_active: snowman_center_web_hit
  s_web_spinner_active: snowman_spinner_hit

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_snowman_started:
    - reset_drops
    - clear_saucers_delayed
  mode_snowman_stopping:
    - clear_saucers_delayed

ball_saves:
  snowman_safety_net:
    active_time: 10s
    hurry_up_time: 2s
    grace_period: 1s
    enable_events: snowman_enable_safety_net
    disable_events:
      - snowman_disable_safety_net
      - mode_snowman_stopping
    auto_launch: true
    balls_to_save: 1

show_player:
  snowman_idle_phase:
    snowman_deep_blue_gi: {action: stop}
    snowman_spinner_gi: {action: stop}
    snowman_bonus_gi: {action: stop}
    snowman_left_web_solid: {action: stop}
    snowman_center_web_solid: {action: stop}
    snowman_left_web_pulse: {loops: -1}
    snowman_center_web_pulse: {loops: -1}
    snowman_idle_gi: {loops: -1}

  snowman_wire_started:
    snowman_idle_gi: {action: stop}
    snowman_deep_blue_gi: {loops: -1}

  snowman_left_web_solid:
    snowman_left_web_pulse: {action: stop}
    snowman_left_web_solid: {loops: -1}
  snowman_center_web_solid:
    snowman_center_web_pulse: {action: stop}
    snowman_center_web_solid: {loops: -1}
  snowman_left_web_pulse:
    snowman_left_web_pulse: {loops: -1}
  snowman_center_web_pulse:
    snowman_center_web_pulse: {loops: -1}

  snowman_wire_complete:
    snowman_deep_blue_gi: {action: stop}
    snowman_left_web_pulse: {action: stop}
    snowman_center_web_pulse: {action: stop}
    snowman_left_web_solid: {loops: -1}
    snowman_center_web_solid: {loops: -1}
    snowman_white_flash: {loops: 1}
    snowman_spinner_gi: {loops: -1}
    snowman_spinner_flash: {loops: -1}

  snowman_defeated:
    snowman_spinner_gi: {action: stop}
    snowman_bonus_gi: {loops: -1}

  snowman_spin_flash:
    snowman_white_flash: {loops: 1}

  snowman_clear_all:
    snowman_idle_gi: {action: stop}
    snowman_deep_blue_gi: {action: stop}
    snowman_spinner_gi: {action: stop}
    snowman_bonus_gi: {action: stop}
    snowman_left_web_pulse: {action: stop}
    snowman_center_web_pulse: {action: stop}
    snowman_left_web_solid: {action: stop}
    snowman_center_web_solid: {action: stop}
    snowman_spinner_flash: {action: stop}

light_player:
  snowman_clear_all:
    gi: stop
    l_left_web_target: stop
    l_mid_web_target: stop
    l_gi_spinner: stop

shows:
  snowman_idle_gi:
    - duration: 1s
      lights: {gi: A0D8F0}
  snowman_deep_blue_gi:
    - duration: 1s
      lights: {gi: 305090}
  snowman_spinner_gi:
    - duration: 1s
      lights: {gi: 309090}
  snowman_bonus_gi:
    - duration: 500ms
      lights: {gi: 4080C0}
    - duration: 500ms
      lights: {gi: D8F8FF}
  snowman_white_flash:
    - duration: 250ms
      lights: {gi: FFFFFF}
    - duration: 250ms
      lights: {gi: 4080C0}
  snowman_left_web_pulse:
    - duration: 500ms
      lights: {l_left_web_target: FF2020}
    - duration: 500ms
      lights: {l_left_web_target: 401010}
  snowman_center_web_pulse:
    - duration: 500ms
      lights: {l_mid_web_target: FF2020}
    - duration: 500ms
      lights: {l_mid_web_target: 401010}
  snowman_left_web_solid:
    - duration: 1s
      lights: {l_left_web_target: FF2020}
  snowman_center_web_solid:
    - duration: 1s
      lights: {l_mid_web_target: FF2020}
  snowman_spinner_flash:
    - duration: 250ms
      lights: {l_gi_spinner: 40FF80}
    - duration: 250ms
      lights: {l_gi_spinner: 102010}
