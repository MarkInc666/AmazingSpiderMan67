#config_version=6
#base mode config file
mode:
  start_events: ball_started
  priority: 100
  code: base.Base

variable_player:
  secondary_switch_hit:
    score: 500

  pops_hit:
    score: 1100

  drop_hit_no_mode:
    score: 2000

  default_spinner_hit:
    score: 2000

  upper_target_hit:
    score: 5000

  upper_spinner_hit:
    score: 3000

  consume_outlane_add_a_ball:
    outlane_add_a_ball_available:
      action: add
      int: -1
      
  increase_outlane_add_a_ball:
    outlane_add_a_ball_available:
      action: add
      int: 1

  enable_outlane_autoplunge:
    multiball_autoplunge_active:
      action: set
      int: 1

  disable_outlane_autoplunge:
    multiball_autoplunge_active:
      action: set
      int: 0






random_event_player:
  play_random_main_song:
    - play_song_1
    - play_song_2
    - play_song_9
    - play_song_16

  play_random_player_added_callout:
    - player_added_callout_1
    - player_added_callout_2
    - player_added_callout_3
    - player_added_callout_4
    - player_added_callout_5


event_player:
  finish_skillshot:
    - play_random_main_song

  play_bonus_music:
    - play_song_6

  play_chapter_select_music:
    - play_song_20

  mode_base_started:
    - mode_base_started_delayed|1s

  mode_base_started_delayed{current_player.chapter_select_needed != 1}:
    - play_song_5

  # After a wizard summary, keep the display/audio in a Chapter Select
  # transition state while waiting for the player to press Start.
  chapter_select_summary_complete:
    - play_chapter_select_music

  chapter_select_selected:
    - chapter_select_confirmed|2s

  s_plunger_active{current_player.saved_ball_pending_plunger == 1}:
    - saved_ball_arrived_at_plunger

  s_plunger_active{current_player.outlane_add_a_ball_pending_plunger == 1}:
    - outlane_add_a_ball_arrived_at_plunger

  s_plunger_inactive{current_player.saved_ball_in_plunger != 1 and current_player.outlane_add_a_ball_in_plunger != 1 and current_player.outlane_add_a_ball_pending_plunger != 1}:
    - start_my_default_ball_save

  s_plunger_inactive{current_player.saved_ball_in_plunger == 1}:
    - clear_saved_ball_in_plunger

  s_plunger_inactive{current_player.outlane_add_a_ball_in_plunger == 1}:
    - clear_outlane_add_a_ball_in_plunger
    - disable_outlane_autoplunge

  s_outlane_r_active{current_player.outlane_add_a_ball_available == 1 and current_player.ball_save_count == 0}:
    - consume_outlane_add_a_ball
    - start_outlane_add_a_ball

  s_outlane_l_active{current_player.outlane_add_a_ball_available == 1 and current_player.ball_save_count == 0}:
    - consume_outlane_add_a_ball
    - start_outlane_add_a_ball

  s_leaf_next_to_1_active:
    - secondary_switch_hit
  s_right_drops_top_rubber_active:
    - secondary_switch_hit  
  s_above_star_active:
    - secondary_switch_hit
  s_above_spinner_active:
    - secondary_switch_hit
  s_left_drops_top_left_rubber_active:
    - secondary_switch_hit
  s_left_drops_top_right_rubber_active:
    - secondary_switch_hit
  s_mid_right_rubber_active:
    - secondary_switch_hit
  s_left_drops_rubber_active:
    - secondary_switch_hit
  s_right_drops_rubber_active:
    - secondary_switch_hit

  s_pop_right_active:
    - pops_hit
  s_pop_left_active:
    - pops_hit

  s_sling_l_active:
    - secondary_switch_hit
  s_sling_r_active:
    - secondary_switch_hit

  s_upper_target_left_active: upper_target_hit
  s_upper_target_center_active: upper_target_hit
  s_upper_target_right_active: upper_target_hit
  s_trispinner_opto_active: upper_spinner_hit


  s_web_spinner_active{mode.super_spinner.active == False}:
    - default_spinner_hit

  player_added{num == 2}:
    - show_player_2_added
    - play_random_player_added_callout
  player_added{num == 3}:
    - show_player_3_added
    - play_random_player_added_callout
  player_added{num == 4}:
    - show_player_4_added
    - play_random_player_added_callout

  s_left_drops_1_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode
  s_left_drops_2_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode
  s_left_drops_3_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode

  s_right_drops_1_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode
  s_right_drops_2_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode
  s_right_drops_3_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode
  s_right_drops_4_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode
  s_right_drops_5_active{current_player.villain_mode_running != 1}:
    - drop_hit_no_mode

  daily_bugle_left_exit_hold_cancelled:
    - drop_the_up_post




sound_player:
  player_added_callout_1:
    jj_its_about_time_you_showed_up:
      action: play
      bus: voice

  player_added_callout_2:
    mg_you_screamed_mr_jameson:
      action: play
      bus: voice

  player_added_callout_3:
    jj_what_kept_you_parker:
      action: play
      bus: voice

  player_added_callout_4:
    jj_oh_there_you_are_parker:
      action: play
      bus: voice

  player_added_callout_5:
    sm_welcome_to_my_parlor:
      action: play
      bus: voice

  default_spinner_hit:
    rope_1:
      action: play
      bus: effects

  s_outlane_r_active{current_player.ball_save_count == 0}:
    jj_end_of_the_line:
      action: play
      bus: voice

  s_outlane_l_active{current_player.ball_save_count == 0}:
    jj_spiderman_caught:
      action: play
      bus: voice

  secondary_switch_hit:
    hb_blip_1:
      action: play
      bus: effects

  pops_hit:
    hb_pot_1:
      action: play
      bus: effects

  drop_hit_no_mode:
    throwing_star:
      action: play
      bus: effects


widget_player:
  # When a ball begins in Chapter Select flow, cover the short delayed mode
  # start immediately so the normal main-game screen cannot flash first.
  mode_base_started{current_player.chapter_select_needed == 1}:
    chapter_select_transition:
      action: play
      key: chapter_select_transition
      priority: 2100

  chapter_select_summary_complete:
    chapter_select_transition:
      action: play
      key: chapter_select_transition
      priority: 2100

  mode_chapter_select_started:
    chapter_select_transition:
      action: remove
      key: chapter_select_transition

  chapter_select_selected:
    chapter_select_transition:
      action: remove
      key: chapter_select_transition
    chapter_selected_confirmation:
      action: play
      priority: 2200
      expire: 2s

  mode_base_started:
    villain_chapter_status:
      action: play

  mode_base_started{current_player.chapter_mini_wizard_ready != 1 and current_player.mini_wizard_daily_bugle_ready != 1 and current_player.mini_wizard_vuk_hold_active != 1 and current_player.final_wizard_ready != 1}:
    daily_bugle_ready:
      action: play
      key: daily_bugle_ready

  mode_base_started{current_player.chapter_mini_wizard_ready == 1 or current_player.mini_wizard_daily_bugle_ready == 1 or current_player.mini_wizard_vuk_hold_active == 1 or current_player.final_wizard_ready == 1}:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  chapter_mini_wizard_ready:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  chapter_mini_wizard_lit_at_daily_bugle:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  chapter_mini_wizard_starting:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  chapter_mini_wizard_started:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  final_wizard_ready:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  villain_progression_start_final_wizard:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  case_files_hidden_for_wizard:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  show_player_2_added:
    player_2_added_widget:
      action: play
      expire: 2s

  show_player_3_added:
    player_3_added_widget:
      action: play
      expire: 2s

  show_player_4_added:
    player_4_added_widget:
      action: play
      expire: 2s


  show_mode_message:
    mode_message:
      expire: 2s
      action: play

  show_mode_message_long:
    mode_message:
      expire: 4s
      action: play

  show_mode_jackpot:
    mode_message:
      expire: 2s
      action: play

  show_mode_countdown:
    mode_message:
      action: play
      expire: 2s
      priority: 2600

  hide_mode_message:
    mode_message:
      action: remove

  show_mode_status:
    mode_status:
      action: play
      priority: 2500

  update_mode_status:
    mode_status:
      action: play
      priority: 2500

  hide_mode_status:
    mode_status:
      action: remove

  mode_display_context_cleared:
    mode_message:
      action: remove
    mode_status:
      action: remove


slide_player:
  mode_base_started{current_player.chapter_select_needed != 1}:
    main_game:
      action: play
    attract:
      action: remove

  mode_base_started{current_player.chapter_select_needed == 1}:
    main_game:
      action: remove
    attract:
      action: remove

  # The initial main-game slide was intentionally suppressed while the comic
  # carousel owned the display. Restore it behind the two-second selection
  # confirmation once a chapter has been chosen.
  chapter_select_selected:
    main_game:
      action: play
    attract:
      action: remove

timers:
  timer_up_post_hold:
    start_value: 0
    end_value: 8
    tick_interval: 1s
    control_events:
      - event: enable_up_post_event
        action: restart        
      - event: drop_the_up_post
        action: stop        


        
light_player:
  mode_base_started:
    gi:
      color: E0E0E0        
  ramp_raise:
    gi:
      color: F0F000        
  ramp_lower:
    gi:
      color: F00000        
  s_upper_exit_left_opto_active:
    gi:
      color: E0E0E0        
  s_upper_exit_right_opto_active:
    gi:
      color: E0E0E0        
      
