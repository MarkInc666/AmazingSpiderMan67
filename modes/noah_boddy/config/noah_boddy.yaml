#config_version=6

# Find the Noah Boddy
# Upper targets reveal the secret lower drop target by knocking down non-secret drops.
# Spinner builds the jackpot. Once only the secret target remains, hurry back lower
# and hit it before the timer expires.

mode:
  start_events: start_mode_noah_boddy
  stop_events:
  - stop_mode_noah_boddy
  - ball_will_end
  - bonus_start
  - noah_boddy_mode_completed_summary
  - ball_ended
  code: noah_boddy.NoahBoddy
  priority: 300


widget_player:
  mode_noah_boddy_started:
    noah_boddy:
      action: play

  noah_boddy_mode_complete:
    noah_boddy:
      action: remove

  mode_noah_boddy_stopping:
    noah_boddy:
      action: remove


event_player:
  mode_noah_boddy_started:
  - clear_saucers

  s_saucer_1_active:
  - clear_saucers

  s_saucer_2_active:
  - clear_saucers

  s_saucer_3_active:
  - clear_saucers

  mode_noah_boddy_stopping:
  - clear_saucers
  - rooftop_diverter_close

show_player:
  noah_boddy_get_to_upper:
    noah_boddy_roof_search_show:
      action: play
      loops: -1
      speed: 2

  noah_boddy_search_started:
    noah_boddy_roof_search_show:
      action: play
      loops: -1
      speed: 2
    noah_boddy_lower_targets_search_show:
      action: play
      loops: -1
      speed: 2

  noah_boddy_return_to_upper:
    noah_boddy_lower_targets_search_show:
      action: stop
    noah_boddy_roof_search_show:
      action: play
      loops: -1
      speed: 2

  noah_boddy_secret_hurryup_started:
    noah_boddy_roof_search_show:
      action: stop
    noah_boddy_lower_targets_search_show:
      action: stop

  noah_boddy_secret_left_1_lit:
    noah_boddy_secret_left_show:
      action: play
      loops: -1
      speed: 3
  noah_boddy_secret_left_2_lit:
    noah_boddy_secret_left_show:
      action: play
      loops: -1
      speed: 3
  noah_boddy_secret_left_3_lit:
    noah_boddy_secret_left_show:
      action: play
      loops: -1
      speed: 3

  noah_boddy_secret_right_1_lit:
    noah_boddy_secret_right_1_show:
      action: play
      loops: -1
      speed: 3
  noah_boddy_secret_right_2_lit:
    noah_boddy_secret_right_2_show:
      action: play
      loops: -1
      speed: 3
  noah_boddy_secret_right_3_lit:
    noah_boddy_secret_right_3_show:
      action: play
      loops: -1
      speed: 3
  noah_boddy_secret_right_4_lit:
    noah_boddy_secret_right_4_show:
      action: play
      loops: -1
      speed: 3
  noah_boddy_secret_right_5_lit:
    noah_boddy_secret_right_5_show:
      action: play
      loops: -1
      speed: 3

  noah_boddy_secret_lights_off:
    noah_boddy_secret_left_show:
      action: stop
    noah_boddy_secret_right_1_show:
      action: stop
    noah_boddy_secret_right_2_show:
      action: stop
    noah_boddy_secret_right_3_show:
      action: stop
    noah_boddy_secret_right_4_show:
      action: stop
    noah_boddy_secret_right_5_show:
      action: stop

  noah_boddy_mode_complete:
    noah_boddy_roof_search_show:
      action: stop
    noah_boddy_lower_targets_search_show:
      action: stop
    noah_boddy_secret_left_show:
      action: stop
    noah_boddy_secret_right_1_show:
      action: stop
    noah_boddy_secret_right_2_show:
      action: stop
    noah_boddy_secret_right_3_show:
      action: stop
    noah_boddy_secret_right_4_show:
      action: stop
    noah_boddy_secret_right_5_show:
      action: stop

  mode_noah_boddy_stopping:
    noah_boddy_roof_search_show:
      action: stop
    noah_boddy_lower_targets_search_show:
      action: stop
    noah_boddy_secret_left_show:
      action: stop
    noah_boddy_secret_right_1_show:
      action: stop
    noah_boddy_secret_right_2_show:
      action: stop
    noah_boddy_secret_right_3_show:
      action: stop
    noah_boddy_secret_right_4_show:
      action: stop
    noah_boddy_secret_right_5_show:
      action: stop

  noah_boddy_vuk_chase_start:
    shared_final_vuk_chase:
      loops: -1
      priority: 340
      show_tokens:
        color: FFD040
  noah_boddy_vuk_chase_stop:
    shared_final_vuk_chase:
      action: stop
shows:
  noah_boddy_roof_search_show:
  - duration: 250ms
    lights:
      l_upper_left: F0F040
      l_upper_middle: F0F040
      l_upper_right: F0F040
      l_gi_a: F0F040
  - duration: 250ms
    lights:
      l_upper_left: 40FF80
      l_upper_middle: 40FF80
      l_upper_right: 40FF80
      l_gi_a: 40FF80

  noah_boddy_lower_targets_search_show:
  - duration: 300ms
    lights:
      l_3bankbonus: F0F040
      l_5bank_1: F0F040
      l_5bank_2: F0F040
      l_5bank_3: F0F040
      l_5bank_4: F0F040
      l_5bank_5: F0F040
  - duration: 300ms
    lights:
      l_3bankbonus: 8090A0
      l_5bank_1: 8090A0
      l_5bank_2: 8090A0
      l_5bank_3: 8090A0
      l_5bank_4: 8090A0
      l_5bank_5: 8090A0

  noah_boddy_secret_left_show:
  - duration: 120ms
    lights:
      l_3bankbonus: 40FF80
  - duration: 120ms
    lights:
      l_3bankbonus: F0F040

  noah_boddy_secret_right_1_show:
  - duration: 120ms
    lights:
      l_5bank_1: 40FF80
  - duration: 120ms
    lights:
      l_5bank_1: F0F040
  noah_boddy_secret_right_2_show:
  - duration: 120ms
    lights:
      l_5bank_2: 40FF80
  - duration: 120ms
    lights:
      l_5bank_2: F0F040
  noah_boddy_secret_right_3_show:
  - duration: 120ms
    lights:
      l_5bank_3: 40FF80
  - duration: 120ms
    lights:
      l_5bank_3: F0F040
  noah_boddy_secret_right_4_show:
  - duration: 120ms
    lights:
      l_5bank_4: 40FF80
  - duration: 120ms
    lights:
      l_5bank_4: F0F040
  noah_boddy_secret_right_5_show:
  - duration: 120ms
    lights:
      l_5bank_5: 40FF80
  - duration: 120ms
    lights:
      l_5bank_5: F0F040

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_noah_boddy_started:
    gi: 8090A0

  mode_noah_boddy_stopping:
    gi: E0E0E0

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
