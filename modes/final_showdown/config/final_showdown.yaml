#config_version=6

mode:
  start_events: start_mode_final_showdown
  stop_events:
    - bonus_start
    - final_showdown_mode_completed_summary
    - ball_ended
  priority: 1000
  code: final_showdown.FinalShowdown

variable_player:
  multiball_final_showdown_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1

  multiball_final_showdown_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0


ball_saves:
  # Once Kingpin is exposed, unused future game balls become retries for the
  # final Daily Bugle VUK shot. This save protects only the last live ball and
  # returns the replacement to the shooter lane. Code consumes one future game
  # ball on every save and disables this device when none remain.
  final_showdown_final_shot_save:
    active_time: 0s
    hurry_up_time: 0s
    grace_period: 0s
    balls_to_save: -1
    only_last_ball: true
    auto_launch: false
    enable_events: final_showdown_enable_final_shot_save
    disable_events:
      - final_showdown_disable_final_shot_save
      - final_showdown_mode_complete
      - final_showdown_mode_failed
      - mode_final_showdown_stopping

multiballs:
  final_showdown_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 20s
    start_events: final_showdown_start_multiball
    add_a_ball_events:
      - final_showdown_add_a_ball
    add_a_ball_shoot_again: 10s
    add_a_ball_hurry_up_time: 3s
    stop_events:
      - final_showdown_stop_multiball
      - final_showdown_stop_all_multiballs

event_player:
  final_showdown_mode_complete:
    villain_bookend_summary_request:
      villain: final_showdown
      done_event: final_showdown_mode_completed_summary

  final_showdown_mode_failed:
    villain_bookend_summary_request:
      villain: final_showdown
      done_event: final_showdown_mode_completed_summary

  mode_final_showdown_started:
    - cmd_flippers_enable
    - cmd_autofire_coils_enable
    - final_showdown_setup
    - final_showdown_start_multiball|1s

  final_showdown_setup:
    - drop_target_bank_dt_bank_left_reset|100ms
    - drop_target_bank_dt_bank_right_reset|200ms
    - disable_daily_bugle_mystery
    - final_showdown_ab_available_show

  mode_final_showdown_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - rooftop_diverter_close
    - final_showdown_release_all_saucers
    - final_showdown_clear_all_final_showdown_lights

  final_showdown_open_upper_gate: rooftop_diverter_open
  final_showdown_close_upper_gate: rooftop_diverter_close

widget_player:
  mode_final_showdown_started:
    final_showdown:
      action: play

  mode_final_showdown_stopping:
    final_showdown:
      action: remove

light_player:
  # A/B add-a-ball qualification. Available letters flash independently; a
  # collected letter stays solid. Completing A+B clears the solid states while
  # the three-flash completion show runs, then both remain dark until collected.
  final_showdown_a_hit:
    l_a_rollover: yellow
    l_right_a: yellow
  final_showdown_b_hit:
    l_b_rollover: yellow
    l_left_b: yellow
  final_showdown_ab_complete:
    l_a_rollover: off
    l_b_rollover: off
    l_right_a: off
    l_left_b: off
  final_showdown_ab_reset:
    l_a_rollover: off
    l_b_rollover: off
    l_right_a: off
    l_left_b: off

  # Reveal/collect saucer positions.
  final_showdown_reveal_saucer_1_on:
    l_1_hole_l: FFFFFF
    l_1_hole_r: FFFFFF
  final_showdown_reveal_saucer_1_off:
    l_1_hole_l: off
    l_1_hole_r: off
  final_showdown_reveal_saucer_2_on:
    l_2_hole_l: FFFFFF
    l_2_hole_r: FFFFFF
  final_showdown_reveal_saucer_2_off:
    l_2_hole_l: off
    l_2_hole_r: off
  final_showdown_reveal_saucer_3_on:
    l_3_hole_l: FFFFFF
    l_3_hole_r: FFFFFF
  final_showdown_reveal_saucer_3_off:
    l_3_hole_l: off
    l_3_hole_r: off
  final_showdown_reveal_star_on:
    l_star: FFFFFF
    l_star2: FFFFFF
  final_showdown_reveal_star_off:
    l_star: off
    l_star2: off

  final_showdown_reveal_clear:
    l_1_hole_l: off
    l_1_hole_r: off
    l_2_hole_l: off
    l_2_hole_r: off
    l_3_hole_l: off
    l_3_hole_r: off
    l_star: off
    l_star2: off

  # Temporary 20-second parking during recap phases.
  final_showdown_saucer_hold_started{saucer=="saucer_1"}:
    l_1_hole_l: 804040
    l_1_hole_r: 804040
  final_showdown_saucer_released{saucer=="saucer_1"}:
    l_1_hole_l: off
    l_1_hole_r: off
  final_showdown_saucer_hold_started{saucer=="saucer_2"}:
    l_2_hole_l: 804040
    l_2_hole_r: 804040
  final_showdown_saucer_released{saucer=="saucer_2"}:
    l_2_hole_l: off
    l_2_hole_r: off
  final_showdown_saucer_hold_started{saucer=="saucer_3"}:
    l_3_hole_l: 804040
    l_3_hole_r: 804040
  final_showdown_saucer_released{saucer=="saucer_3"}:
    l_3_hole_l: off
    l_3_hole_r: off


  # Rooftop build phase.
  final_showdown_rooftop_on:
    l_upper_left: FFFFFF
    l_upper_middle: FFFFFF
    l_upper_right: FFFFFF
    l_gi_a: FFFFFF
  final_showdown_rooftop_off:
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off
    l_gi_a: off

  # Area-control lower zones: cyan while needed, brighter when complete.
  final_showdown_area_left_needed:
    l_gi_3bank: 208080
    l_left_web_target: 208080
  final_showdown_area_left_complete:
    l_gi_3bank: 80FFFF
    l_left_web_target: 80FFFF
  final_showdown_area_right_needed:
    l_gi_5bank_lower: 208080
    l_gi_5bank_upper: 208080
    l_5bank_1: 208080
    l_5bank_2: 208080
    l_5bank_3: 208080
    l_5bank_4: 208080
    l_5bank_5: 208080
  final_showdown_area_right_complete:
    l_gi_5bank_lower: 80FFFF
    l_gi_5bank_upper: 80FFFF
    l_5bank_1: 80FFFF
    l_5bank_2: 80FFFF
    l_5bank_3: 80FFFF
    l_5bank_4: 80FFFF
    l_5bank_5: 80FFFF
  final_showdown_area_center_needed:
    l_pop_1_1: 208080
    l_pop_1_4: 208080
    l_pop_1_7: 208080
    l_pop_1_10: 208080
    l_pop_2_1: 208080
    l_pop_2_4: 208080
    l_pop_2_7: 208080
    l_pop_2_10: 208080
    l_mid_web_target: 208080
  final_showdown_area_center_complete:
    l_pop_1_1: 80FFFF
    l_pop_1_4: 80FFFF
    l_pop_1_7: 80FFFF
    l_pop_1_10: 80FFFF
    l_pop_2_1: 80FFFF
    l_pop_2_4: 80FFFF
    l_pop_2_7: 80FFFF
    l_pop_2_10: 80FFFF
    l_mid_web_target: 80FFFF
  final_showdown_area_slings_needed:
    l_gi_left_sling_upper: 208080
    l_gi_left_sling_lower: 208080
    l_gi_right_sling: 208080
  final_showdown_area_slings_complete:
    l_gi_left_sling_upper: 80FFFF
    l_gi_left_sling_lower: 80FFFF
    l_gi_right_sling: 80FFFF
  final_showdown_area_roof_target_complete:
    l_gi_a: 80FFFF

  final_showdown_area_control_off:
    l_pop_1_1: off
    l_pop_1_4: off
    l_pop_1_7: off
    l_pop_1_10: off
    l_pop_2_1: off
    l_pop_2_4: off
    l_pop_2_7: off
    l_pop_2_10: off
    l_gi_3bank: off
    l_left_web_target: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: off
    l_5bank_4: off
    l_5bank_5: off
    l_mid_web_target: off
    l_gi_left_sling_upper: off
    l_gi_left_sling_lower: off
    l_gi_right_sling: off
    l_gi_a: off

