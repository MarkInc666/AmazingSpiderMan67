#    mysterio_hint_upper_show:
#      loops: 0
#
#  mysterio_super_collected:
#    mysterio_super_show:
#      loops: 0
      
  mysterio_lite_left_web:
    mysterio_lite_left_web_show:
      loops: -1

  mysterio_lite_left_pop:
    mysterio_lite_left_pop_show:
      loops: -1

  mysterio_lite_right_pop:
    mysterio_lite_right_pop_show:
      loops: -1

  mysterio_lite_left_drops:
    mysterio_lite_left_drops_show:
      loops: -1

  mysterio_lite_right_drops:
    mysterio_lite_right_drops_show:
      loops: -1

  mysterio_lite_saucers:
    mysterio_lite_saucers_show:
      loops: -1

  mysterio_lite_upper_targets:
    mysterio_lite_upper_targets_show:
      loops: -1

  mysterio_stop_left_web:
    mysterio_lite_left_web_show:
      action: stop

  mysterio_stop_left_pop:
    mysterio_lite_left_pop_show:
      action: stop

  mysterio_stop_right_pop:
    mysterio_lite_right_pop_show:
      action: stop

  mysterio_stop_left_drops:
    mysterio_lite_left_drops_show:
      action: stop

  mysterio_stop_right_drops:
    mysterio_lite_right_drops_show:
      action: stop

  mysterio_stop_saucers:
    mysterio_lite_saucers_show:
      action: stop

  mysterio_stop_upper_targets:
    mysterio_lite_upper_targets_show:
      action: stop


shows:

  mysterio_lite_left_web_show:
    - duration: 120ms
      lights:
        l_left_web_target: yellow
    - duration: 120ms
      lights:
        l_left_web_target: blue


  mysterio_lite_left_pop_show:
    - duration: 120ms
      lights:
        l_pop_1_1: yellow
        l_pop_1_2: yellow
        l_pop_1_3: yellow
        l_pop_1_4: yellow
        l_pop_1_5: yellow
        l_pop_1_6: yellow
        l_pop_1_7: yellow
        l_pop_1_8: yellow
        l_pop_1_9: yellow
        l_pop_1_10: yellow
        l_pop_1_11: yellow
        l_pop_1_12: yellow
    - duration: 120ms
      lights:
        l_pop_1_1: blue
        l_pop_1_2: blue
        l_pop_1_3: blue
        l_pop_1_4: blue
        l_pop_1_5: blue
        l_pop_1_6: blue
        l_pop_1_7: blue
        l_pop_1_8: blue
        l_pop_1_9: blue
        l_pop_1_10: blue
        l_pop_1_11: blue
        l_pop_1_12: blue

  mysterio_lite_right_pop_show:
    - duration: 120ms
      lights:
        l_pop_2_1: yellow
        l_pop_2_2: yellow
        l_pop_2_3: yellow
        l_pop_2_4: yellow
        l_pop_2_5: yellow
        l_pop_2_6: yellow
        l_pop_2_7: yellow
        l_pop_2_8: yellow
        l_pop_2_9: yellow
        l_pop_2_10: yellow
        l_pop_2_11: yellow
        l_pop_2_12: yellow
    - duration: 120ms
      lights:
        l_pop_2_1: blue
        l_pop_2_2: blue
        l_pop_2_3: blue
        l_pop_2_4: blue
        l_pop_2_5: blue
        l_pop_2_6: blue
        l_pop_2_7: blue
        l_pop_2_8: blue
        l_pop_2_9: blue
        l_pop_2_10: blue
        l_pop_2_11: blue
        l_pop_2_12: blue

  mysterio_lite_left_drops_show:
    - duration: 120ms
      lights:
        l_3bankbonus: yellow
    - duration: 120ms
      lights:
        l_3bankbonus: blue

  mysterio_lite_right_drops_show:
    - duration: 120ms
      lights:
        l_5bank_1: yellow
        l_5bank_2: yellow
        l_5bank_3: yellow
        l_5bank_4: yellow
        l_5bank_5: yellow
    - duration: 120ms
      lights:
        l_5bank_1: blue
        l_5bank_2: blue
        l_5bank_3: blue
        l_5bank_4: blue
        l_5bank_5: blue

  mysterio_lite_saucers_show:
    - duration: 180ms
      lights:
        l_1_hole_l: white
        l_1_hole_r: white
        l_2_hole_l: white
        l_2_hole_r: white
        l_3_hole_l: white
        l_3_hole_r: white
    - duration: 180ms
      lights:
        l_1_hole_l: off
        l_1_hole_r: off
        l_2_hole_l: off
        l_2_hole_r: off
        l_3_hole_l: off
        l_3_hole_r: off

  mysterio_lite_upper_targets_show:
    - duration: 120ms
      lights:
        l_upper_left: yellow
        l_upper_middle: yellow
        l_upper_right: yellow
    - duration: 120ms
      lights:
        l_upper_left: blue
        l_upper_middle: blue
        l_upper_right: blue

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_mysterio_started:
    gi: 7A3DB8

  mode_mysterio_stopping:
    gi: E0E0E0
