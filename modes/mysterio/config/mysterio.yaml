#config_version=6

mode:
  start_events: start_mode_mysterio
  stop_events: 
    - ball_will_end
    - bonus_start
    - mysterio_mode_complete
    - mysterio_mode_completed_summary
    - ball_ended
  code: mysterio.Mysterio
  priority: 500


widget_player:
  mode_mysterio_started:
    mysterio:
      action: play

  mysterio_mode_complete:
    mysterio:
      action: remove

  mode_mysterio_stopping:
    mysterio:
      action: remove

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
  mysterio_spidey_sense_left:
    sm_my_spidey_sense_left:
      action: play
      bus: voice

  mysterio_spidey_sense_right:
    sm_my_spidey_sense_right:
      action: play
      bus: voice

  mysterio_spidey_sense_upper:
    sm_my_spidey_sense_rooftop:
      action: play
      bus: voice

  mysterio_non_clue_shot:
    sm_he_must_be_around_here_somewhere:
      action: play
      bus: voice


event_player:
  mode_mysterio_started:
    - reset_drops
    - clear_saucers_delayed
    
  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  s_web_target_left_active: mysterio_left_web_hit
  s_pop_left_active: mysterio_left_pop_hit
  s_pop_right_active: mysterio_right_pop_hit
  left_drops_hit: mysterio_left_drops_hit
  right_drops_hit: mysterio_right_drops_hit
  saucers_hit: mysterio_saucers_hit
  upper_targets_hit: mysterio_upper_targets_hit

  mysterio_all_shots_lit:
    - mysterio_lite_left_web
    - mysterio_lite_left_pop
    - mysterio_lite_right_pop
    - mysterio_lite_left_drops
    - mysterio_lite_right_drops
    - mysterio_lite_saucers
    - mysterio_lite_upper_targets


shot_groups:
  right_drops:
    shots: right_drop_1, right_drop_2, right_drop_3, right_drop_4, right_drop_5

  left_drops:
    shots: left_drop_1, left_drop_2, left_drop_3

  upper_targets:
    shots: upper_target_left, upper_target_center, upper_target_right

  saucers:
    shots: saucer_1, saucer_2, saucer_3

shots:

  saucer_1:
    switch: s_saucer_1

  saucer_2:
    switch: s_saucer_2

  saucer_3:
    switch: s_saucer_3

  upper_target_left:
    switch: s_upper_target_left

  upper_target_center:
    switch: s_upper_target_center

  upper_target_right:
    switch: s_upper_target_right

  right_drop_1:
    switch: s_right_drops_1

  right_drop_2:
    switch: s_right_drops_2

  right_drop_3:
    switch: s_right_drops_3

  right_drop_4:
    switch: s_right_drops_4

  right_drop_5:
    switch: s_right_drops_5

  left_drop_1:
    switch: s_left_drops_1

  left_drop_2:
    switch: s_left_drops_2

  left_drop_3:
    switch: s_left_drops_3


show_player:
  mysterio_vuk_chase_pulse:
    shared_final_vuk_chase:
      loops: 1
      priority: 340
      show_tokens:
        color: "F030F0"
  mysterio_vuk_chase_stop:
    shared_final_vuk_chase:
      action: stop

#  mysterio_startup_complete:
#    mysterio_start_show:
#      loops: 0
#
#  mysterio_spidey_sense_left:
#    mysterio_hint_left_show:
#      loops: 0
#
#  mysterio_spidey_sense_right:
#    mysterio_hint_right_show:
#      loops: 0
#
