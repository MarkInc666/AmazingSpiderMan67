#config_version=6

# The Spider-Men - Align the Homeworld Ray.
# The six skill-shot positions begin pulsing red. Flipper presses rotate the
# entire completed/incomplete pattern. A pulsing shot becomes solid and starts
# the proton timer on the first collect. Complete all six before time expires.

mode:
  start_events: start_mode_spider_men
  stop_events:
    - spider_men_mode_complete
    - spider_men_mode_failed
    - spider_men_mode_completed_summary
    - ball_ended
  code: spider_men.SpiderMen
  priority: 300


widget_player:
  mode_spider_men_started:
    spider_men:
      action: play

  spider_men_mode_complete:
    spider_men:
      action: remove

  spider_men_mode_failed:
    spider_men:
      action: remove

  mode_spider_men_stopping:
    spider_men:
      action: remove


event_player:
  # Python scores the six switches. Each saucer is then released individually
  # after the shared 750ms award delay.
  s_saucer_1_active: delayed_kickout_saucer_1
  s_saucer_2_active: delayed_kickout_saucer_2
  s_saucer_3_active: delayed_kickout_saucer_3

  # Daily Bugle Mystery is disabled while the mode owns the saucers. The VUK
  # remains a normal eject, but the rooftop gate stays closed throughout.
  s_vuk_switch_active:
    - request_vuk_eject

  spider_men_startup_complete:
    - disable_daily_bugle_mystery
    - rooftop_diverter_close
    - clear_saucers_delayed

  mode_spider_men_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - spider_men_clear_lights
    - spider_men_gi_restore
    - clear_saucers_delayed


show_player:
  spider_men_saucer_1_pulse:
    spider_men_saucer_1_pulse_show: {loops: -1}
  spider_men_saucer_2_pulse:
    spider_men_saucer_2_pulse_show: {loops: -1}
  spider_men_saucer_3_pulse:
    spider_men_saucer_3_pulse_show: {loops: -1}
  spider_men_star_pulse:
    spider_men_star_pulse_show: {loops: -1}
  spider_men_upper_a_pulse:
    spider_men_upper_a_pulse_show: {loops: -1}
  spider_men_upper_b_pulse:
    spider_men_upper_b_pulse_show: {loops: -1}

  spider_men_super_ready:
    spider_men_center_web_super_show: {loops: -1}
  spider_men_super_collected:
    spider_men_center_web_super_show: {action: stop}

  spider_men_alignment_lights_off:
    spider_men_saucer_1_pulse_show: {action: stop}
    spider_men_saucer_2_pulse_show: {action: stop}
    spider_men_saucer_3_pulse_show: {action: stop}
    spider_men_star_pulse_show: {action: stop}
    spider_men_upper_a_pulse_show: {action: stop}
    spider_men_upper_b_pulse_show: {action: stop}

  spider_men_clear_lights:
    spider_men_saucer_1_pulse_show: {action: stop}
    spider_men_saucer_2_pulse_show: {action: stop}
    spider_men_saucer_3_pulse_show: {action: stop}
    spider_men_star_pulse_show: {action: stop}
    spider_men_upper_a_pulse_show: {action: stop}
    spider_men_upper_b_pulse_show: {action: stop}
    spider_men_center_web_super_show: {action: stop}

  mode_spider_men_stopping:
    spider_men_saucer_1_pulse_show: {action: stop}
    spider_men_saucer_2_pulse_show: {action: stop}
    spider_men_saucer_3_pulse_show: {action: stop}
    spider_men_star_pulse_show: {action: stop}
    spider_men_upper_a_pulse_show: {action: stop}
    spider_men_upper_b_pulse_show: {action: stop}
    spider_men_center_web_super_show: {action: stop}


light_player:
  # Clear only lamps owned by the alignment. The green 1/2/3 saucer inserts
  # are intentionally held off; the six red saucer lamps show those positions.
  spider_men_alignment_lights_off:
    l_1: off
    l_2: off
    l_3: off
    l_1_hole_l: off
    l_1_hole_r: off
    l_2_hole_l: off
    l_2_hole_r: off
    l_3_hole_l: off
    l_3_hole_r: off
    l_star: off
    l_a_rollover: off
    l_b_rollover: off

  spider_men_clear_lights:
    l_1_hole_l: off
    l_1_hole_r: off
    l_2_hole_l: off
    l_2_hole_r: off
    l_3_hole_l: off
    l_3_hole_r: off
    l_star: off
    l_a_rollover: off
    l_b_rollover: off
    l_mid_web_target: off

  spider_men_saucer_1_solid:
    l_1_hole_l: red
    l_1_hole_r: red
  spider_men_saucer_2_solid:
    l_2_hole_l: red
    l_2_hole_r: red
  spider_men_saucer_3_solid:
    l_3_hole_l: red
    l_3_hole_r: red
  spider_men_star_solid:
    l_star: red
  spider_men_upper_a_solid:
    l_a_rollover: red
  spider_men_upper_b_solid:
    l_b_rollover: red

  # Yellow GI grows brighter after every aligned position.
  spider_men_gi_0:
    gi: "303000"
  spider_men_gi_1:
    gi: "505000"
  spider_men_gi_2:
    gi: "707000"
  spider_men_gi_3:
    gi: "909000"
  spider_men_gi_4:
    gi: "B0B000"
  spider_men_gi_5:
    gi: "D0D000"
  spider_men_gi_6:
    gi: "FFFF00"
  spider_men_gi_restore:
    gi: "E0E0E0"


shows:
  # Unaligned positions pulse between full and low red. Completed positions
  # are set solid red by light_player and rotate with the same state array.
  spider_men_saucer_1_pulse_show:
    - duration: 500ms
      lights:
        l_1_hole_l: red
        l_1_hole_r: red
    - duration: 500ms
      lights:
        l_1_hole_l: "400000"
        l_1_hole_r: "400000"

  spider_men_saucer_2_pulse_show:
    - duration: 500ms
      lights:
        l_2_hole_l: red
        l_2_hole_r: red
    - duration: 500ms
      lights:
        l_2_hole_l: "400000"
        l_2_hole_r: "400000"

  spider_men_saucer_3_pulse_show:
    - duration: 500ms
      lights:
        l_3_hole_l: red
        l_3_hole_r: red
    - duration: 500ms
      lights:
        l_3_hole_l: "400000"
        l_3_hole_r: "400000"

  spider_men_star_pulse_show:
    - duration: 500ms
      lights: {l_star: red}
    - duration: 500ms
      lights: {l_star: "400000"}

  spider_men_upper_a_pulse_show:
    - duration: 500ms
      lights: {l_a_rollover: red}
    - duration: 500ms
      lights: {l_a_rollover: "400000"}

  spider_men_upper_b_pulse_show:
    - duration: 500ms
      lights: {l_b_rollover: red}
    - duration: 500ms
      lights: {l_b_rollover: "400000"}

  spider_men_center_web_super_show:
    - duration: 250ms
      lights: {l_mid_web_target: red}
    - duration: 250ms
      lights: {l_mid_web_target: off}
