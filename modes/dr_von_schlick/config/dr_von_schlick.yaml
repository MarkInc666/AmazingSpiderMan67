#config_version=6

mode:
  start_events: start_mode_dr_von_schlick
  stop_events:
    - ball_will_end
    - bonus_start
    - dr_von_schlick_mode_complete
    - ball_ended
  code: dr_von_schlick.DrVonSchlick
  priority: 300

widget_player:
  mode_dr_von_schlick_started:
    dr_von_schlick:
      action: play
  dr_von_schlick_mode_complete:
    dr_von_schlick:
      action: remove
  mode_dr_von_schlick_stopping:
    dr_von_schlick:
      action: remove

