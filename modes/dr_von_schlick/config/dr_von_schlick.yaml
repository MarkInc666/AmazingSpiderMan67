  s_web_target_left_active: dr_von_schlick_left_web_hit
  s_left_drops_1_active: dr_von_schlick_left_drops_hit
  s_left_drops_2_active: dr_von_schlick_left_drops_hit
  s_left_drops_3_active: dr_von_schlick_left_drops_hit
  s_pop_left_active: dr_von_schlick_left_pop_hit
  s_web_target_mid_active: dr_von_schlick_center_web_hit
  s_pop_right_active: dr_von_schlick_right_pop_hit
  s_right_drops_1_active: dr_von_schlick_right_drops_hit
  s_right_drops_2_active: dr_von_schlick_right_drops_hit
  s_right_drops_3_active: dr_von_schlick_right_drops_hit
  s_right_drops_4_active: dr_von_schlick_right_drops_hit
  s_right_drops_5_active: dr_von_schlick_right_drops_hit

  s_vuk_switch_active: dr_von_schlick_vuk_hit
  s_saucer_1_active: delayed_kickout_saucer_1
  s_saucer_2_active: delayed_kickout_saucer_2
  s_saucer_3_active: delayed_kickout_saucer_3

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_dr_von_schlick_started:
    - disable_daily_bugle_mystery
    - cancel_vuk_eject_request
    - rooftop_diverter_close
    - clear_saucers_delayed
    - reset_drops
  mode_dr_von_schlick_stopping:
