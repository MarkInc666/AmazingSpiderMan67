#config_version=6

# DeVargas — City of Gold pure score attack.
# Twenty timed opportunities are selected from thirteen repeatable shot groups.

mode:
  start_events: start_mode_devargas
  stop_events:
    - devargas_mode_complete
    - devargas_mode_completed_summary
    - ball_ended
  code: devargas.DeVargas
  priority: 300


ball_saves:
  devargas_safety_net:
    active_time: 10s
    hurry_up_time: 2s
    grace_period: 1s
    enable_events: devargas_enable_safety_net
    disable_events:
      - devargas_disable_safety_net
      - devargas_mode_complete
      - mode_devargas_stopping
    auto_launch: true
    balls_to_save: 1


widget_player:
  mode_devargas_started:
    devargas:
      action: play

  devargas_mode_complete:
    devargas:
      action: remove

  mode_devargas_stopping:
    devargas:
      action: remove


event_player:
  s_web_target_left_active: devargas_left_web_hit
  s_web_target_mid_active: devargas_center_web_hit
  s_pop_left_active: devargas_left_pop_hit
  s_pop_right_active: devargas_right_pop_hit

  s_left_drops_1_active: devargas_left_bank_hit
  s_left_drops_2_active: devargas_left_bank_hit
  s_left_drops_3_active: devargas_left_bank_hit
  s_left_drops_rubber_active: devargas_left_bank_hit

  s_right_drops_1_active: devargas_right_bank_hit
  s_right_drops_2_active: devargas_right_bank_hit
  s_right_drops_3_active: devargas_right_bank_hit
  s_right_drops_4_active: devargas_right_bank_hit
  s_right_drops_5_active: devargas_right_bank_hit
  s_right_drops_rubber_active: devargas_right_bank_hit

  s_inlane_a_active: devargas_upper_a_hit
  s_inlane_b_active: devargas_upper_b_hit
  s_inlane_m_r_active: devargas_middle_a_hit
  s_inlane_m_l_active: devargas_middle_b_hit

  s_upper_target_left_active: devargas_upper_targets_hit
  s_upper_target_center_active: devargas_upper_targets_hit
  s_upper_target_right_active: devargas_upper_targets_hit
  s_web_spinner_active: devargas_spinner_hit
  s_trispinner_opto_active: devargas_upper_spinner_hit

  # Neutral devices remain available but do not award DeVargas gold.
  s_saucer_1_active: delayed_kickout_saucer_1|750ms
  s_saucer_2_active: delayed_kickout_saucer_2|750ms
  s_saucer_3_active: delayed_kickout_saucer_3|750ms
  s_vuk_switch_active: up_kick|1.5s

  # Banks are not reset when selected. They reset normally when completed;
  # the rear rubber keeps a lit bank collectible when its targets are down.
  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_devargas_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - devargas_all_shots_off
    - rooftop_diverter_close
    - clear_saucers_delayed


light_player:
  mode_devargas_started:
    gi: 8080D0

  mode_devargas_stopping:
    gi: E0E0E0


