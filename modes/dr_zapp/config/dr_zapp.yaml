#config_version=6

# Doctor Zapp placeholder villain mode.
# Approved design: one left-bank and one right-bank target open roof access.
# Upper spinner camera flashes defeat Zapp at 25; each lit upper helper target
# adds +1 flash per spin. Drops score 100K, helpers 50K, flashes 50K.

mode:
  start_events: start_mode_dr_zapp
  stop_events:
    - dr_zapp_mode_complete
    - dr_zapp_mode_completed_summary
    - ball_ended
  code: dr_zapp.DrZapp
  priority: 300

widget_player:
  mode_dr_zapp_started:
    dr_zapp:
      action: play

  dr_zapp_mode_complete:
    dr_zapp:
      action: remove

  mode_dr_zapp_stopping:
    dr_zapp:
      action: remove

event_player:
  # Common playfield hits. Refine these later when the mode design is built out.
  s_pop_left_active: dr_zapp_shot_hit
  s_pop_right_active: dr_zapp_shot_hit
  s_trispinner_opto_active: dr_zapp_shot_hit
  s_web_spinner_active: dr_zapp_shot_hit
  s_star_rollover_active: dr_zapp_shot_hit
  s_upper_target_left_active: dr_zapp_shot_hit
  s_upper_target_center_active: dr_zapp_shot_hit
  s_upper_target_right_active: dr_zapp_shot_hit

  s_left_drops_1_active: dr_zapp_shot_hit
  s_left_drops_2_active: dr_zapp_shot_hit
  s_left_drops_3_active: dr_zapp_shot_hit
  s_right_drops_1_active: dr_zapp_shot_hit
  s_right_drops_2_active: dr_zapp_shot_hit
  s_right_drops_3_active: dr_zapp_shot_hit
  s_right_drops_4_active: dr_zapp_shot_hit
  s_right_drops_5_active: dr_zapp_shot_hit

  s_saucer_1_active:
    - dr_zapp_major_hit
    - clear_saucers
  s_saucer_2_active:
    - dr_zapp_major_hit
    - clear_saucers
  s_saucer_3_active:
    - dr_zapp_major_hit
    - clear_saucers
  s_vuk_switch_active: dr_zapp_major_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  mode_dr_zapp_started:
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_dr_zapp_stopping:
    - clear_saucers

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_dr_zapp_started:
    gi: 30A0FF

  mode_dr_zapp_stopping:
    gi: E0E0E0

