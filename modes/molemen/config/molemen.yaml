#config_version=6

# Molemen placeholder villain mode.
# Mode idea: A countdown threatens jackpot value; hit rescue shots to delay and cash.

mode:
  start_events: start_mode_molemen
  stop_events:
    - molemen_mode_complete
    - molemen_mode_completed_summary
    - ball_ended
  code: molemen.Molemen
  priority: 300

widget_player:
  mode_molemen_started:
    molemen:
      action: play

  molemen_mode_complete:
    molemen:
      action: remove

  mode_molemen_stopping:
    molemen:
      action: remove

event_player:
  # Common playfield hits. Refine these later when the mode design is built out.
  s_pop_left_active: molemen_shot_hit
  s_pop_right_active: molemen_shot_hit
  s_trispinner_opto_active: molemen_shot_hit
  s_web_spinner_active: molemen_shot_hit
  s_star_rollover_active: molemen_shot_hit
  s_upper_target_left_active: molemen_shot_hit
  s_upper_target_center_active: molemen_shot_hit
  s_upper_target_right_active: molemen_shot_hit

  s_left_drops_1_active: molemen_shot_hit
  s_left_drops_2_active: molemen_shot_hit
  s_left_drops_3_active: molemen_shot_hit
  s_right_drops_1_active: molemen_shot_hit
  s_right_drops_2_active: molemen_shot_hit
  s_right_drops_3_active: molemen_shot_hit
  s_right_drops_4_active: molemen_shot_hit
  s_right_drops_5_active: molemen_shot_hit

  s_saucer_1_active:
    - molemen_major_hit
    - clear_saucers
  s_saucer_2_active:
    - molemen_major_hit
    - clear_saucers
  s_saucer_3_active:
    - molemen_major_hit
    - clear_saucers
  s_vuk_switch_active: molemen_major_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  mode_molemen_started:
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset


light_player:
  # Full-playfield GI theme while this mode is active.
  mode_molemen_started:
    gi: C8F0FF

  mode_molemen_stopping:
    gi: E0E0E0

