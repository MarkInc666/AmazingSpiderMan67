#config_version=6

# Pardo: Hypnosis Reel.
# Each chance presents three choices. Spinner reveals which shot is real.
# Three correct shots within five chances defeats Pardo.

mode:
  start_events: start_mode_pardo
  stop_events:
    - pardo_mode_complete
    - pardo_mode_completed_summary
    - ball_ended
  code: pardo.Pardo
  priority: 300

widget_player:
  mode_pardo_started:
    pardo:
      action: play

  pardo_mode_complete:
    pardo:
      action: remove

  mode_pardo_stopping:
    pardo:
      action: remove

event_player:
  s_web_target_left_active: pardo_left_web_hit
  s_web_target_mid_active: pardo_center_web_hit

  # Either spinner reveals the current answer. Neither spinner is a choice.
  s_web_spinner_active: pardo_spinner_reveal
  s_trispinner_opto_active: pardo_spinner_switch

  # The three upper targets are one logical Pardo choice so adjacent
  # targets can never display conflicting good/bad states.
  s_upper_target_left_active: pardo_upper_targets_hit
  s_upper_target_center_active: pardo_upper_targets_hit
  s_upper_target_right_active: pardo_upper_targets_hit

  s_left_drops_1_active: pardo_left_drops_hit
  s_left_drops_2_active: pardo_left_drops_hit
  s_left_drops_3_active: pardo_left_drops_hit

  s_right_drops_1_active: pardo_right_drops_hit
  s_right_drops_2_active: pardo_right_drops_hit
  s_right_drops_3_active: pardo_right_drops_hit
  s_right_drops_4_active: pardo_right_drops_hit
  s_right_drops_5_active: pardo_right_drops_hit

  s_pop_left_active: pardo_pop_left_hit
  s_pop_right_active: pardo_pop_right_hit

  # Daily Bugle VUK is disabled during the mode, so Pardo
  # must always eject the ball itself.
  s_vuk_switch_active:
    - request_vuk_eject

  # Saucers are not Pardo choices, but they must still kick out.
  s_saucer_1_active: clear_saucers
  s_saucer_2_active: clear_saucers
  s_saucer_3_active: clear_saucers

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  pardo_startup_complete:
    - disable_daily_bugle_mystery
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_pardo_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - pardo_all_lights_off
    - clear_saucers

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_pardo_started:
    gi: A0A0F0

  mode_pardo_stopping:
    gi: E0E0E0

  pardo_all_lights_off:
    l_left_web_target: off
    l_mid_web_target: off
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off
    l_3bankbonus: off
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: off
    l_5bank_4: off
    l_5bank_5: off
    l_pop_1_1: off
    l_pop_1_2: off
    l_pop_1_3: off
    l_pop_1_4: off
    l_pop_1_5: off
    l_pop_1_6: off
    l_pop_1_7: off
    l_pop_1_8: off
    l_pop_1_9: off
    l_pop_1_10: off
    l_pop_1_11: off
    l_pop_1_12: off
    l_pop_2_1: off
    l_pop_2_2: off
    l_pop_2_3: off
    l_pop_2_4: off
    l_pop_2_5: off
    l_pop_2_6: off
    l_pop_2_7: off
    l_pop_2_8: off
    l_pop_2_9: off
    l_pop_2_10: off
    l_pop_2_11: off
    l_pop_2_12: off

  # Hidden state: green works through both white and green physical lenses,
  # so all three choices have the same visible color.
  pardo_hidden_left_web:
    l_left_web_target: green
  pardo_hidden_center_web:
    l_mid_web_target: green
  pardo_hidden_upper_targets:
    l_upper_left: green
    l_upper_middle: green
    l_upper_right: green
  pardo_hidden_left_drops:
    l_3bankbonus: green
  pardo_hidden_right_drops:
    l_5bank_1: green
    l_5bank_2: green
    l_5bank_3: green
    l_5bank_4: green
    l_5bank_5: green
  pardo_hidden_pop_left:
    l_pop_1_1: green
    l_pop_1_2: green
    l_pop_1_3: green
    l_pop_1_4: green
    l_pop_1_5: green
    l_pop_1_6: green
    l_pop_1_7: green
    l_pop_1_8: green
    l_pop_1_9: green
    l_pop_1_10: green
    l_pop_1_11: green
    l_pop_1_12: green
  pardo_hidden_pop_right:
    l_pop_2_1: green
    l_pop_2_2: green
    l_pop_2_3: green
    l_pop_2_4: green
    l_pop_2_5: green
    l_pop_2_6: green
    l_pop_2_7: green
    l_pop_2_8: green
    l_pop_2_9: green
    l_pop_2_10: green
    l_pop_2_11: green
    l_pop_2_12: green

  # Correct reveal: green, toggled on/off by Python every 250ms.
  pardo_reveal_good_on_left_web:
    l_left_web_target: green
  pardo_reveal_good_on_center_web:
    l_mid_web_target: green
  pardo_reveal_good_on_upper_targets:
    l_upper_left: green
    l_upper_middle: green
    l_upper_right: green
  pardo_reveal_good_on_left_drops:
    l_3bankbonus: green
  pardo_reveal_good_on_right_drops:
    l_5bank_1: green
    l_5bank_2: green
    l_5bank_3: green
    l_5bank_4: green
    l_5bank_5: green
  pardo_reveal_good_on_pop_left:
    l_pop_1_1: green
    l_pop_1_2: green
    l_pop_1_3: green
    l_pop_1_4: green
    l_pop_1_5: green
    l_pop_1_6: green
    l_pop_1_7: green
    l_pop_1_8: green
    l_pop_1_9: green
    l_pop_1_10: green
    l_pop_1_11: green
    l_pop_1_12: green
  pardo_reveal_good_on_pop_right:
    l_pop_2_1: green
    l_pop_2_2: green
    l_pop_2_3: green
    l_pop_2_4: green
    l_pop_2_5: green
    l_pop_2_6: green
    l_pop_2_7: green
    l_pop_2_8: green
    l_pop_2_9: green
    l_pop_2_10: green
    l_pop_2_11: green
    l_pop_2_12: green

  pardo_reveal_good_off_left_web:
    l_left_web_target: off
  pardo_reveal_good_off_center_web:
    l_mid_web_target: off
  pardo_reveal_good_off_upper_targets:
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off
  pardo_reveal_good_off_left_drops:
    l_3bankbonus: off
  pardo_reveal_good_off_right_drops:
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: off
    l_5bank_4: off
    l_5bank_5: off
  pardo_reveal_good_off_pop_left:
    l_pop_1_1: off
    l_pop_1_2: off
    l_pop_1_3: off
    l_pop_1_4: off
    l_pop_1_5: off
    l_pop_1_6: off
    l_pop_1_7: off
    l_pop_1_8: off
    l_pop_1_9: off
    l_pop_1_10: off
    l_pop_1_11: off
    l_pop_1_12: off
  pardo_reveal_good_off_pop_right:
    l_pop_2_1: off
    l_pop_2_2: off
    l_pop_2_3: off
    l_pop_2_4: off
    l_pop_2_5: off
    l_pop_2_6: off
    l_pop_2_7: off
    l_pop_2_8: off
    l_pop_2_9: off
    l_pop_2_10: off
    l_pop_2_11: off
    l_pop_2_12: off

  # Wrong choices turn off. Red is intentionally avoided because the two
  # drop-bank indicators have green physical lenses.
  pardo_reveal_bad_left_web:
    l_left_web_target: off
  pardo_reveal_bad_center_web:
    l_mid_web_target: off
  pardo_reveal_bad_upper_targets:
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off
  pardo_reveal_bad_left_drops:
    l_3bankbonus: off
  pardo_reveal_bad_right_drops:
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: off
    l_5bank_4: off
    l_5bank_5: off
  pardo_reveal_bad_pop_left:
    l_pop_1_1: off
    l_pop_1_2: off
    l_pop_1_3: off
    l_pop_1_4: off
    l_pop_1_5: off
    l_pop_1_6: off
    l_pop_1_7: off
    l_pop_1_8: off
    l_pop_1_9: off
    l_pop_1_10: off
    l_pop_1_11: off
    l_pop_1_12: off
  pardo_reveal_bad_pop_right:
