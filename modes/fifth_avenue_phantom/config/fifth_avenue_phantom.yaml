        l_1_hole_r: red
        l_2_hole_l: red
        l_2_hole_r: red
        l_3_hole_l: red
        l_3_hole_r: red
    - duration: 250ms
      lights:
        l_1_hole_l: off
        l_1_hole_r: off
        l_2_hole_l: off
        l_2_hole_r: off
        l_3_hole_l: off
        l_3_hole_r: off

  fifth_avenue_phantom_right_1_show:
