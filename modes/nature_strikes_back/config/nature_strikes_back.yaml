#config_version=6

mode:
  start_events: start_mode_nature_strikes_back
  stop_events:
    - ball_will_end
    - bonus_start
    - stop_mode_nature_strikes_back
    - ball_ended
  code: nature_strikes_back.NatureStrikesBack
  priority: 800

multiballs:
  nature_strikes_back_multiball:
    ball_count: 3
    ball_count_type: total
    shoot_again: 20s
    start_events: nature_strikes_back_start_multiball
    stop_events:
      - stop_mode_nature_strikes_back

  nature_strikes_back_add_a_ball:
    ball_count: 1
    ball_count_type: add
    shoot_again: 10s
    start_events: nature_strikes_back_add_a_ball

variable_player:
  multiball_nature_strikes_back_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_nature_strikes_back_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0
  multiball_nature_strikes_back_add_a_ball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_nature_strikes_back_add_a_ball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

widget_player:
  mode_nature_strikes_back_started:
    nature_strikes_back:
      action: play
  nature_strikes_back_mode_complete:
    nature_strikes_back:
      action: remove
  mode_nature_strikes_back_stopping:
    nature_strikes_back:
      action: remove

# Keep completed drop banks playable during the wizard.
event_player:
  mode_nature_strikes_back_started:
    - disable_daily_bugle_mystery
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
  mode_nature_strikes_back_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - clear_saucers_delayed
  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

