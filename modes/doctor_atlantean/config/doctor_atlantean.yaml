#config_version=6

# Doctor Atlantean - Up From Nowhere.
# The mode begins with a four-second six-band sinking animation. Pulsing-green
# upper targets lower the 0-8 water level; either upper exit raises it. Upper
# target/spinner activity resets the active water countdown. Reaching level 0
# raises Manhattan and wins; inactivity for a full countdown at level 8 loses.

mode:
  start_events: start_mode_doctor_atlantean
  stop_events:
    - doctor_atlantean_mode_complete
    - doctor_atlantean_mode_completed_summary
    - ball_ended
  code: doctor_atlantean.DoctorAtlantean
  priority: 300


widget_player:
  mode_doctor_atlantean_started:
    doctor_atlantean:
      action: play

  doctor_atlantean_mode_complete:
    doctor_atlantean:
      action: remove

  mode_doctor_atlantean_stopping:
    doctor_atlantean:
      action: remove


event_player:
  s_upper_target_left_active: doctor_atlantean_target_left_hit
  s_upper_target_center_active: doctor_atlantean_target_center_hit
  s_upper_target_right_active: doctor_atlantean_target_right_hit
  s_trispinner_opto_active: doctor_atlantean_upper_spinner_hit
  s_upper_exit_left_opto_active: doctor_atlantean_upper_exit_hit
  s_upper_exit_right_opto_active: doctor_atlantean_upper_exit_hit

  # Daily Bugle Mystery is disabled during this rooftop-control mode. The VUK
  # remains a route to the upper playfield and ejects normally.
  s_vuk_switch_active:
    - up_kick|1.5s

  s_saucer_1_active: clear_saucers
  s_saucer_2_active: clear_saucers
  s_saucer_3_active: clear_saucers

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_doctor_atlantean_started:
    - disable_daily_bugle_mystery
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_doctor_atlantean_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - doctor_atlantean_all_targets_off
    - doctor_atlantean_water_restore
    - rooftop_diverter_close
    - clear_saucers


show_player:
  doctor_atlantean_target_left_available:
    doctor_atlantean_upper_left_pulse: {loops: -1}
  doctor_atlantean_target_center_available:
    doctor_atlantean_upper_center_pulse: {loops: -1}
  doctor_atlantean_target_right_available:
    doctor_atlantean_upper_right_pulse: {loops: -1}

  doctor_atlantean_target_left_collected:
    doctor_atlantean_upper_left_pulse: {action: stop}
  doctor_atlantean_target_center_collected:
    doctor_atlantean_upper_center_pulse: {action: stop}
  doctor_atlantean_target_right_collected:
    doctor_atlantean_upper_right_pulse: {action: stop}

  doctor_atlantean_all_targets_off:
    doctor_atlantean_upper_left_pulse: {action: stop}
    doctor_atlantean_upper_center_pulse: {action: stop}
    doctor_atlantean_upper_right_pulse: {action: stop}

  doctor_atlantean_spinner_jackpot_ready:
    doctor_atlantean_upper_spinner_pulse: {loops: -1}

  doctor_atlantean_spinner_jackpot_collected:
    doctor_atlantean_upper_spinner_pulse: {action: stop}

  mode_doctor_atlantean_stopping:
    doctor_atlantean_upper_left_pulse: {action: stop}
    doctor_atlantean_upper_center_pulse: {action: stop}
    doctor_atlantean_upper_right_pulse: {action: stop}
    doctor_atlantean_upper_spinner_pulse: {action: stop}


light_player:
  doctor_atlantean_water_base_orange:
    gi: orange

  doctor_atlantean_water_restore:
    gi: E0E0E0

  doctor_atlantean_all_targets_off:
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off

  doctor_atlantean_target_left_collected:
    l_upper_left: off
  doctor_atlantean_target_center_collected:
    l_upper_middle: off
  doctor_atlantean_target_right_collected:
    l_upper_right: off

  # Horizontal water bands copied from the established eight-band playfield
  # layout. Each gameplay level owns exactly one band.
  doctor_atlantean_water_band_1_blue:
    l_gi_right_return: blue
    l_gi_left_sling_lower: blue
    l_gi_right_sling: blue
    l_gi_left_sling_upper: blue
    l_gi_left_upper_flipper: blue
    l_gi_right_lower_triangle: blue
  doctor_atlantean_water_band_1_orange:
    l_gi_right_return: orange
    l_gi_left_sling_lower: orange
    l_gi_right_sling: orange
    l_gi_left_sling_upper: orange
    l_gi_left_upper_flipper: orange
    l_gi_right_lower_triangle: orange

  doctor_atlantean_water_band_2_blue:
    l_gi_5bank_lower: blue
    l_gi_3bank: blue
    l_gi_5bank_upper: blue
    l_gi_left_lower: blue
    l_gi_spinner: blue
    l_pop_2_6: blue
  doctor_atlantean_water_band_2_orange:
    l_gi_5bank_lower: orange
    l_gi_3bank: orange
    l_gi_5bank_upper: orange
    l_gi_left_lower: orange
    l_gi_spinner: orange
    l_pop_2_6: orange

  doctor_atlantean_water_band_3_blue:
    l_gi_left_upper: blue
    l_pop_2_7: blue
    l_pop_2_5: blue
    l_pop_1_6: blue
    l_pop_1_5: blue
    l_pop_1_7: blue
  doctor_atlantean_water_band_3_orange:
    l_gi_left_upper: orange
    l_pop_2_7: orange
    l_pop_2_5: orange
    l_pop_1_6: orange
    l_pop_1_5: orange
    l_pop_1_7: orange

  doctor_atlantean_water_band_4_blue:
    l_pop_2_8: blue
    l_pop_1_4: blue
    l_pop_1_8: blue
    l_pop_2_4: blue
    l_pop_2_9: blue
  doctor_atlantean_water_band_4_orange:
    l_pop_2_8: orange
    l_pop_1_4: orange
    l_pop_1_8: orange
    l_pop_2_4: orange
    l_pop_2_9: orange

  doctor_atlantean_water_band_5_blue:
    l_pop_1_9: blue
    l_pop_1_3: blue
    l_pop_2_3: blue
    l_pop_2_10: blue
    l_pop_1_2: blue
    l_pop_1_10: blue
  doctor_atlantean_water_band_5_orange:
    l_pop_1_9: orange
    l_pop_1_3: orange
    l_pop_2_3: orange
    l_pop_2_10: orange
    l_pop_1_2: orange
    l_pop_1_10: orange

  doctor_atlantean_water_band_6_blue:
    l_pop_2_2: blue
    l_pop_2_11: blue
    l_pop_1_11: blue
    l_pop_1_1: blue
    l_pop_1_12: blue
    l_pop_2_12: blue
  doctor_atlantean_water_band_6_orange:
    l_pop_2_2: orange
    l_pop_2_11: orange
    l_pop_1_11: orange
    l_pop_1_1: orange
    l_pop_1_12: orange
    l_pop_2_12: orange

  doctor_atlantean_water_band_7_blue:
    l_pop_2_1: blue
    l_gi_upflip: blue
    l_gi_ramp: blue
    l_gi_bright: blue
    l_gi_ab: blue
    l_gi_a: blue
  doctor_atlantean_water_band_7_orange:
    l_pop_2_1: orange
    l_gi_upflip: orange
    l_gi_ramp: orange
    l_gi_bright: orange
    l_gi_ab: orange
    l_gi_a: orange

  doctor_atlantean_water_band_8_blue:
    l_gi_mid_spider: blue
    l_gi_top_4: blue
    l_gi_top_3: blue
    l_gi_top_1: blue
    l_gi_top_2: blue
  doctor_atlantean_water_band_8_orange:
    l_gi_mid_spider: orange
    l_gi_top_4: orange
    l_gi_top_3: orange
    l_gi_top_1: orange
    l_gi_top_2: orange


shows:
  doctor_atlantean_upper_left_pulse:
    - duration: 500ms
      lights: {l_upper_left: "00FF00"}
    - duration: 500ms
      lights: {l_upper_left: "004000"}

  doctor_atlantean_upper_center_pulse:
    - duration: 500ms
      lights: {l_upper_middle: "00FF00"}
    - duration: 500ms
      lights: {l_upper_middle: "004000"}

  doctor_atlantean_upper_right_pulse:
    - duration: 500ms
      lights: {l_upper_right: "00FF00"}
    - duration: 500ms
      lights: {l_upper_right: "004000"}

  doctor_atlantean_upper_spinner_pulse:
    - duration: 500ms
      lights: {l_gi_a: "00FF00"}
    - duration: 500ms
      lights: {l_gi_a: "004000"}
