#config_version=6

# Diana - Archery Volley
# Limited arrows/flips. Upper entry stages a Hunt; either upper exit prompts the
# player, and the first right-bank hit starts the 8s timer (12s with More Time).

mode:
  start_events: start_mode_diana
  stop_events:
    - diana_mode_complete
    - diana_mode_completed_summary
    - ball_ended
  code: diana.Diana
  priority: 300

widget_player:
  mode_diana_started:
    diana:
      action: play

  diana_mode_complete:
    diana:
      action: remove

  mode_diana_stopping:
    diana:
      action: remove

event_player:
  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  # Rearm upstairs. Daily Bugle/Vulture-style shared VUK handling is left alone.
  s_trispinner_opto_active:
    - diana_upper_spinner_hit

  s_upper_exit_right_opto_active:
    - diana_upper_right_exit

  s_upper_exit_left_opto_active:
    - diana_upper_left_exit

  s_upper_entrance_opto_active:
    - diana_upper_entered

  # Timed Hunt bullseyes.
  s_right_drops_1_active:
    - diana_right_drop_1_hit
  s_right_drops_2_active:
    - diana_right_drop_2_hit
  s_right_drops_3_active:
    - diana_right_drop_3_hit
  s_right_drops_4_active:
    - diana_right_drop_4_hit
  s_right_drops_5_active:
    - diana_right_drop_5_hit

  # Repeatable 50K/100K arrow shot. The first rubber hit also starts the Hunt timer.
  s_right_drops_rubber_active:
    - diana_right_rubber_hit

  # Diana does not use saucers during gameplay; kick out any ball that lands there.
  s_saucer_1_active: clear_saucers
  s_saucer_2_active: clear_saucers
  s_saucer_3_active: clear_saucers

  # Double-flipper post release is handled in Diana Python so the chord costs no arrows.

  mode_diana_stopping:
    - clear_saucers
    - diana_clear_all_lights

coil_player:
  diana_drop_right_target_1:
    c_right_bank_drop_1:
      action: pulse
  diana_drop_right_target_2:
    c_right_bank_drop_2:
      action: pulse
  diana_drop_right_target_3:
    c_right_bank_drop_3:
      action: pulse
  diana_drop_right_target_4:
    c_right_bank_drop_4:
      action: pulse
  diana_drop_right_target_5:
    c_right_bank_drop_5:
      action: pulse

light_player:
  # Normal Diana GI before and between Hunts.
  mode_diana_started:
    gi: D8D0FF

  diana_rearm_phase_started:
    gi: D8D0FF
    l_spinner: yellow
    l_gi_a: yellow
    l_gi_ramp: yellow

  # Red full-playfield GI begins as soon as a Hunt is staged and remains red
  # while waiting for the first right-bank hit and throughout the timer.
  diana_hunt_mode_on:
    gi: red
    l_spinner: off
    l_gi_a: off
    l_gi_ramp: off

  diana_hunt_mode_off:
    gi: D8D0FF
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: off
    l_5bank_4: off
    l_5bank_5: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off

  diana_hunt_1_staged:
    l_5bank_1: green
    l_5bank_2: off
    l_5bank_3: green
    l_5bank_4: off
    l_5bank_5: green
    l_gi_5bank_lower: red
    l_gi_5bank_upper: red

  diana_hunt_2_staged:
    l_5bank_1: off
    l_5bank_2: green
    l_5bank_3: off
    l_5bank_4: green
    l_5bank_5: off
    l_gi_5bank_lower: red
    l_gi_5bank_upper: red

  diana_hunt_3_staged:
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: green
    l_5bank_4: off
    l_5bank_5: off
    l_gi_5bank_lower: red
    l_gi_5bank_upper: red

  diana_target_1_collected:
    l_5bank_1: off
  diana_target_2_collected:
    l_5bank_2: off
  diana_target_3_collected:
    l_5bank_3: off
  diana_target_4_collected:
    l_5bank_4: off
  diana_target_5_collected:
    l_5bank_5: off

  mode_diana_stopping:
    gi: E0E0E0

  diana_clear_all_lights:
    l_spinner: off
    l_gi_a: off
    l_gi_ramp: off
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: off
    l_5bank_4: off
    l_5bank_5: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off
