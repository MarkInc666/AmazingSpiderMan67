  goblin_gi_unsafe:
    goblin_gi_safe_show:
      action: stop
    goblin_gi_unsafe_show:
      loops: -1
  goblin_gi_safe:
    goblin_gi_unsafe_show:
      action: stop
    goblin_gi_safe_show:
      loops: -1
  goblin_gi_stop:
    goblin_gi_unsafe_show:
      action: stop
    goblin_gi_safe_show:
      action: stop
  goblin_mode_ended:
    goblin_star_flash_show:
      action: stop
    goblin_star_solid_show:
      action: stop
    goblin_pops_flash_show:
      action: stop
    goblin_pops_solid_show:
      action: stop
    goblin_left_web_flash_show:
      action: stop
    goblin_left_web_solid_show:
      action: stop
    goblin_right_web_flash_show:
      action: stop
    goblin_right_web_solid_show:
      action: stop
    goblin_left_drops_flash_show:
      action: stop
    goblin_left_drops_solid_show:
      action: stop
    goblin_right_drops_flash_show:
      action: stop
    goblin_right_drops_solid_show:
      action: stop
    goblin_saucers_lit_show:
      action: stop
    goblin_gi_unsafe_show:
      action: stop
    goblin_gi_safe_show:
      action: stop

