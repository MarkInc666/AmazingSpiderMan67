shows:
  # Final Showdown start: all three lower saucers flash together. The numbered
  # inserts have green lenses and the hole lamps have red lenses, so white is
  # used here for maximum physical visibility through the existing lenses.
  final_wizard_saucer_ready_show:
    - duration: 200ms
      lights:
        l_1: white
        l_1_hole_l: white
        l_1_hole_r: white
        l_2: white
        l_2_hole_l: white
        l_2_hole_r: white
        l_3: white
        l_3_hole_l: white
        l_3_hole_r: white
    - duration: 200ms
      lights:
        l_1: off
        l_1_hole_l: off
        l_1_hole_r: off
        l_2: off
        l_2_hole_l: off
        l_2_hole_r: off
        l_3: off
        l_3_hole_l: off
        l_3_hole_r: off

  saucer_cluster_state_0:
    - duration: -1
      lights:
        (hole_left): off
        (hole_right): off

  # Villain qualification uses only the two lamps around each saucer hole.
  # State 1 is a slow white pulse; each additional available villain speeds
  # the pulse up. The numbered 1/2/3 inserts are intentionally not used.
  saucer_cluster_state_1:
    - duration: 900ms
      lights:
        (hole_left):
          color: white
          fade: 900ms
        (hole_right):
          color: white
          fade: 900ms
    - duration: 900ms
      lights:
        (hole_left):
          color: off
          fade: 900ms
        (hole_right):
          color: off
          fade: 900ms

  saucer_cluster_state_2:
    - duration: 650ms
      lights:
        (hole_left):
          color: white
          fade: 650ms
        (hole_right):
          color: white
          fade: 650ms
    - duration: 650ms
      lights:
        (hole_left):
          color: off
          fade: 650ms
        (hole_right):
          color: off
          fade: 650ms

  saucer_cluster_state_3:
    - duration: 450ms
      lights:
        (hole_left):
          color: white
          fade: 450ms
        (hole_right):
          color: white
          fade: 450ms
    - duration: 450ms
      lights:
        (hole_left):
          color: off
          fade: 450ms
        (hole_right):
          color: off
          fade: 450ms

  saucer_cluster_state_4:
    - duration: 300ms
      lights:
        (hole_left):
          color: white
          fade: 300ms
        (hole_right):
          color: white
          fade: 300ms
    - duration: 300ms
      lights:
        (hole_left):
          color: off
          fade: 300ms
        (hole_right):
          color: off
          fade: 300ms

  saucer_cluster_state_5:
    - duration: 180ms
      lights:
        (hole_left): white
        (hole_right): white
    - duration: 180ms
      lights:
        (hole_left): off
        (hole_right): off

