#config_version=6

mode:
  code: qualify_system.QualifySystem
  start_events: ball_started
  stop_events: ball_ending
  priority: 115

event_player:
  villain_qualify_drop_bank_reset_request:
    - drop_target_bank_dt_bank_left_reset

  s_left_drops_1_active:
    - villain_qualify_drop_1_hit

  s_left_drops_2_active:
    - villain_qualify_drop_2_hit

  s_left_drops_3_active:
    - villain_qualify_drop_3_hit

  # Rooftop targets also build villain readiness at the associated saucer.
  s_upper_target_left_active:
    - villain_qualify_rooftop_target_1_hit

  s_upper_target_center_active:
    - villain_qualify_rooftop_target_2_hit

  s_upper_target_right_active:
    - villain_qualify_rooftop_target_3_hit

  s_star_rollover_active:
    - saucer_star_upgrade_hit

show_player:
  clear_villain_saucer_lights:
    saucer_cluster_state_0:
      action: stop
    saucer_cluster_state_1:
      action: stop
    saucer_cluster_state_2:
      action: stop
    saucer_cluster_state_3:
      action: stop
    saucer_cluster_state_4:
      action: stop
    saucer_cluster_state_5:
      action: stop
    final_wizard_saucer_ready_show:
      action: stop

  final_wizard_saucers_ready:
    final_wizard_saucer_ready_show:
      action: play
      key: final_wizard_saucers

  final_wizard_saucers_clear:
    final_wizard_saucer_ready_show:
      action: stop
      key: final_wizard_saucers

      
  saucer_1_restore_state_0:
    saucer_cluster_state_0:
      key: saucer_1
      show_tokens:
        hole_left: l_1_hole_l
        hole_right: l_1_hole_r

