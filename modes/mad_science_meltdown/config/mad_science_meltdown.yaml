#config_version=6

# Mad Science Meltdown - Chapter 7 repeatable scoring multiball.

mode:
  start_events: start_mode_mad_science_meltdown
  stop_events:
    - ball_will_end
    - bonus_start
    - stop_mode_mad_science_meltdown
    - mad_science_meltdown_mode_complete
    - ball_ended
  code: mad_science_meltdown.MadScienceMeltdown
  priority: 800

multiballs:
  mad_science_meltdown_multiball:
    ball_count: 3
    ball_count_type: total
    shoot_again: 20s
    start_events: mad_science_meltdown_start_multiball
    stop_events:
      - stop_mode_mad_science_meltdown

  mad_science_meltdown_add_a_ball:
    ball_count: 1
    ball_count_type: add
    shoot_again: 10s
    start_events: mad_science_meltdown_add_a_ball

variable_player:
  multiball_mad_science_meltdown_multiball_started:
    multiball_autoplunge_active: {action: set, int: 1}
  multiball_mad_science_meltdown_multiball_ended:
    multiball_autoplunge_active: {action: set, int: 0}
  multiball_mad_science_meltdown_add_a_ball_started:
    multiball_autoplunge_active: {action: set, int: 1}
  multiball_mad_science_meltdown_add_a_ball_ended:
    multiball_autoplunge_active: {action: set, int: 0}

widget_player:
  mode_mad_science_meltdown_started:
    mad_science_meltdown: {action: play}
  mad_science_meltdown_mode_complete:
    mad_science_meltdown: {action: remove}
  mode_mad_science_meltdown_stopping:
    mad_science_meltdown: {action: remove}

event_player:
  mode_mad_science_meltdown_started:
    - mad_science_meltdown_setup
  mode_mad_science_meltdown_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - rooftop_diverter_close
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
    - mad_science_meltdown_clear_all_lights
    - mad_science_meltdown_vuk_chase_stop

  mad_science_meltdown_setup:
    - disable_daily_bugle_mystery
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
    - mad_science_meltdown_clear_all_lights
    - mad_science_meltdown_base_lights_start

  multiball_mad_science_meltdown_multiball_ended:
    - mad_science_meltdown_multiball_ended

  s_left_drops_1_active: mad_science_meltdown_left_drop_1_hit
  s_left_drops_2_active: mad_science_meltdown_left_drop_2_hit
  s_left_drops_3_active: mad_science_meltdown_left_drop_3_hit
  drop_target_bank_dt_bank_left_down: mad_science_meltdown_left_bank_complete

  s_right_drops_1_active: mad_science_meltdown_right_drop_1_hit
  s_right_drops_2_active: mad_science_meltdown_right_drop_2_hit
  s_right_drops_3_active: mad_science_meltdown_right_drop_3_hit
  s_right_drops_4_active: mad_science_meltdown_right_drop_4_hit
  s_right_drops_5_active: mad_science_meltdown_right_drop_5_hit
  drop_target_bank_dt_bank_right_down: mad_science_meltdown_right_bank_complete

  s_web_target_left_active: mad_science_meltdown_gas_left_web_hit
  s_pop_left_active: mad_science_meltdown_gas_left_pop_hit
  s_web_target_mid_active:
    - mad_science_meltdown_gas_center_web_hit
    - mad_science_meltdown_center_web_hit
  s_pop_right_active: mad_science_meltdown_gas_right_pop_hit
  s_sling_l_active: mad_science_meltdown_gas_left_sling_hit
  s_sling_r_active: mad_science_meltdown_gas_right_sling_hit

  s_web_spinner_active: mad_science_meltdown_lower_spinner_hit
  s_trispinner_opto_active: mad_science_meltdown_upper_spinner_hit
  s_upper_target_left_active: mad_science_meltdown_upper_target_left_hit
  s_upper_target_center_active: mad_science_meltdown_upper_target_center_hit
  s_upper_target_right_active: mad_science_meltdown_upper_target_right_hit

  # Dr. Magneto's established middle A/B rollovers qualify center web.
  s_inlane_m_r_active: mad_science_meltdown_a_hit
  s_inlane_m_l_active: mad_science_meltdown_b_hit

  s_saucer_1_active: mad_science_meltdown_saucer_1_hit
  s_saucer_2_active: mad_science_meltdown_saucer_2_hit
  s_saucer_3_active: mad_science_meltdown_saucer_3_hit
  s_vuk_switch_active: mad_science_meltdown_vuk_hit

