#config_version=6

# Master Technician is a 60-second spinner/drop-target score attack. Each down
# target raises the spinner value. Dropping all eight costs 10 seconds and
# resets both banks, so the player should stop at seven and spin.

mode:
  start_events: start_mode_master_technician
  stop_events:
    - master_technician_mode_complete
    - ball_ended
  code: master_technician.MasterTechnician
  priority: 300

widget_player:
  mode_master_technician_started:
    master_technician:
      action: play
  master_technician_mode_complete:
    master_technician:
      action: remove
  mode_master_technician_stopping:
    master_technician:
      action: remove

event_player:
  mode_master_technician_started:
    - master_technician_reset_banks
    - rooftop_diverter_close
    - master_technician_start

  s_web_spinner_active: master_technician_spinner_hit
  s_web_target_left_active: master_technician_web_hit
  s_web_target_mid_active: master_technician_web_hit

  s_inlane_l_active: master_technician_inlane_hit
  s_inlane_r_active: master_technician_inlane_hit

  s_left_drops_1_active: master_technician_left_drop_1_hit
  s_left_drops_2_active: master_technician_left_drop_2_hit
  s_left_drops_3_active: master_technician_left_drop_3_hit
  s_right_drops_1_active: master_technician_right_drop_1_hit
  s_right_drops_2_active: master_technician_right_drop_2_hit
  s_right_drops_3_active: master_technician_right_drop_3_hit
  s_right_drops_4_active: master_technician_right_drop_4_hit
  s_right_drops_5_active: master_technician_right_drop_5_hit

  s_saucer_1_active: delayed_kickout_saucer_1
  s_saucer_2_active: delayed_kickout_saucer_2
  s_saucer_3_active: delayed_kickout_saucer_3

  master_technician_reset_banks:
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset|300ms

  mode_master_technician_stopping:
    - master_technician_reset_banks
    - master_technician_clear_lights
    - rooftop_diverter_close

show_player:
  master_technician_drop_scored:
    master_technician_drop_hit_show:
      loops: 1
      priority: 340

  master_technician_spinner_scored:
    master_technician_spinner_hit_show:
      loops: 1
      priority: 340

  master_technician_level_0:
    master_technician_level_pulse:
      action: stop
      key: master_technician_level_pulse

  master_technician_level_1:
    master_technician_level_pulse:
      action: play
      loops: -1
      speed: 0.75
      key: master_technician_level_pulse
      priority: 320
  master_technician_level_2:
    master_technician_level_pulse:
      action: play
      loops: -1
      speed: 1
      key: master_technician_level_pulse
      priority: 320
  master_technician_level_3:
    master_technician_level_pulse:
      action: play
      loops: -1
      speed: 1.25
      key: master_technician_level_pulse
      priority: 320
  master_technician_level_4:
    master_technician_level_pulse:
      action: play
      loops: -1
      speed: 1.5
      key: master_technician_level_pulse
      priority: 320
  master_technician_level_5:
    master_technician_level_pulse:
      action: play
      loops: -1
      speed: 2
      key: master_technician_level_pulse
      priority: 320
  master_technician_level_6:
    master_technician_level_pulse:
      action: play
      loops: -1
      speed: 2.75
      key: master_technician_level_pulse
      priority: 320
  master_technician_level_7:
    master_technician_level_pulse:
      action: play
      loops: -1
      speed: 4
      key: master_technician_level_pulse
      priority: 320

  master_technician_time_penalty:
    master_technician_short_circuit_show:
      loops: 2
      priority: 330

  master_technician_safety_net_used:
    master_technician_safety_net_show:
      loops: 2
      priority: 330

  master_technician_clear_lights:
    master_technician_level_pulse:
      action: stop
      key: master_technician_level_pulse

light_player:
  mode_master_technician_started:
    gi: "203060"
  mode_master_technician_stopping:
    gi: E0E0E0

  master_technician_level_0:
    l_spinner: off
    l_gi_3bank: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off
  master_technician_light_webs:
    l_left_web_target: white
    l_mid_web_target: white
  master_technician_clear_webs:
    l_left_web_target: off
    l_mid_web_target: off
  master_technician_clear_lights:
    l_spinner: off
    l_left_web_target: off
    l_mid_web_target: off
    l_gi_3bank: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off

shows:
  master_technician_drop_hit_show:
    - duration: 100ms
      lights:
        l_gi_3bank: A0D0FF
        l_gi_5bank_lower: A0D0FF
        l_gi_5bank_upper: A0D0FF
    - duration: 100ms
      lights:
        l_gi_3bank: off
        l_gi_5bank_lower: off
        l_gi_5bank_upper: off

  master_technician_spinner_hit_show:
    - duration: 100ms
      lights:
        l_spinner: FFFF40
    - duration: 100ms
      lights:
        l_spinner: white

  master_technician_level_pulse:
    - duration: 500ms
      lights:
        l_spinner: white
        l_gi_3bank: white
        l_gi_5bank_lower: white
        l_gi_5bank_upper: white
    - duration: 500ms
      lights:
        l_spinner: off
        l_gi_3bank: off
        l_gi_5bank_lower: off
        l_gi_5bank_upper: off

  master_technician_short_circuit_show:
    - duration: 125ms
      lights:
        l_gi_3bank: red
        l_gi_5bank_lower: red
        l_gi_5bank_upper: red
    - duration: 125ms
      lights:
        l_gi_3bank: off
        l_gi_5bank_lower: off
        l_gi_5bank_upper: off

  master_technician_safety_net_show:
    - duration: 125ms
      lights:
        l_gi_3bank: green
        l_gi_5bank_lower: green
        l_gi_5bank_upper: green
    - duration: 125ms
      lights:
        l_gi_3bank: off
        l_gi_5bank_lower: off
        l_gi_5bank_upper: off
