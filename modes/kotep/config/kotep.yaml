#config_version=6

mode:
  start_events: start_mode_kotep
  stop_events:
    - ball_will_end
    - bonus_start
    - kotep_mode_complete
    - ball_ended
  code: kotep.Kotep
  priority: 300

widget_player:
  mode_kotep_started:
    kotep:
      action: play

  kotep_mode_complete:
    kotep:
      action: remove

  mode_kotep_stopping:
    kotep:
      action: remove

event_player:
  s_web_target_left_active: kotep_left_web_hit
  s_web_target_mid_active: kotep_center_web_hit

  s_left_drops_1_active: kotep_left_drops_hit
  s_left_drops_2_active: kotep_left_drops_hit
  s_left_drops_3_active: kotep_left_drops_hit

  s_right_drops_1_active: kotep_right_drops_hit
  s_right_drops_2_active: kotep_right_drops_hit
  s_right_drops_3_active: kotep_right_drops_hit
  s_right_drops_4_active: kotep_right_drops_hit
  s_right_drops_5_active: kotep_right_drops_hit

  s_pop_left_active: kotep_left_pop_hit
  s_pop_right_active: kotep_right_pop_hit

  s_vuk_switch_active:
    - kotep_vuk_hit

  # Kotep does not use the three lower saucers. Always kick them out.
  s_saucer_1_active: delayed_kickout_saucer_1
  s_saucer_2_active: delayed_kickout_saucer_2
  s_saucer_3_active: delayed_kickout_saucer_3

  mode_kotep_started:
    - disable_daily_bugle_mystery
    - rooftop_diverter_close
    - clear_saucers_delayed
    - reset_drops

  mode_kotep_stopping:
    - rooftop_diverter_close
    - clear_saucers_delayed
    - reset_drops
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state

  # Keep both physical banks playable even if a bank is completed.
  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

show_player:
  kotep_start_scepter_ramp_flash:
    kotep_scepter_ramp_flash:
      loops: -1
  kotep_stop_scepter_ramp_flash:
    kotep_scepter_ramp_flash:
      action: stop
  kotep_super_burst:
    kotep_super_burst:
      loops: 0

