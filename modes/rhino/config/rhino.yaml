#config_version=6

mode:
  start_events: start_mode_rhino_bash
  stop_events:
    - ball_will_end
    - bonus_start
    - rhino_bash_complete
    - rhino_mode_complete
    - rhino_mode_completed_summary
    - ball_ended
  code: rhino.RhinoBash
  priority: 300


widget_player:
  mode_rhino_started:
    rhino:
      action: play

  rhino_bash_complete:
    rhino:
      action: remove

  mode_rhino_stopping:
    rhino:
      action: remove

event_player:
  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  rhino_startup_complete:
    - rhino_start
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset|100ms
    - drop_target_bank_dt_bank_right_reset|200ms  

  # Pops build rage
  s_pop_left_active:
    - rhino_pop_hit

  s_pop_right_active:
    - rhino_pop_hit

  # Rhino Smash switches
  s_left_drops_1_active:
    - rhino_smash_hit
  s_left_drops_2_active:
    - rhino_smash_hit
  s_left_drops_3_active:
    - rhino_smash_hit

  s_right_drops_1_active:
    - rhino_smash_hit
  s_right_drops_2_active:
    - rhino_smash_hit
  s_right_drops_3_active:
    - rhino_smash_hit
  s_right_drops_4_active:
    - rhino_smash_hit
  s_right_drops_5_active:
    - rhino_smash_hit

  s_web_target_left_active:
    - rhino_smash_hit
  s_web_target_mid_active:
    - rhino_smash_hit

  s_saucer_1_active:
    - rhino_smash_hit
    - clear_saucers
    
  s_saucer_2_active:
    - rhino_smash_hit
    - clear_saucers
    
  s_saucer_3_active:
    - rhino_smash_hit
    - clear_saucers    

  s_web_spinner_active:
    - rhino_smash_hit
  s_trispinner_opto_active:
    - rhino_smash_hit

  s_upper_target_left_active:
    - rhino_smash_hit
  s_upper_target_center_active:
    - rhino_smash_hit
  s_upper_target_right_active:
    - rhino_smash_hit

  s_upper_exit_left_opto_active:
    - rhino_smash_hit
  s_upper_exit_right_opto_active:
    - rhino_smash_hit

  s_inlane_a_active:
    - rhino_jackpot_collect_request
  s_inlane_b_active:
    - rhino_jackpot_collect_request

  # All four A/B rollovers collect the current jackpot.
  s_inlane_m_r_active:
    - rhino_jackpot_collect_request
  s_inlane_m_l_active:
    - rhino_jackpot_collect_request

show_player:

  rhino_jackpot_collected:
    rhino_jackpot_collect_show:
      loops: 1

  rhino_show_rage_0:
    rhino_rage_0:
      loops: -1

  rhino_show_rage_1:
    rhino_rage_0:
      action: stop
    rhino_rage_1:
      loops: -1

  rhino_show_rage_2:
    rhino_rage_1:
      action: stop
    rhino_rage_2:
      loops: -1

  rhino_show_rage_3:
    rhino_rage_2:
      action: stop
    rhino_rage_3:
      loops: -1

  rhino_show_rage_4:
    rhino_rage_3:
      action: stop
    rhino_rage_4:
      loops: -1

  rhino_show_rage_5:
    rhino_rage_4:
      action: stop
    rhino_rage_5:
      loops: -1


  rhino_ab_relight_after_jackpot:
    rhino_ab_relight_show:
      loops: -1
      priority: 20

  rhino_berserk_started:
    rhino_berserk_gi:
      loops: -1

  rhino_berserk_stopped:
    rhino_berserk_gi:
      action: stop
    rhino_rage_5:
      action: stop

  rhino_crashed:
    rhino_crash_show:
      loops: 1

  rhino_bash_complete:
    rhino_ab_relight_show:
      action: stop
    rhino_berserk_gi:
      action: stop
    rhino_rage_0:
      action: stop
    rhino_rage_1:
      action: stop
    rhino_rage_2:
      action: stop
    rhino_rage_3:
      action: stop
    rhino_rage_4:
      action: stop
    rhino_rage_5:
      action: stop
    rhino_bash_complete_show:
      loops: 1

