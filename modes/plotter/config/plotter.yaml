#config_version=6

mode:
  start_events: start_mode_plotter
  stop_events:
    - plotter_mode_complete
    - plotter_mode_completed_summary
    - ball_ended
  code: plotter.Plotter
  priority: 300

widget_player:
  mode_plotter_started:
    plotter:
      action: play

  plotter_mode_complete:
    plotter:
      action: remove

  mode_plotter_stopping:
    plotter:
      action: remove

event_player:
  s_pop_left_active: plotter_pop_hit
  s_pop_right_active: plotter_pop_hit

  s_web_spinner_active: plotter_spinner_hit
  s_trispinner_opto_active: plotter_spinner_hit

  s_saucer_1_active: plotter_saucer_1_hit
  s_saucer_2_active: plotter_saucer_2_hit
  s_saucer_3_active: plotter_saucer_3_hit

  s_vuk_switch_active: plotter_vuk_hit
  s_upper_target_center_active: plotter_back_page_hit

  mode_plotter_started:
    - disable_daily_bugle_mystery
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
    - rooftop_diverter_close

  mode_plotter_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - rooftop_diverter_close
    - plotter_clear_lights

show_player:
  plotter_saucer_1_lit:
    foswell_saucer_1_lit:
      loops: -1

  plotter_saucer_1_collected:
    foswell_saucer_1_lit:
      action: stop

  plotter_saucer_2_lit:
    foswell_saucer_2_lit:
      loops: -1

  plotter_saucer_2_collected:
    foswell_saucer_2_lit:
      action: stop

  plotter_saucer_3_lit:
    foswell_saucer_3_lit:
      loops: -1

  plotter_saucer_3_collected:
    foswell_saucer_3_lit:
      action: stop

  plotter_super_lit_show:
    foswell_vuk_super_lit:
      loops: -1

  plotter_super_collected:
    foswell_vuk_super_lit:
      action: stop

  plotter_back_page_lit_show:
    foswell_back_page_lit:
      loops: -1

  plotter_back_page_collected:
    foswell_back_page_lit:
      action: stop

  plotter_clear_lights:
    foswell_saucer_1_lit:
      action: stop
    foswell_saucer_2_lit:
      action: stop
    foswell_saucer_3_lit:
      action: stop
    foswell_vuk_super_lit:
      action: stop
    foswell_back_page_lit:
      action: stop

shows:
  foswell_saucer_1_lit:
    - duration: 500ms
      lights:
        l_1: yellow
        l_1_hole_l: yellow
        l_1_hole_r: yellow
    - duration: 500ms
      lights:
        l_1: off
        l_1_hole_l: off
        l_1_hole_r: off

  foswell_saucer_2_lit:
    - duration: 500ms
      lights:
        l_2: yellow
        l_2_hole_l: yellow
        l_2_hole_r: yellow
    - duration: 500ms
      lights:
        l_2: off
        l_2_hole_l: off
        l_2_hole_r: off

  foswell_saucer_3_lit:
    - duration: 500ms
      lights:
        l_3: yellow
        l_3_hole_l: yellow
        l_3_hole_r: yellow
    - duration: 500ms
      lights:
        l_3: off
        l_3_hole_l: off
        l_3_hole_r: off

  foswell_vuk_super_lit:
    - duration: 300ms
      lights:
        l_advance_multiplier: red
    - duration: 300ms
      lights:
        l_mid_multibonus: red
    - duration: 300ms
      lights:
        l_mid_web_target: red

  foswell_back_page_lit:
    - duration: 250ms
      lights:
        l_upper_middle: white
    - duration: 250ms
      lights:
        l_upper_middle: off

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_plotter_started:
    gi: FFB000

  mode_plotter_stopping:
    gi: E0E0E0

