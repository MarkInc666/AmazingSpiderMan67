#config_version=6

# Mastermind Trap mini-wizard - Chapter 2.
# Three mixed phases cycle until multiball ends, with a timed web-target Super
# after every full cycle.

mode:
  start_events: start_mode_mastermind_trap
  stop_events:
    - ball_will_end
    - bonus_start
    - stop_mode_mastermind_trap
    - ball_ended
  code: mastermind_trap.MastermindTrap
  priority: 800

multiballs:
  mastermind_trap_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 18s
    start_events: mastermind_trap_start_multiball
    add_a_ball_events:
      - mastermind_trap_add_a_ball
    add_a_ball_shoot_again: 10s
    add_a_ball_hurry_up_time: 3s
    stop_events:
      - stop_mode_mastermind_trap

variable_player:
  multiball_mastermind_trap_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1
  multiball_mastermind_trap_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

widget_player:
  mode_mastermind_trap_started:
    mastermind_trap:
      action: play
  mastermind_trap_mode_complete:
    mastermind_trap:
      action: remove
    mode_status:
      action: remove
    mode_timer_status:
      action: remove
  mode_mastermind_trap_stopping:
    mastermind_trap:
      action: remove
    mode_status:
      action: remove
    mode_timer_status:
      action: remove
    mode_message:
      action: remove
  stop_mode_mastermind_trap:
    mastermind_trap:
      action: remove
    mode_status:
      action: remove
    mode_timer_status:
      action: remove
    mode_message:
      action: remove

event_player:
  mode_mastermind_trap_started:
    - disable_daily_bugle_mystery
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
    - rooftop_diverter_close
  mode_mastermind_trap_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - clear_saucers_delayed
    - rooftop_diverter_close
    - mastermind_trap_clear_lights
  multiball_mastermind_trap_multiball_ended: mastermind_trap_multiball_ended
  mastermind_trap_mode_complete: stop_mode_mastermind_trap
  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

show_player:
  mastermind_trap_phase_para:
    mastermind_para_saucers:
      action: play
      loops: -1
    mastermind_para_upper_targets:
      action: play
      loops: -1
  mastermind_trap_phase_lizard:
    mastermind_para_saucers: {action: stop}
    mastermind_para_upper_targets: {action: stop}
    mastermind_lizard_pops:
      action: play
      loops: -1
  mastermind_trap_delivery_all_on:
    mastermind_lizard_pops: {action: stop}
    mastermind_delivery_left_web: {action: play, loops: -1}
    mastermind_delivery_left_bank: {action: play, loops: -1}
    mastermind_delivery_right_bank: {action: play, loops: -1}
    mastermind_delivery_upper: {action: play, loops: -1}
  mastermind_trap_delivery_left_web_off:
    mastermind_delivery_left_web: {action: stop}
  mastermind_trap_delivery_left_bank_off:
    mastermind_delivery_left_bank: {action: stop}
  mastermind_trap_delivery_right_bank_off:
    mastermind_delivery_right_bank: {action: stop}
  mastermind_trap_delivery_upper_off:
    mastermind_delivery_upper: {action: stop}
  mastermind_trap_delivery_clear:
    mastermind_delivery_left_web: {action: stop}
    mastermind_delivery_left_bank: {action: stop}
    mastermind_delivery_right_bank: {action: stop}
    mastermind_delivery_upper: {action: stop}
  mastermind_trap_phase_doc:
    mastermind_delivery_left_web: {action: stop}
    mastermind_delivery_left_bank: {action: stop}
    mastermind_delivery_right_bank: {action: stop}
    mastermind_delivery_upper: {action: stop}
    mastermind_doc_spinner:
      action: play
      loops: -1
    mastermind_doc_inlanes:
      action: play
      loops: -1
  mastermind_trap_doc_3x_on:
    mastermind_doc_spinner_3x:
      action: play
      loops: -1
    mastermind_doc_spinner: {action: stop}
  mastermind_trap_doc_3x_off:
    mastermind_doc_spinner_3x: {action: stop}
    mastermind_doc_spinner:
      action: play
      loops: -1
  mastermind_trap_doc_clear:
    mastermind_doc_spinner: {action: stop}
    mastermind_doc_spinner_3x: {action: stop}
    mastermind_doc_inlanes: {action: stop}
  mastermind_trap_super_on:
    mastermind_super_webs:
      action: play
      loops: -1
  mastermind_trap_super_off:
    mastermind_super_webs: {action: stop}
  mastermind_trap_clear_lights:
    mastermind_para_saucers: {action: stop}
    mastermind_para_upper_targets: {action: stop}
    mastermind_para_left_bank: {action: stop}
    mastermind_para_pops: {action: stop}
    mastermind_para_right_bank: {action: stop}
    mastermind_roof_choice: {action: stop}
    mastermind_lizard_pops: {action: stop}
    mastermind_delivery_left_web: {action: stop}
    mastermind_delivery_left_bank: {action: stop}
    mastermind_delivery_right_bank: {action: stop}
    mastermind_delivery_upper: {action: stop}
    mastermind_doc_spinner: {action: stop}
    mastermind_doc_spinner_3x: {action: stop}
    mastermind_doc_inlanes: {action: stop}
    mastermind_super_webs: {action: stop}

  mastermind_trap_roof_choice_on:
    mastermind_roof_choice:
      action: play
      loops: -1
  mastermind_trap_roof_choice_off:
    mastermind_roof_choice: {action: stop}
  mastermind_trap_para_stage_left_bank:
    mastermind_para_left_bank: {action: play, loops: -1}
  mastermind_trap_para_stage_pops:
    mastermind_para_pops: {action: play, loops: -1}
  mastermind_trap_para_stage_right_bank:
    mastermind_para_right_bank: {action: play, loops: -1}
  mastermind_trap_para_area_collected:
    mastermind_para_left_bank: {action: stop}
    mastermind_para_pops: {action: stop}
    mastermind_para_right_bank: {action: stop}

shows:
  mastermind_para_saucers:
    - duration: 700ms
      lights:
        l_1_hole_l: FFFFFF
        l_1_hole_r: FFFFFF
        l_2_hole_l: FFFFFF
        l_2_hole_r: FFFFFF
        l_3_hole_l: FFFFFF
        l_3_hole_r: FFFFFF
    - duration: 700ms
      lights:
        l_1_hole_l: 202020
        l_1_hole_r: 202020
        l_2_hole_l: 202020
        l_2_hole_r: 202020
        l_3_hole_l: 202020
        l_3_hole_r: 202020
  mastermind_para_upper_targets:
    - duration: 500ms
      lights:
        l_upper_left: white
        l_upper_middle: white
        l_upper_right: white
    - duration: 500ms
      lights:
        l_upper_left: off
        l_upper_middle: off
        l_upper_right: off
  mastermind_roof_choice:
    - duration: 400ms
      lights:
        l_gi_top_1: white
        l_upper_left: white
        l_gi_top_4: off
        l_upper_right: off
    - duration: 400ms
      lights:
        l_gi_top_1: off
        l_upper_left: off
        l_gi_top_4: white
        l_upper_right: white
  mastermind_para_left_bank:
    - duration: 300ms
      lights: {l_3bankbonus: green, l_gi_3bank: green}
    - duration: 300ms
      lights: {l_3bankbonus: off, l_gi_3bank: off}
  mastermind_para_right_bank:
    - duration: 300ms
      lights:
        l_5bank_1: green
        l_5bank_2: green
        l_5bank_3: green
        l_5bank_4: green
        l_5bank_5: green
        l_gi_5bank_lower: green
        l_gi_5bank_upper: green
    - duration: 300ms
      lights:
        l_5bank_1: off
        l_5bank_2: off
        l_5bank_3: off
        l_5bank_4: off
        l_5bank_5: off
        l_gi_5bank_lower: off
        l_gi_5bank_upper: off
  mastermind_para_pops:
    - duration: 300ms
      lights:
        l_pop_1_1: green
        l_pop_1_4: green
        l_pop_1_7: green
        l_pop_1_10: green
        l_pop_2_1: green
        l_pop_2_4: green
        l_pop_2_7: green
        l_pop_2_10: green
    - duration: 300ms
      lights:
        l_pop_1_1: off
        l_pop_1_4: off
        l_pop_1_7: off
        l_pop_1_10: off
        l_pop_2_1: off
        l_pop_2_4: off
        l_pop_2_7: off
        l_pop_2_10: off
  mastermind_lizard_pops:
    - duration: 500ms
      lights:
        l_pop_1_1: green
        l_pop_1_4: green
        l_pop_1_7: green
        l_pop_1_10: green
        l_pop_2_1: green
        l_pop_2_4: green
        l_pop_2_7: green
        l_pop_2_10: green
    - duration: 500ms
      lights:
        l_pop_1_1: off
        l_pop_1_4: off
        l_pop_1_7: off
        l_pop_1_10: off
        l_pop_2_1: off
        l_pop_2_4: off
        l_pop_2_7: off
        l_pop_2_10: off
  mastermind_delivery_left_web:
    - duration: 300ms
      lights: {l_left_web_target: yellow}
    - duration: 300ms
      lights: {l_left_web_target: blue}
  mastermind_delivery_left_bank:
    - duration: 300ms
      lights: {l_3bankbonus: yellow}
    - duration: 300ms
      lights: {l_3bankbonus: blue}
  mastermind_delivery_right_bank:
    - duration: 300ms
      lights:
        l_5bank_1: yellow
        l_5bank_2: yellow
        l_5bank_3: yellow
        l_5bank_4: yellow
        l_5bank_5: yellow
    - duration: 300ms
      lights:
        l_5bank_1: blue
        l_5bank_2: blue
        l_5bank_3: blue
        l_5bank_4: blue
        l_5bank_5: blue
  mastermind_delivery_upper:
    - duration: 300ms
      lights: {l_upper_left: yellow, l_upper_middle: yellow, l_upper_right: yellow}
    - duration: 300ms
      lights: {l_upper_left: blue, l_upper_middle: blue, l_upper_right: blue}
  mastermind_doc_spinner:
    - duration: 400ms
      lights: {l_spinner: white}
    - duration: 400ms
      lights: {l_spinner: 303030}
  mastermind_doc_spinner_3x:
    - duration: 150ms
      lights: {l_spinner: white}
    - duration: 150ms
      lights: {l_spinner: off}
  mastermind_doc_inlanes:
    - duration: 500ms
      lights: {l_left_inlane: white, l_right_inlane: white}
    - duration: 500ms
      lights: {l_left_inlane: 303030, l_right_inlane: 303030}
  mastermind_super_webs:
    - duration: 150ms
      lights: {l_left_web_target: white, l_mid_web_target: white}
    - duration: 150ms
      lights: {l_left_web_target: off, l_mid_web_target: off}

light_player:
  mode_mastermind_trap_started:
    gi: 7030A0
  mode_mastermind_trap_stopping:
    gi: E0E0E0

  mastermind_trap_saucer_1_held:
    l_1_hole_l: white
    l_1_hole_r: white
  mastermind_trap_saucer_2_held:
    l_2_hole_l: white
    l_2_hole_r: white
  mastermind_trap_saucer_3_held:
    l_3_hole_l: white
    l_3_hole_r: white
  mastermind_trap_saucer_1_released:
    l_1_hole_l: off
    l_1_hole_r: off
  mastermind_trap_saucer_2_released:
    l_2_hole_l: off
    l_2_hole_r: off
  mastermind_trap_saucer_3_released:
    l_3_hole_l: off
    l_3_hole_r: off

  mastermind_trap_doc_saucer_1_red:
    l_1_hole_l: red
    l_1_hole_r: red
    l_1: red
  mastermind_trap_doc_saucer_1_off:
    l_1_hole_l: off
    l_1_hole_r: off
    l_1: off
  mastermind_trap_doc_saucer_2_red:
    l_2_hole_l: red
    l_2_hole_r: red
    l_2: red
  mastermind_trap_doc_saucer_2_off:
    l_2_hole_l: off
    l_2_hole_r: off
    l_2: off
  mastermind_trap_doc_saucer_3_red:
    l_3_hole_l: red
    l_3_hole_r: red
    l_3: red
  mastermind_trap_doc_saucer_3_off:
    l_3_hole_l: off
    l_3_hole_r: off
    l_3: off
  mastermind_trap_doc_star_red: {l_star: red}
  mastermind_trap_doc_star_off: {l_star: off}
  mastermind_trap_doc_upper_a_red: {l_a_rollover: red}
  mastermind_trap_doc_upper_a_off: {l_a_rollover: off}
  mastermind_trap_doc_upper_b_red: {l_b_rollover: red}
  mastermind_trap_doc_upper_b_off: {l_b_rollover: off}
