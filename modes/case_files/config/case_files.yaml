#config_version=6

mode:
  code: case_files.CaseFiles
  start_events: ball_started
  stop_events: ball_ending
  priority: 120

widget_player:
  case_files_status_changed{current_player.villain_mode_running != 1 and current_player.villain_mode_in_summary != 1 and current_player.chapter_mini_wizard_ready != 1 and current_player.mini_wizard_daily_bugle_ready != 1 and current_player.mini_wizard_vuk_hold_active != 1 and current_player.final_wizard_ready != 1 and current_player.chapter_select_needed != 1 and current_player.chapter_select_active != 1}:
    daily_bugle_ready:
      action: play
      key: daily_bugle_ready

  case_files_active_helpers_changed{current_player.villain_mode_running != 1 and current_player.villain_mode_in_summary != 1 and current_player.chapter_mini_wizard_ready != 1 and current_player.mini_wizard_daily_bugle_ready != 1 and current_player.mini_wizard_vuk_hold_active != 1 and current_player.final_wizard_ready != 1 and current_player.chapter_select_needed != 1 and current_player.chapter_select_active != 1}:
    daily_bugle_ready:
      action: play
      key: daily_bugle_ready

  case_files_status_changed{current_player.villain_mode_running == 1 or current_player.villain_mode_in_summary == 1 or current_player.chapter_mini_wizard_ready == 1 or current_player.mini_wizard_daily_bugle_ready == 1 or current_player.mini_wizard_vuk_hold_active == 1 or current_player.final_wizard_ready == 1 or current_player.chapter_select_needed == 1 or current_player.chapter_select_active == 1}:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  case_files_active_helpers_changed{current_player.villain_mode_running == 1 or current_player.villain_mode_in_summary == 1 or current_player.chapter_mini_wizard_ready == 1 or current_player.mini_wizard_daily_bugle_ready == 1 or current_player.mini_wizard_vuk_hold_active == 1 or current_player.final_wizard_ready == 1 or current_player.chapter_select_needed == 1 or current_player.chapter_select_active == 1}:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

  case_files_hidden_for_wizard:
    daily_bugle_ready:
      action: remove
      key: daily_bugle_ready

event_player:
  s_web_spinner_active{current_player.villain_mode_running != 1}:
    - case_file_spinner_hit

  s_right_drops_1_active{current_player.villain_mode_running != 1}:
    - case_file_drop_1_hit
  s_right_drops_2_active{current_player.villain_mode_running != 1}:
    - case_file_drop_2_hit
  s_right_drops_3_active{current_player.villain_mode_running != 1}:
    - case_file_drop_3_hit
  s_right_drops_4_active{current_player.villain_mode_running != 1}:
    - case_file_drop_4_hit
  s_right_drops_5_active{current_player.villain_mode_running != 1}:
    - case_file_drop_5_hit


