#config_version=6

# Conner's Reptiles — Swamp Rampage. Pops reveal random Jackpot objectives;
# collecting every revealed objective opens the gate for the VUK Super.

mode:
  start_events: start_mode_conners_reptiles
  stop_events:
    - conners_reptiles_mode_complete
    - conners_reptiles_mode_completed_summary
    - ball_ended
  code: conners_reptiles.ConnersReptiles
  priority: 300

ball_saves:
  conners_reptiles_10s_save:
    active_time: 10s
    hurry_up_time: 2s
    grace_period: 1s
    enable_events: conners_reptiles_enable_10s_ball_save
    disable_events:
      - conners_reptiles_mode_complete
      - mode_conners_reptiles_stopping
    auto_launch: true
    balls_to_save: 1
  conners_reptiles_20s_save:
    active_time: 20s
    hurry_up_time: 2s
    grace_period: 1s
    enable_events: conners_reptiles_enable_20s_ball_save
    disable_events:
      - conners_reptiles_mode_complete
      - mode_conners_reptiles_stopping
    auto_launch: true
    balls_to_save: 1

widget_player:
  mode_conners_reptiles_started:
    conners_reptiles: {action: play}
  conners_reptiles_mode_complete:
    conners_reptiles: {action: remove}
  mode_conners_reptiles_stopping:
    conners_reptiles: {action: remove}

event_player:
  s_pop_left_active: conners_reptiles_pop_hit
  s_pop_right_active: conners_reptiles_pop_hit

  s_inlane_a_active: conners_reptiles_upper_a_hit
  s_inlane_b_active: conners_reptiles_upper_b_hit
  s_inlane_m_r_active: conners_reptiles_middle_a_hit
  s_inlane_m_l_active: conners_reptiles_middle_b_hit
  s_web_target_left_active: conners_reptiles_left_web_hit
  s_web_target_mid_active: conners_reptiles_center_web_hit
  s_star_rollover_active: conners_reptiles_star_hit

  s_saucer_1_active:
    - conners_reptiles_saucer_1_hit
    - clear_saucers_delayed
  s_saucer_2_active:
    - conners_reptiles_saucer_2_hit
    - clear_saucers_delayed
  s_saucer_3_active:
    - conners_reptiles_saucer_3_hit
    - clear_saucers_delayed

  s_vuk_switch_active: conners_reptiles_vuk_hit

  mode_conners_reptiles_started:
    - disable_daily_bugle_mystery
    - rooftop_diverter_close
    - clear_saucers_delayed
    - conners_reptiles_clear_all_lights
  mode_conners_reptiles_stopping:
    - conners_reptiles_clear_all_lights
    - clear_saucers_delayed
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - rooftop_diverter_close

light_player:
  mode_conners_reptiles_started:
    gi: 408020
  mode_conners_reptiles_stopping:
    gi: E0E0E0

show_player:
  conners_reptiles_pop_pulse_start:
    conners_reptiles_pop_pulse: {loops: -1, priority: 330}
  conners_reptiles_upper_a_lit:
    conners_reptiles_upper_a_pulse: {loops: -1, priority: 340}
  conners_reptiles_upper_a_collected:
    conners_reptiles_upper_a_pulse: {action: stop}
  conners_reptiles_upper_b_lit:
    conners_reptiles_upper_b_pulse: {loops: -1, priority: 340}
  conners_reptiles_upper_b_collected:
    conners_reptiles_upper_b_pulse: {action: stop}
  conners_reptiles_middle_a_lit:
    conners_reptiles_middle_a_pulse: {loops: -1, priority: 340}
  conners_reptiles_middle_a_collected:
    conners_reptiles_middle_a_pulse: {action: stop}
  conners_reptiles_middle_b_lit:
    conners_reptiles_middle_b_pulse: {loops: -1, priority: 340}
  conners_reptiles_middle_b_collected:
    conners_reptiles_middle_b_pulse: {action: stop}
  conners_reptiles_left_web_lit:
    conners_reptiles_left_web_pulse: {loops: -1, priority: 340}
  conners_reptiles_left_web_collected:
    conners_reptiles_left_web_pulse: {action: stop}
  conners_reptiles_center_web_lit:
    conners_reptiles_center_web_pulse: {loops: -1, priority: 340}
  conners_reptiles_center_web_collected:
    conners_reptiles_center_web_pulse: {action: stop}
  conners_reptiles_saucers_lit:
    conners_reptiles_saucers_pulse: {loops: -1, priority: 340}
  conners_reptiles_saucers_collected:
    conners_reptiles_saucers_pulse: {action: stop}
  conners_reptiles_star_lit:
    conners_reptiles_star_pulse: {loops: -1, priority: 340}
  conners_reptiles_star_collected:
    conners_reptiles_star_pulse: {action: stop}

  conners_reptiles_clear_jackpot_lights: &stop_reptile_jackpots
    conners_reptiles_upper_a_pulse: {action: stop}
    conners_reptiles_upper_b_pulse: {action: stop}
    conners_reptiles_middle_a_pulse: {action: stop}
    conners_reptiles_middle_b_pulse: {action: stop}
    conners_reptiles_left_web_pulse: {action: stop}
    conners_reptiles_center_web_pulse: {action: stop}
    conners_reptiles_saucers_pulse: {action: stop}
    conners_reptiles_star_pulse: {action: stop}
  conners_reptiles_clear_all_lights:
    <<: *stop_reptile_jackpots
    conners_reptiles_pop_pulse: {action: stop}

shows:
  conners_reptiles_pop_pulse:
    - duration: 450ms
      lights:
        l_pop_1_1: 60F060
        l_pop_1_2: 60F060
        l_pop_1_3: 60F060
        l_pop_1_4: 60F060
        l_pop_1_5: 60F060
        l_pop_1_6: 60F060
        l_pop_1_7: 60F060
        l_pop_1_8: 60F060
        l_pop_1_9: 60F060
        l_pop_1_10: 60F060
        l_pop_1_11: 60F060
        l_pop_1_12: 60F060
        l_pop_2_1: 60F060
        l_pop_2_2: 60F060
        l_pop_2_3: 60F060
        l_pop_2_4: 60F060
        l_pop_2_5: 60F060
        l_pop_2_6: 60F060
        l_pop_2_7: 60F060
        l_pop_2_8: 60F060
        l_pop_2_9: 60F060
        l_pop_2_10: 60F060
        l_pop_2_11: 60F060
        l_pop_2_12: 60F060
    - duration: 450ms
      lights:
        l_pop_1_1: off
        l_pop_1_2: off
        l_pop_1_3: off
        l_pop_1_4: off
        l_pop_1_5: off
        l_pop_1_6: off
        l_pop_1_7: off
        l_pop_1_8: off
        l_pop_1_9: off
        l_pop_1_10: off
        l_pop_1_11: off
        l_pop_1_12: off
        l_pop_2_1: off
        l_pop_2_2: off
        l_pop_2_3: off
        l_pop_2_4: off
        l_pop_2_5: off
        l_pop_2_6: off
        l_pop_2_7: off
        l_pop_2_8: off
        l_pop_2_9: off
        l_pop_2_10: off
        l_pop_2_11: off
        l_pop_2_12: off

  conners_reptiles_upper_a_pulse:
    - duration: 450ms
      lights: {l_a_rollover: yellow}
    - duration: 450ms
      lights: {l_a_rollover: off}
  conners_reptiles_upper_b_pulse:
    - duration: 450ms
      lights: {l_b_rollover: yellow}
    - duration: 450ms
      lights: {l_b_rollover: off}
  conners_reptiles_middle_a_pulse:
    - duration: 450ms
      lights: {l_right_a: yellow}
    - duration: 450ms
      lights: {l_right_a: off}
  conners_reptiles_middle_b_pulse:
    - duration: 450ms
      lights: {l_left_b: yellow}
    - duration: 450ms
      lights: {l_left_b: off}
  conners_reptiles_left_web_pulse:
    - duration: 450ms
      lights: {l_left_web_target: white}
    - duration: 450ms
      lights: {l_left_web_target: off}
  conners_reptiles_center_web_pulse:
    - duration: 450ms
      lights: {l_mid_web_target: white}
    - duration: 450ms
      lights: {l_mid_web_target: off}
  conners_reptiles_saucers_pulse:
    - duration: 450ms
      lights:
        l_1_hole_l: red
        l_1_hole_r: red
        l_2_hole_l: red
        l_2_hole_r: red
        l_3_hole_l: red
        l_3_hole_r: red
    - duration: 450ms
      lights:
        l_1_hole_l: off
        l_1_hole_r: off
        l_2_hole_l: off
        l_2_hole_r: off
        l_3_hole_l: off
        l_3_hole_r: off
  conners_reptiles_star_pulse:
    - duration: 450ms
      lights: {l_star: red}
    - duration: 450ms
      lights: {l_star: off}
