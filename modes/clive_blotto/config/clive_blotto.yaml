#config_version=6

# Clive and Blotto placeholder villain mode.
# Approved design: Blotto Meter starts at 3/4 and rises every 2 seconds. Spinner
# hits lower it and pause growth for 2 seconds. A full meter Blotto's a clean
# area; any hit in that area clears it. Win with no Blotto'd areas and meter 0.

mode:
  start_events: start_mode_clive_blotto
  stop_events:
    - clive_blotto_mode_complete
    - clive_blotto_mode_completed_summary
    - ball_ended
  code: clive_blotto.CliveBlotto
  priority: 300

widget_player:
  mode_clive_blotto_started:
    clive_blotto:
      action: play

  clive_blotto_mode_complete:
    clive_blotto:
      action: remove

  mode_clive_blotto_stopping:
    clive_blotto:
      action: remove

event_player:
  # Common playfield hits. Refine these later when the mode design is built out.
  s_pop_left_active: clive_blotto_shot_hit
  s_pop_right_active: clive_blotto_shot_hit
  s_trispinner_opto_active: clive_blotto_shot_hit
  s_web_spinner_active: clive_blotto_shot_hit
  s_star_rollover_active: clive_blotto_shot_hit
  s_upper_target_left_active: clive_blotto_shot_hit
  s_upper_target_center_active: clive_blotto_shot_hit
  s_upper_target_right_active: clive_blotto_shot_hit

  s_left_drops_1_active: clive_blotto_shot_hit
  s_left_drops_2_active: clive_blotto_shot_hit
  s_left_drops_3_active: clive_blotto_shot_hit
  s_right_drops_1_active: clive_blotto_shot_hit
  s_right_drops_2_active: clive_blotto_shot_hit
  s_right_drops_3_active: clive_blotto_shot_hit
  s_right_drops_4_active: clive_blotto_shot_hit
  s_right_drops_5_active: clive_blotto_shot_hit

  s_saucer_1_active:
    - clive_blotto_major_hit
    - clear_saucers
  s_saucer_2_active:
    - clive_blotto_major_hit
    - clear_saucers
  s_saucer_3_active:
    - clive_blotto_major_hit
    - clear_saucers
  s_vuk_switch_active: clive_blotto_major_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  mode_clive_blotto_started:
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_clive_blotto_stopping:
    - clear_saucers

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_clive_blotto_started:
    gi: 80FF20

  mode_clive_blotto_stopping:
    gi: E0E0E0

