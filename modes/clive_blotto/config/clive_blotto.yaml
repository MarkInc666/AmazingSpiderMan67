#config_version=6

mode:
  start_events: start_mode_clive_blotto
  stop_events:
    - stop_mode_clive_blotto
    - ball_will_end
    - bonus_start
    - ball_ended
  code: clive_blotto.CliveBlotto
  priority: 300

widget_player:
  mode_clive_blotto_started:
    clive_blotto:
      action: play
  clive_blotto_mode_complete:
    clive_blotto:
      action: remove
  clive_blotto_mode_failed:
    clive_blotto:
      action: remove
  mode_clive_blotto_stopping:
    clive_blotto:
      action: remove

event_player:
  s_saucer_1_active: clear_saucers_delayed
  s_saucer_2_active: clear_saucers_delayed
  s_saucer_3_active: clear_saucers_delayed

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

  mode_clive_blotto_started:
    - bonus_lights_dim
  mode_clive_blotto_stopping:
    - bonus_lights_restore
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

light_player:
  clive_blotto_mode_lighting_start:
    gi: 40A0A0
    l_spinner: FFFFFF

  # Keep spinner guidance constant. Infected-zone lighting carries urgency.
  clive_blotto_meter_low: {}
  clive_blotto_meter_medium: {}
  clive_blotto_meter_high: {}

  # Infected areas pulse between 50% and 100% magenta.
  # Cleared areas remain light green (40A0A0).
  clive_blotto_clear_upper_left:
    l_gi_ramp: 40A0A0
    l_gi_top_1: 40A0A0
    l_gi_top_2: 40A0A0
  clive_blotto_clear_upper_right:
    l_gi_a: 40A0A0
    l_gi_ab: 40A0A0
    l_gi_bright: 40A0A0
    l_gi_mid_spider: 40A0A0
    l_gi_top_3: 40A0A0
    l_gi_top_4: 40A0A0
    l_gi_upflip: 40A0A0
  clive_blotto_clear_middle_left:
    l_gi_3bank: 40A0A0
    l_gi_left_lower: 40A0A0
    l_gi_left_upper: 40A0A0
    l_gi_left_upper_flipper: 40A0A0
    l_gi_spinner: 40A0A0
  clive_blotto_clear_middle_right:
    l_gi_5bank_lower: 40A0A0
    l_gi_5bank_upper: 40A0A0
    l_gi_right_lower_triangle: 40A0A0
  clive_blotto_clear_lower_left:
    l_gi_left_sling_lower: 40A0A0
    l_gi_left_sling_upper: 40A0A0
  clive_blotto_clear_lower_right:
    l_gi_right_return: 40A0A0
    l_gi_right_sling: 40A0A0

  clive_blotto_completion_lights:
    gi: 40FF40
  clive_blotto_restore_all_lights:
    gi: E0E0E0
    l_spinner: off

show_player:
  clive_blotto_infect_upper_left:
    clive_blotto_infected_upper_left:
      action: play
      loops: -1
      priority: 500
  clive_blotto_clear_upper_left:
    clive_blotto_infected_upper_left: {action: stop}
  clive_blotto_infect_upper_right:
    clive_blotto_infected_upper_right:
      action: play
      loops: -1
      priority: 500
  clive_blotto_clear_upper_right:
    clive_blotto_infected_upper_right: {action: stop}
  clive_blotto_infect_middle_left:
    clive_blotto_infected_middle_left:
      action: play
      loops: -1
      priority: 500
  clive_blotto_clear_middle_left:
    clive_blotto_infected_middle_left: {action: stop}
  clive_blotto_infect_middle_right:
    clive_blotto_infected_middle_right:
      action: play
      loops: -1
      priority: 500
  clive_blotto_clear_middle_right:
    clive_blotto_infected_middle_right: {action: stop}
  clive_blotto_infect_lower_left:
    clive_blotto_infected_lower_left:
      action: play
      loops: -1
      priority: 500
  clive_blotto_clear_lower_left:
    clive_blotto_infected_lower_left: {action: stop}
  clive_blotto_infect_lower_right:
    clive_blotto_infected_lower_right:
      action: play
      loops: -1
      priority: 500
  clive_blotto_clear_lower_right:
    clive_blotto_infected_lower_right: {action: stop}
  # Play once per infection / clear state transition (not on refresh).
  # Temporary higher-priority GI flashes reveal the underlying zone colors when done.
  clive_blotto_meter_full_flash:
    clive_blotto_spread_flash:
      action: play
      loops: 0
      priority: 700
  clive_blotto_area_clear_flash:
    clive_blotto_clear_flash:
      action: play
      loops: 0
      priority: 700
  clive_blotto_right_pop_pulse_on:
    clive_blotto_right_pop_infected:
      loops: -1
      priority: 500
  clive_blotto_right_pop_pulse_off:
    clive_blotto_right_pop_infected: {action: stop}
  clive_blotto_completion_lights:
    clive_blotto_infected_upper_left: {action: stop}
    clive_blotto_infected_upper_right: {action: stop}
    clive_blotto_infected_middle_left: {action: stop}
    clive_blotto_infected_middle_right: {action: stop}
    clive_blotto_infected_lower_left: {action: stop}
    clive_blotto_infected_lower_right: {action: stop}
    clive_blotto_right_pop_infected: {action: stop}
  mode_clive_blotto_stopping:
    clive_blotto_infected_upper_left: {action: stop}
    clive_blotto_infected_upper_right: {action: stop}
    clive_blotto_infected_middle_left: {action: stop}
    clive_blotto_infected_middle_right: {action: stop}
    clive_blotto_infected_lower_left: {action: stop}
    clive_blotto_infected_lower_right: {action: stop}
    clive_blotto_right_pop_infected: {action: stop}

