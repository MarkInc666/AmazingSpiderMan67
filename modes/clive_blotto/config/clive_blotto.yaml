      lights:
        gi: 40FF40
    - duration: 1ms
      lights:
        gi: stop
  clive_blotto_infected_upper_left:
    # Pulse continuously between 50% and 100% magenta.
    - duration: 650ms
      lights:
        l_gi_ramp:
