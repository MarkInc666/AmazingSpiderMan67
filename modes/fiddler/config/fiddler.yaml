    l_pop_2_8: off
    l_pop_2_9: off
    l_pop_2_10: off
    l_pop_2_11: off
    l_pop_2_12: off

shows:
  fiddler_saucer_ready_pulse:
    - duration: 500ms
      lights:
        l_1_hole_l: FFFFFF
        l_1_hole_r: FFFFFF
        l_2_hole_l: FFFFFF
        l_2_hole_r: FFFFFF
        l_3_hole_l: FFFFFF
        l_3_hole_r: FFFFFF
    - duration: 500ms
      lights:
        l_1_hole_l: 404040
        l_1_hole_r: 404040
        l_2_hole_l: 404040
        l_2_hole_r: 404040
        l_3_hole_l: 404040
        l_3_hole_r: 404040
