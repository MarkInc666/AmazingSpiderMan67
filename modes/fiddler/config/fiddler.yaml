#config_version=6

mode:
  start_events: start_mode_fiddler
  stop_events:
    - fiddler_mode_complete
    - fiddler_mode_completed_summary
    - ball_ended
  code: fiddler.Fiddler
  priority: 300

widget_player:
  mode_fiddler_started:
    fiddler: {action: play}
  fiddler_mode_complete:
    fiddler: {action: remove}
  mode_fiddler_stopping:
    fiddler: {action: remove}

# Temporary mappings. Replace these sound assets with the final violin notes later;
# the Python gameplay only posts play_note_1..4 and play_bad_note.
sound_player:
  play_note_1:
    spark_1: {action: play, bus: effects}
  play_note_2:
    spark_1: {action: play, bus: effects}
  play_note_3:
    spark_1: {action: play, bus: effects}
  play_note_4:
    spark_1: {action: play, bus: effects}
  play_bad_note:
    electro_zap: {action: play, bus: effects}

event_player:
  s_web_target_left_active: fiddler_left_web_hit
  s_left_drops_rubber_active: fiddler_left_bank_hit
  s_web_target_mid_active: fiddler_center_web_hit
  s_right_drops_rubber_active: fiddler_right_bank_hit

  # Keep ordinary devices safe while Fiddler owns the drop-bank playfield space.
  s_saucer_1_active: clear_saucers_delayed
  s_saucer_2_active: clear_saucers_delayed
  s_saucer_3_active: clear_saucers_delayed

  mode_fiddler_started:
    - rooftop_diverter_close
    - clear_saucers_delayed

  mode_fiddler_stopping:
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

light_player:
  mode_fiddler_started:
    gi: 60F060
  mode_fiddler_stopping:
    gi: E0E0E0

  fiddler_left_web_solid:
    l_left_web_target: white
  fiddler_left_web_off:
    l_left_web_target: off
  fiddler_left_bank_solid:
    l_gi_3bank: 60F060
  fiddler_left_bank_off:
    l_gi_3bank: off
  fiddler_center_web_solid:
    l_mid_web_target: white
  fiddler_center_web_off:
    l_mid_web_target: off
  fiddler_right_bank_solid:
    l_gi_5bank_lower: 60F060
    l_gi_5bank_upper: 60F060
  fiddler_right_bank_off:
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off
  fiddler_all_notes_off:
    l_left_web_target: off
    l_gi_3bank: off
    l_mid_web_target: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off

shows:
  fiddler_left_web_flash_show:
    - duration: 200ms
      lights: {l_left_web_target: white}
    - duration: 200ms
      lights: {l_left_web_target: off}
  fiddler_left_bank_flash_show:
    - duration: 200ms
      lights: {l_gi_3bank: 60F060}
    - duration: 200ms
      lights: {l_gi_3bank: off}
  fiddler_center_web_flash_show:
    - duration: 200ms
      lights: {l_mid_web_target: white}
    - duration: 200ms
      lights: {l_mid_web_target: off}
  fiddler_right_bank_flash_show:
    - duration: 200ms
      lights:
        l_gi_5bank_lower: 60F060
        l_gi_5bank_upper: 60F060
    - duration: 200ms
      lights:
        l_gi_5bank_lower: off
        l_gi_5bank_upper: off

show_player:
  fiddler_left_web_flash:
    fiddler_left_web_flash_show: {loops: 5}
  fiddler_left_web_solid:
    fiddler_left_web_flash_show: {action: stop}
  fiddler_left_web_off:
    fiddler_left_web_flash_show: {action: stop}

  fiddler_left_bank_flash:
    fiddler_left_bank_flash_show: {loops: 5}
  fiddler_left_bank_solid:
    fiddler_left_bank_flash_show: {action: stop}
  fiddler_left_bank_off:
    fiddler_left_bank_flash_show: {action: stop}

  fiddler_center_web_flash:
    fiddler_center_web_flash_show: {loops: 5}
  fiddler_center_web_solid:
    fiddler_center_web_flash_show: {action: stop}
  fiddler_center_web_off:
    fiddler_center_web_flash_show: {action: stop}

  fiddler_right_bank_flash:
    fiddler_right_bank_flash_show: {loops: 5}
  fiddler_right_bank_solid:
    fiddler_right_bank_flash_show: {action: stop}
  fiddler_right_bank_off:
    fiddler_right_bank_flash_show: {action: stop}

  fiddler_all_notes_off:
    fiddler_left_web_flash_show: {action: stop}
    fiddler_left_bank_flash_show: {action: stop}
    fiddler_center_web_flash_show: {action: stop}
    fiddler_right_bank_flash_show: {action: stop}
