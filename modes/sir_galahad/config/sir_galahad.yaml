#config_version=6

# SirGalahad placeholder villain mode.
# Mode idea: One target lights for a short quickdraw; hit it to build showdown jackpot.

mode:
  start_events: start_mode_sir_galahad
  stop_events:
    - sir_galahad_mode_complete
    - sir_galahad_mode_completed_summary
    - ball_ended
  code: sir_galahad.SirGalahad
  priority: 300

widget_player:
  mode_sir_galahad_started:
    sir_galahad:
      action: play

  sir_galahad_mode_complete:
    sir_galahad:
      action: remove

  mode_sir_galahad_stopping:
    sir_galahad:
      action: remove

event_player:
  # Common playfield hits. Refine these later when the mode design is built out.
  s_pop_left_active: sir_galahad_shot_hit
  s_pop_right_active: sir_galahad_shot_hit
  s_trispinner_opto_active: sir_galahad_shot_hit
  s_web_spinner_active: sir_galahad_shot_hit
  s_star_rollover_active: sir_galahad_shot_hit
  s_upper_target_left_active: sir_galahad_shot_hit
  s_upper_target_center_active: sir_galahad_shot_hit
  s_upper_target_right_active: sir_galahad_shot_hit

  s_left_drops_1_active: sir_galahad_shot_hit
  s_left_drops_2_active: sir_galahad_shot_hit
  s_left_drops_3_active: sir_galahad_shot_hit
  s_right_drops_1_active: sir_galahad_shot_hit
  s_right_drops_2_active: sir_galahad_shot_hit
  s_right_drops_3_active: sir_galahad_shot_hit
  s_right_drops_4_active: sir_galahad_shot_hit
  s_right_drops_5_active: sir_galahad_shot_hit

  s_saucer_1_active:
    - sir_galahad_major_hit
    - clear_saucers
  s_saucer_2_active:
    - sir_galahad_major_hit
    - clear_saucers
  s_saucer_3_active:
    - sir_galahad_major_hit
    - clear_saucers
  s_vuk_switch_active: sir_galahad_major_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  mode_sir_galahad_started:
    - rooftop_diverter_open|500ms
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_sir_galahad_stopping:
    - clear_saucers

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_sir_galahad_started:
    gi: 7050A0

  mode_sir_galahad_stopping:
    gi: E0E0E0

