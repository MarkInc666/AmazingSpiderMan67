#config_version=6

# Igor - Defenses.
# One flashing-green good shot and nearby solid-red bad shots are active.
# Any scored shot selects a different authored set. Five bad shots end the mode,
# or seven with More Jackpots. There is no overall timer or victory condition.

mode:
  start_events: start_mode_igor
  stop_events:
    - ball_will_end
    - bonus_start
    - igor_mode_complete
    - igor_mode_completed_summary
    - ball_ended
  code: igor.Igor
  priority: 300


ball_saves:
  igor_ball_save:
    active_time: (current_player.igor_ball_save_seconds)
    hurry_up_time: 3s
    grace_period: 2s
    enable_events: igor_enable_ball_save
    disable_events:
      - igor_mode_complete
      - mode_igor_stopping


widget_player:
  mode_igor_started:
    igor:
      action: play

  igor_mode_complete:
    igor:
      action: remove

  mode_igor_stopping:
    igor:
      action: remove


event_player:
  # Shot groups. Any target in a drop bank represents that bank.
  s_right_drops_1_active: igor_right_bank_hit
  s_right_drops_2_active: igor_right_bank_hit
  s_right_drops_3_active: igor_right_bank_hit
  s_right_drops_4_active: igor_right_bank_hit
  s_right_drops_5_active: igor_right_bank_hit

  s_left_drops_1_active: igor_left_bank_hit
  s_left_drops_2_active: igor_left_bank_hit
  s_left_drops_3_active: igor_left_bank_hit

  s_pop_left_active: igor_left_pop_hit
  s_pop_right_active: igor_right_pop_hit

  s_web_target_mid_active: igor_center_web_hit
  s_web_target_left_active: igor_left_web_hit

  # "Spinner" in Igor means the main/lower spinner. The upper spinner is neutral.
  s_web_spinner_active: igor_spinner_hit

  # Daily Bugle Mystery is disabled during Igor. The VUK remains a route to the
  # upper playfield and must eject normally.
  s_vuk_switch_active:
    - request_vuk_eject

  # Saucers are neutral and always kick out.
  s_saucer_1_active: clear_saucers
  s_saucer_2_active: clear_saucers
  s_saucer_3_active: clear_saucers

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  igor_startup_complete:
    - disable_daily_bugle_mystery
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_igor_stopping:
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - igor_all_shot_lights_off
    - rooftop_diverter_close
    - clear_saucers


show_player:
  igor_good_right_bank:
    igor_good_right_bank_show: {loops: -1}
  igor_good_right_pop:
    igor_good_right_pop_show: {loops: -1}
  igor_good_spinner:
    igor_good_spinner_show: {loops: -1}
  igor_good_left_bank:
    igor_good_left_bank_show: {loops: -1}

  igor_all_shot_lights_off:
    igor_good_right_bank_show: {action: stop}
    igor_good_right_pop_show: {action: stop}
    igor_good_spinner_show: {action: stop}
    igor_good_left_bank_show: {action: stop}

  mode_igor_stopping:
    igor_good_right_bank_show: {action: stop}
    igor_good_right_pop_show: {action: stop}
    igor_good_spinner_show: {action: stop}
    igor_good_left_bank_show: {action: stop}


light_player:
  mode_igor_started:
    gi: 8080D0

  mode_igor_stopping:
    gi: E0E0E0

  # Clear only the shot indicators Igor owns. Drop-bank indications use their
  # GI sections, never the individual drop inserts.
  igor_all_shot_lights_off:
    l_gi_3bank: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off
    l_mid_web_target: off
    l_left_web_target: off
    l_spinner: off
    l_pop_1_1: off
    l_pop_1_2: off
    l_pop_1_3: off
    l_pop_1_4: off
    l_pop_1_5: off
    l_pop_1_6: off
    l_pop_1_7: off
    l_pop_1_8: off
    l_pop_1_9: off
    l_pop_1_10: off
    l_pop_1_11: off
    l_pop_1_12: off
    l_pop_2_1: off
    l_pop_2_2: off
    l_pop_2_3: off
    l_pop_2_4: off
    l_pop_2_5: off
    l_pop_2_6: off
    l_pop_2_7: off
    l_pop_2_8: off
    l_pop_2_9: off
    l_pop_2_10: off
    l_pop_2_11: off
    l_pop_2_12: off

  # Solid-red defense shots.
  igor_bad_right_bank:
    l_gi_5bank_lower: red
    l_gi_5bank_upper: red
  igor_bad_left_web:
    l_left_web_target: red
  igor_bad_left_bank:
    l_gi_3bank: red
  igor_bad_center_web:
    l_mid_web_target: red
  igor_bad_spinner:
    l_spinner: red
  igor_bad_left_pop:
    l_pop_1_1: red
    l_pop_1_2: red
    l_pop_1_3: red
    l_pop_1_4: red
    l_pop_1_5: red
    l_pop_1_6: red
    l_pop_1_7: red
    l_pop_1_8: red
    l_pop_1_9: red
    l_pop_1_10: red
    l_pop_1_11: red
    l_pop_1_12: red
  igor_bad_right_pop:
    l_pop_2_1: red
    l_pop_2_2: red
    l_pop_2_3: red
    l_pop_2_4: red
    l_pop_2_5: red
    l_pop_2_6: red
    l_pop_2_7: red
    l_pop_2_8: red
    l_pop_2_9: red
    l_pop_2_10: red
    l_pop_2_11: red
    l_pop_2_12: red


shows:
  # Good shots flash green at 250ms per state.
  igor_good_right_bank_show:
    - duration: 250ms
      lights:
        l_gi_5bank_lower: green
        l_gi_5bank_upper: green
    - duration: 250ms
      lights:
        l_gi_5bank_lower: off
        l_gi_5bank_upper: off

  igor_good_right_pop_show:
    - duration: 250ms
      lights:
        l_pop_2_1: green
        l_pop_2_2: green
        l_pop_2_3: green
        l_pop_2_4: green
        l_pop_2_5: green
        l_pop_2_6: green
        l_pop_2_7: green
        l_pop_2_8: green
        l_pop_2_9: green
        l_pop_2_10: green
        l_pop_2_11: green
        l_pop_2_12: green
    - duration: 250ms
      lights:
        l_pop_2_1: off
        l_pop_2_2: off
        l_pop_2_3: off
        l_pop_2_4: off
        l_pop_2_5: off
        l_pop_2_6: off
        l_pop_2_7: off
        l_pop_2_8: off
        l_pop_2_9: off
        l_pop_2_10: off
        l_pop_2_11: off
        l_pop_2_12: off

  igor_good_spinner_show:
    - duration: 250ms
      lights: {l_spinner: green}
    - duration: 250ms
      lights: {l_spinner: off}

  igor_good_left_bank_show:
    - duration: 250ms
      lights: {l_gi_3bank: green}
    - duration: 250ms
      lights: {l_gi_3bank: off}

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
