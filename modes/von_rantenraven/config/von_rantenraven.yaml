#config_version=6

# Baron von Rantenraven — Sky Harbor.
# Saucers open the roof gate. Entering the upper playfield starts a limited-flip
# assault on Sky Harbor by hitting all three upper targets. Remaining flips boost the Super.

mode:
  start_events: start_mode_von_rantenraven
  stop_events:
    - ball_will_end
    - bonus_start
    - von_rantenraven_mode_complete
    - von_rantenraven_mode_completed_summary
    - ball_ended
  code: von_rantenraven.VonRantenraven
  priority: 300

widget_player:
  mode_von_rantenraven_started:
    von_rantenraven:
      action: play

  von_rantenraven_mode_complete:
    von_rantenraven:
      action: remove

  mode_von_rantenraven_stopping:
    von_rantenraven:
      action: remove

event_player:
  mode_von_rantenraven_started:
    - disable_daily_bugle_mystery
    - rooftop_diverter_close
    - clear_saucers_delayed
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

  mode_von_rantenraven_stopping:
    - von_rantenraven_vuk_chase_stop
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state
    - cmd_upper_flippers_enable
    - rooftop_diverter_close
    - clear_saucers_delayed
    - von_rantenraven_all_lights_off
    - von_rantenraven_stop_all_shows

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

show_player:
  von_rantenraven_vuk_chase_start:
    shared_final_vuk_chase:
      loops: -1
      priority: 340
      show_tokens:
        color: "FFD040"
  von_rantenraven_vuk_chase_stop:
    shared_final_vuk_chase:
      action: stop

  von_rantenraven_target_left_needed:
    von_rantenraven_upper_left_pulse:
      loops: -1
  von_rantenraven_target_center_needed:
    von_rantenraven_upper_center_pulse:
      loops: -1
  von_rantenraven_target_right_needed:
    von_rantenraven_upper_right_pulse:
      loops: -1

  von_rantenraven_target_left_solid:
    von_rantenraven_upper_left_pulse:
      action: stop
  von_rantenraven_target_center_solid:
    von_rantenraven_upper_center_pulse:
      action: stop
  von_rantenraven_target_right_solid:
    von_rantenraven_upper_right_pulse:
      action: stop

  von_rantenraven_target_left_off:
    von_rantenraven_upper_left_pulse:
      action: stop
  von_rantenraven_target_center_off:
    von_rantenraven_upper_center_pulse:
      action: stop
  von_rantenraven_target_right_off:
    von_rantenraven_upper_right_pulse:
      action: stop

  von_rantenraven_targets_off:
    von_rantenraven_upper_left_pulse:
      action: stop
    von_rantenraven_upper_center_pulse:
      action: stop
    von_rantenraven_upper_right_pulse:
      action: stop

  von_rantenraven_all_lights_off:
    von_rantenraven_upper_left_pulse:
      action: stop
    von_rantenraven_upper_center_pulse:
      action: stop
    von_rantenraven_upper_right_pulse:
      action: stop

  von_rantenraven_stop_all_shows:
    von_rantenraven_upper_left_pulse:
      action: stop
    von_rantenraven_upper_center_pulse:
      action: stop
    von_rantenraven_upper_right_pulse:
      action: stop

  von_rantenraven_roof_attempt_complete:
    von_rantenraven_roof_super_flash:
      loops: 2

light_player:
  # Full-playfield GI theme while this mode is active.
  mode_von_rantenraven_started:
    gi: FFD040

  mode_von_rantenraven_stopping:
    gi: E0E0E0

  von_rantenraven_saucers_needed:
    l_1: off
    l_2: off
    l_3: off
    l_1_hole_l: red
    l_1_hole_r: red
    l_2_hole_l: red
    l_2_hole_r: red
    l_3_hole_l: red
    l_3_hole_r: red

  von_rantenraven_saucers_off:
    l_1: off
    l_2: off
    l_3: off
    l_1_hole_l: off
    l_1_hole_r: off
    l_2_hole_l: off
    l_2_hole_r: off
    l_3_hole_l: off
    l_3_hole_r: off

  von_rantenraven_target_left_solid:
    l_upper_left: white
  von_rantenraven_target_center_solid:
    l_upper_middle: white
  von_rantenraven_target_right_solid:
    l_upper_right: white

  von_rantenraven_target_left_off:
    l_upper_left: off
  von_rantenraven_target_center_off:
    l_upper_middle: off
  von_rantenraven_target_right_off:
    l_upper_right: off

  von_rantenraven_targets_off:
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off

  von_rantenraven_all_lights_off:
    l_1: off
    l_2: off
    l_3: off
    l_1_hole_l: off
    l_1_hole_r: off
    l_2_hole_l: off
    l_2_hole_r: off
    l_3_hole_l: off
    l_3_hole_r: off
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off

shows:
  von_rantenraven_upper_left_pulse:
    - duration: 250ms
      lights:
        l_upper_left: FFFFFF
    - duration: 250ms
      lights:
        l_upper_left: DDFF66
    - duration: 250ms
      lights:
        l_upper_left: AAFF00
    - duration: 250ms
      lights:
        l_upper_left: DDFF66

  von_rantenraven_upper_center_pulse:
    - duration: 250ms
      lights:
        l_upper_middle: FFFFFF
    - duration: 250ms
      lights:
        l_upper_middle: DDFF66
    - duration: 250ms
      lights:
        l_upper_middle: AAFF00
    - duration: 250ms
      lights:
        l_upper_middle: DDFF66

  von_rantenraven_upper_right_pulse:
    - duration: 250ms
      lights:
        l_upper_right: FFFFFF
    - duration: 250ms
      lights:
        l_upper_right: DDFF66
    - duration: 250ms
      lights:
        l_upper_right: AAFF00
    - duration: 250ms
      lights:
        l_upper_right: DDFF66

  von_rantenraven_roof_super_flash:
    - duration: 250ms
      lights:
        l_upper_left: FFFFFF
        l_upper_middle: FFFFFF
        l_upper_right: FFFFFF
    - duration: 250ms
      lights:
        l_upper_left: off
        l_upper_middle: off
        l_upper_right: off

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
