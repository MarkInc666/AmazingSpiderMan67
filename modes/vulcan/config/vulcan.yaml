#config_version=6

mode:
  start_events: start_mode_vulcan
  stop_events:
  - ball_will_end
  - bonus_start
  - vulcan_mode_complete
  - vulcan_mode_completed_summary
  - ball_ended
  code: vulcan.Vulcan
  priority: 300

variable_player:
  multiball_vulcan_multiball_started:
    multiball_autoplunge_active:
      action: set
      int: 1

  multiball_vulcan_multiball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

  multiball_vulcan_add_a_ball_started:
    multiball_autoplunge_active:
      action: set
      int: 1

  multiball_vulcan_add_a_ball_ended:
    multiball_autoplunge_active:
      action: set
      int: 0

multiballs:
  vulcan_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 10s
    start_events: vulcan_start_multiball
    stop_events:
    - vulcan_stop_multiball

  vulcan_add_a_ball:
    ball_count: 1
    ball_count_type: add
    shoot_again: 10s
    start_events: vulcan_add_a_ball

ball_saves:
  vulcan_safety_net:
    active_time: 20s
    hurry_up_time: 3s
    grace_period: 2s
    balls_to_save: -1
    auto_launch: true
    enable_events: vulcan_enable_safety_net
    disable_events:
    - vulcan_disable_safety_net
    - vulcan_mode_complete
    - mode_vulcan_stopping
    - ball_ending

widget_player:
  mode_vulcan_started:
    vulcan:
      action: play

  mode_vulcan_stopping:
    vulcan:
      action: remove

  vulcan_mode_complete:
    vulcan:
      action: remove

event_player:
  vulcan_setup:
  - clear_saucers
  - reset_drops
  - rooftop_diverter_open|500ms
  - vulcan_right_bank_reloaded
  - vulcan_upper_targets_normal

  mode_vulcan_stopping:
  - vulcan_disable_safety_net
  - rooftop_diverter_close
  - vulcan_clear_all_lights

  multiball_vulcan_multiball_started{current_player.case_file_safety_net_collected == 1}:
  - vulcan_enable_safety_net

  multiball_vulcan_multiball_ended:
  - vulcan_multiball_ended

  s_right_drops_1_active:
  - vulcan_right_drop_1_hit
  s_right_drops_2_active:
  - vulcan_right_drop_2_hit
  s_right_drops_3_active:
  - vulcan_right_drop_3_hit
  s_right_drops_4_active:
  - vulcan_right_drop_4_hit
  s_right_drops_5_active:
  - vulcan_right_drop_5_hit

  s_left_drops_1_active:
  - vulcan_left_drop_1_hit
  s_left_drops_2_active:
  - vulcan_left_drop_2_hit
  s_left_drops_3_active:
  - vulcan_left_drop_3_hit

  # A bank remains down until a ball reaches the upper playfield. The Python
  # handler only resets banks with one or more targets currently down.
  s_upper_entrance_opto_active:
  - vulcan_upper_playfield_entered

  s_upper_exit_left_opto_active:
  - vulcan_upper_left_exit

  # Same early-release pattern used elsewhere for the physical up-post: a
  # both-flipper chord releases the hold immediately.
  s_left_flipper_active{device.switches.s_right_flipper.state == 1}:
  - vulcan_post_hold_cancel
  s_right_flipper_active{device.switches.s_left_flipper.state == 1}:
  - vulcan_post_hold_cancel

  s_upper_target_left_active:
  - vulcan_upper_target_left_hit
  s_upper_target_center_active:
  - vulcan_upper_target_center_hit
  s_upper_target_right_active:
  - vulcan_upper_target_right_hit

  s_saucer_1_active:
  - clear_saucers
  s_saucer_2_active:
  - clear_saucers
  s_saucer_3_active:
  - clear_saucers

coil_player:
  vulcan_shot_assist_drop_1:
    c_right_bank_drop_1:
      action: pulse
  vulcan_shot_assist_drop_2:
    c_right_bank_drop_2:
      action: pulse
  vulcan_shot_assist_drop_3:
    c_right_bank_drop_3:
      action: pulse
  vulcan_shot_assist_drop_4:
    c_right_bank_drop_4:
      action: pulse
  vulcan_shot_assist_drop_5:
    c_right_bank_drop_5:
      action: pulse

show_player:
  vulcan_right_bank_reloaded:
    vulcan_right_drop_1_lit_show:
      action: play
      loops: -1
    vulcan_right_drop_2_lit_show:
      action: play
      loops: -1
    vulcan_right_drop_3_lit_show:
      action: play
      loops: -1
    vulcan_right_drop_4_lit_show:
      action: play
      loops: -1
    vulcan_right_drop_5_lit_show:
      action: play
      loops: -1
    vulcan_right_bank_gi_pulse_show:
      action: play
      loops: -1

  vulcan_right_drop_1_collected:
    vulcan_right_drop_1_lit_show:
      action: stop
  vulcan_right_drop_2_collected:
    vulcan_right_drop_2_lit_show:
      action: stop
  vulcan_right_drop_3_collected:
    vulcan_right_drop_3_lit_show:
      action: stop
  vulcan_right_drop_4_collected:
    vulcan_right_drop_4_lit_show:
      action: stop
  vulcan_right_drop_5_collected:
    vulcan_right_drop_5_lit_show:
      action: stop

  vulcan_right_bank_down:
    vulcan_right_bank_gi_pulse_show:
      action: stop

  vulcan_left_bank_reloaded:
    vulcan_left_bank_jackpot_show:
      action: play
      loops: -1

  vulcan_left_bank_down:
    vulcan_left_bank_jackpot_show:
      action: stop

  vulcan_left_bank_disabled:
    vulcan_left_bank_jackpot_show:
      action: stop

  vulcan_upper_targets_normal:
    vulcan_add_a_ball_ready_show:
      action: stop
    vulcan_upper_targets_normal_show:
      action: play
      loops: -1

  vulcan_add_a_ball_qualified:
    vulcan_upper_targets_normal_show:
      action: stop
    vulcan_add_a_ball_ready_show:
      action: play
      loops: -1

  vulcan_add_a_ball_unqualified:
    vulcan_add_a_ball_ready_show:
      action: stop
    vulcan_upper_targets_normal_show:
      action: play
      loops: -1

  vulcan_clear_all_lights:
    vulcan_right_drop_1_lit_show:
      action: stop
    vulcan_right_drop_2_lit_show:
      action: stop
    vulcan_right_drop_3_lit_show:
      action: stop
    vulcan_right_drop_4_lit_show:
      action: stop
    vulcan_right_drop_5_lit_show:
      action: stop
    vulcan_right_bank_gi_pulse_show:
      action: stop
    vulcan_left_bank_jackpot_show:
      action: stop
    vulcan_upper_targets_normal_show:
      action: stop
    vulcan_add_a_ball_ready_show:
      action: stop

    shared_final_vuk_chase:
      action: stop
  vulcan_setup:
    shared_final_vuk_chase:
      loops: -1
      priority: 340
      show_tokens:
        color: FFD040
light_player:
  vulcan_right_drop_1_collected:
    l_5bank_1: off
  vulcan_right_drop_2_collected:
    l_5bank_2: off
  vulcan_right_drop_3_collected:
    l_5bank_3: off
  vulcan_right_drop_4_collected:
    l_5bank_4: off
  vulcan_right_drop_5_collected:
    l_5bank_5: off

  vulcan_clear_all_lights:
    l_3bankbonus: off
    l_gi_3bank: off
    l_5bank_1: off
    l_5bank_2: off
    l_5bank_3: off
    l_5bank_4: off
    l_5bank_5: off
    l_gi_5bank_lower: off
    l_gi_5bank_upper: off
    l_upper_left: off
    l_upper_middle: off
    l_upper_right: off

shows:
  vulcan_right_drop_1_lit_show:
  - duration: 250ms
    lights:
      l_5bank_1: 10FFA0
  - duration: 250ms
    lights:
      l_5bank_1: off

  vulcan_right_drop_2_lit_show:
  - duration: 250ms
    lights:
      l_5bank_2: 10FFA0
  - duration: 250ms
    lights:
      l_5bank_2: off

  vulcan_right_drop_3_lit_show:
  - duration: 250ms
    lights:
      l_5bank_3: 10FFA0
  - duration: 250ms
    lights:
      l_5bank_3: off

  vulcan_right_drop_4_lit_show:
  - duration: 250ms
    lights:
      l_5bank_4: 10FFA0
  - duration: 250ms
    lights:
      l_5bank_4: off

  vulcan_right_drop_5_lit_show:
  - duration: 250ms
    lights:
      l_5bank_5: 10FFA0
  - duration: 250ms
    lights:
      l_5bank_5: off

  vulcan_right_bank_gi_pulse_show:
  - duration: 500ms
    lights:
      l_gi_5bank_lower: 10C060
      l_gi_5bank_upper: 10C060
  - duration: 500ms
    lights:
      l_gi_5bank_lower: 103018
      l_gi_5bank_upper: 103018

  vulcan_left_bank_jackpot_show:
  - duration: 500ms
    lights:
      l_3bankbonus: 10FFA0
      l_gi_3bank: 10C060
  - duration: 500ms
    lights:
      l_3bankbonus: 103018
      l_gi_3bank: 103018

  vulcan_upper_targets_normal_show:
  - duration: 500ms
    lights:
      l_upper_left: 9020C0
      l_upper_middle: 9020C0
      l_upper_right: 9020C0
  - duration: 500ms
    lights:
      l_upper_left: 240830
      l_upper_middle: 240830
      l_upper_right: 240830

  vulcan_add_a_ball_ready_show:
  - duration: 250ms
    lights:
      l_upper_left: 10FF60
      l_upper_middle: 10FF60
      l_upper_right: 10FF60
  - duration: 250ms
    lights:
      l_upper_left: off
      l_upper_middle: off
      l_upper_right: off

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
