#config_version=6

mode:
  code: villain_progression.VillainProgression
  start_events: ball_started
  stop_events: ball_ending
  priority: 110

# Keep a hardware-test game on the same MPF ball. Only the last live ball is
# protected, so multiball modes may drain normally down to one ball. A saved
# ball is served to the mechanical shooter lane and is never auto-plunged.
ball_saves:
  test_mode_loop_ball_save:
    active_time: 0s
    hurry_up_time: 0s
    grace_period: 0s
    balls_to_save: -1
    only_last_ball: true
    auto_launch: false
    enable_events: test_mode_ball_loop_enable
    disable_events:
      - test_mode_ball_loop_disable
      - mode_villain_progression_stopping

# Readiness owns only the hole lamps; white respects their red lenses.
show_player:
  mini_wizard_ready_saucers_on:
    mini_wizard_saucer_ready_pulse:
      key: mini_wizard_ready_saucers
      loops: -1
      priority: 340
  mini_wizard_ready_saucers_off:
    mini_wizard_saucer_ready_pulse:
      key: mini_wizard_ready_saucers
      action: stop

shows:
  mini_wizard_saucer_ready_pulse:
    - duration: 500ms
      lights:
        l_1_hole_l:
          color: "white"
          fade: 500ms
        l_1_hole_r:
          color: "white"
          fade: 500ms
        l_2_hole_l:
          color: "white"
          fade: 500ms
        l_2_hole_r:
          color: "white"
          fade: 500ms
        l_3_hole_l:
          color: "white"
          fade: 500ms
        l_3_hole_r:
          color: "white"
          fade: 500ms
    - duration: 500ms
      lights:
        l_1_hole_l:
          color: "404040"
          fade: 500ms
        l_1_hole_r:
          color: "404040"
          fade: 500ms
        l_2_hole_l:
          color: "404040"
          fade: 500ms
        l_2_hole_r:
          color: "404040"
          fade: 500ms
        l_3_hole_l:
          color: "404040"
          fade: 500ms
        l_3_hole_r:
          color: "404040"
          fade: 500ms
