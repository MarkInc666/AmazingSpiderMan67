#config_version=6

# Brutus — lure the bodyguard with any right drop, then recover artwork from
# any saucer before time expires or a left drop brings him back.

mode:
  start_events: start_mode_brutus
  stop_events:
    - ball_will_end
    - bonus_start
    - brutus_mode_complete
    - brutus_mode_completed_summary
    - ball_ended
  code: brutus.Brutus
  priority: 300

widget_player:
  mode_brutus_started:
    brutus: {action: play}
  brutus_mode_complete:
    brutus: {action: remove}
  mode_brutus_stopping:
    brutus: {action: remove}

event_player:
  s_right_drops_1_active: brutus_right_drop_1_hit
  s_right_drops_2_active: brutus_right_drop_2_hit
  s_right_drops_3_active: brutus_right_drop_3_hit
  s_right_drops_4_active: brutus_right_drop_4_hit
  s_right_drops_5_active: brutus_right_drop_5_hit

  s_left_drops_1_active: brutus_left_drop_hit
  s_left_drops_2_active: brutus_left_drop_hit
  s_left_drops_3_active: brutus_left_drop_hit

  s_saucer_1_active: brutus_saucer_1_hit
  s_saucer_2_active: brutus_saucer_2_hit
  s_saucer_3_active: brutus_saucer_3_hit

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset

  mode_brutus_stopping:
    - brutus_clear_all
    - clear_saucers_delayed
    - rooftop_diverter_close

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects

show_player:
  mode_brutus_started:
    brutus_mode_gi: {action: play, loops: -1}

  brutus_guarded_lights:
    brutus_right_bank_pulse: {action: play, loops: -1}
    brutus_saucers_guarded: {action: play, loops: -1}

  brutus_saucers_open:
    brutus_left_bank_danger: {action: play, loops: -1}
    brutus_saucers_jackpot: {action: play, loops: -1}

  brutus_artwork_jackpot_collected:
    brutus_jackpot_flash: {action: play, loops: 2}

  brutus_clear_shots:
    brutus_right_bank_pulse: {action: stop}
    brutus_saucers_guarded: {action: stop}
    brutus_left_bank_danger: {action: stop}
    brutus_saucers_jackpot: {action: stop}

  brutus_clear_all:
    brutus_mode_gi: {action: stop}
    brutus_right_bank_pulse: {action: stop}
    brutus_saucers_guarded: {action: stop}
    brutus_left_bank_danger: {action: stop}
    brutus_saucers_jackpot: {action: stop}
    brutus_jackpot_flash: {action: stop}

light_player:
  brutus_clear_all:
    gi: stop
    l_5bank_1: stop
    l_5bank_2: stop
    l_5bank_3: stop
    l_5bank_4: stop
    l_5bank_5: stop
    l_gi_3bank: stop
    l_1_hole_l: stop
    l_1_hole_r: stop
    l_2_hole_l: stop
    l_2_hole_r: stop
    l_3_hole_l: stop
    l_3_hole_r: stop

shows:
  brutus_mode_gi:
    - duration: 1s
      lights: {gi: B87838}

  # The five inserts are physically green.
  brutus_right_bank_pulse:
    - duration: 500ms
      lights:
        l_5bank_1: "00F000"
        l_5bank_2: "00F000"
        l_5bank_3: "00F000"
        l_5bank_4: "00F000"
        l_5bank_5: "00F000"
    - duration: 500ms
      lights:
        l_5bank_1: "003000"
        l_5bank_2: "003000"
        l_5bank_3: "003000"
        l_5bank_4: "003000"
        l_5bank_5: "003000"

  # Dim red behind the red hole lenses means guarded, not collectible.
  brutus_saucers_guarded:
    - duration: 1s
      lights:
        l_1_hole_l: "300000"
        l_1_hole_r: "300000"
        l_2_hole_l: "300000"
        l_2_hole_r: "300000"
        l_3_hole_l: "300000"
        l_3_hole_r: "300000"

  # Left-bank GI is RGB-capable and marks the shot that ends the opening.
  brutus_left_bank_danger:
    - duration: 250ms
      lights: {l_gi_3bank: F03010}
    - duration: 250ms
      lights: {l_gi_3bank: "301000"}

  # Physical saucer-hole lamps indicate that all three saucers are valid jackpots.
  brutus_saucers_jackpot:
    - duration: 250ms
      lights:
        l_1_hole_l: F00000
        l_1_hole_r: F00000
        l_2_hole_l: F00000
        l_2_hole_r: F00000
        l_3_hole_l: F00000
        l_3_hole_r: F00000
    - duration: 250ms
      lights:
        l_1_hole_l: "300000"
        l_1_hole_r: "300000"
        l_2_hole_l: "300000"
        l_2_hole_r: "300000"
        l_3_hole_l: "300000"
        l_3_hole_r: "300000"

  brutus_jackpot_flash:
    - duration: 125ms
      lights:
        l_1_hole_l: F00000
        l_1_hole_r: F00000
        l_2_hole_l: F00000
        l_2_hole_r: F00000
        l_3_hole_l: F00000
        l_3_hole_r: F00000
    - duration: 125ms
      lights:
        l_1_hole_l: "000000"
        l_1_hole_r: "000000"
        l_2_hole_l: "000000"
        l_2_hole_r: "000000"
        l_3_hole_l: "000000"
        l_3_hole_r: "000000"
