        l_pop_2_7: purple
        l_pop_2_8: purple
        l_pop_2_9: purple
        l_pop_2_10: purple
        l_pop_2_11: purple
        l_pop_2_12: purple
    - duration: 400ms
      lights:
        l_pop_2_1: off
        l_pop_2_2: off
        l_pop_2_3: off
        l_pop_2_4: off
        l_pop_2_5: off
        l_pop_2_6: off
        l_pop_2_7: off
        l_pop_2_8: off
        l_pop_2_9: off
        l_pop_2_10: off
        l_pop_2_11: off
        l_pop_2_12: off

  lizard_left_pop_collected_show:
    - duration: 1s
      lights:
        l_pop_1_1: purple
        l_pop_1_2: purple
        l_pop_1_3: purple
        l_pop_1_4: purple
        l_pop_1_5: purple
        l_pop_1_6: purple
        l_pop_1_7: purple
        l_pop_1_8: purple
        l_pop_1_9: purple
        l_pop_1_10: purple
        l_pop_1_11: purple
        l_pop_1_12: purple

