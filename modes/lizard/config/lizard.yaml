#config_version=6

mode:
  start_events: start_mode_lizard
  stop_events:
    - ball_will_end
    - bonus_start
    - lizard_mode_complete
    - lizard_mode_completed_summary
    - ball_ended
  code: lizard.Lizard
  priority: 300


widget_player:
  mode_lizard_started:
    lizard:
      action: play

  lizard_mode_complete:
    lizard:
      action: remove

  mode_lizard_stopping:
    lizard:
      action: remove

random_event_player:
  lizard_serum_collected:
    - lizard_serum_collected_1
    - lizard_serum_collected_2
    - lizard_serum_collected_3

sound_player:
  play_mode_jackpot:
    jackpot_2:
      action: play
      bus: effects
  play_mode_super_jackpot:
    jackpot_2:
      action: play
      bus: effects
  lizard_serum_collected_1:
    sm_i_have_to_hurry:
      action: play
      bus: voice

  lizard_serum_collected_2:
    sm_I_need_to_get_this_to_the_lizard_man:
      action: play
      bus: voice

  lizard_serum_collected_3:
    sm_I_need_to_deliver:
      action: play
      bus: voice

  lizard_light_serum_location{current_player.lizard_deliveries == 0}:
    sm_i_need_to_get_the_antidote:
      action: play
      bus: voice

  lizard_light_serum_location{current_player.lizard_deliveries > 0}:
    sm_i_need_to_get_more_antidote:
      action: play
      bus: voice


event_player:
  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  drop_target_bank_dt_bank_right_down:
    - drop_target_bank_dt_bank_right_reset

  s_saucer_1_active:
    - clear_saucers

  s_saucer_2_active:
    - clear_saucers

  s_saucer_3_active:
    - clear_saucers


timers:

  lizard_delivery_timer:
    start_value: 16
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: lizard_delivery_timer_start
        action: restart
      - event: lizard_delivery_timer_stop
        action: stop
      - event: mode_lizard_stopping
        action: stop

  lizard_delivery_timer_more_time:
    start_value: 20
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: lizard_delivery_timer_more_time_start
        action: restart
      - event: lizard_delivery_timer_more_time_stop
        action: stop
      - event: mode_lizard_stopping
        action: stop

show_player:

  lizard_light_serum_location:
    lizard_gi_show:
      loops: -1
    lizard_left_web_show:
      action: stop

  lizard_serum_collected:
    lizard_left_pop_available_show:
      action: stop
    lizard_right_pop_available_show:
      action: stop
    lizard_left_pop_collected_show:
      action: stop
    lizard_right_pop_collected_show:
      action: stop
    lizard_gi_show:
      action: stop
    lizard_gi_hurry_show:
      loops: -1

  lizard_pop_left_available:
    lizard_left_pop_collected_show:
      action: stop
    lizard_left_pop_available_show:
      loops: -1
      priority: 340

  lizard_pop_right_available:
    lizard_right_pop_collected_show:
      action: stop
    lizard_right_pop_available_show:
      loops: -1
      priority: 340

  lizard_pop_left_collected:
    lizard_left_pop_available_show:
      action: stop
    lizard_left_pop_collected_show:
      loops: -1
      priority: 340

  lizard_pop_right_collected:
    lizard_right_pop_available_show:
      action: stop
    lizard_right_pop_collected_show:
      loops: -1
      priority: 340

  lizard_star_10x_available:
    lizard_star_10x_armed_show:
      action: stop
    lizard_star_10x_available_show:
      loops: -1

  lizard_star_10x_armed:
    lizard_star_10x_available_show:
      action: stop
    lizard_star_10x_armed_show:
      loops: -1

  lizard_star_10x_stop:
    lizard_star_10x_available_show:
      action: stop
    lizard_star_10x_armed_show:
      action: stop

  lizard_light_left_web:
    lizard_left_web_show:
      loops: -1

  lizard_serum_delivered:
    lizard_left_web_show:
      action: stop
    lizard_star_10x_available_show:
      action: stop
    lizard_star_10x_armed_show:
      action: stop
    lizard_gi_show:
      action: stop
    lizard_gi_hurry_show:
      action: stop
    lizard_delivery_success_show:
      loops: 0

  lizard_serum_expired_show:
    lizard_left_web_show:
      action: stop
    lizard_star_10x_available_show:
      action: stop
    lizard_star_10x_armed_show:
      action: stop
    lizard_gi_show:
      action: stop
    lizard_gi_hurry_show:
      action: stop
    lizard_serum_expired_lights:
      loops: 0

  lizard_mode_complete:
    lizard_left_pop_available_show:
      action: stop
    lizard_right_pop_available_show:
      action: stop
    lizard_left_pop_collected_show:
      action: stop
    lizard_right_pop_collected_show:
      action: stop
    lizard_star_10x_available_show:
      action: stop
    lizard_star_10x_armed_show:
      action: stop
    lizard_left_web_show:
      action: stop
    lizard_complete_show:
      loops: 1
    lizard_gi_show:
      action: stop
    lizard_gi_hurry_show:
      action: stop

  lizard_a_complete:
    lizard_a_available_show:
      action: stop
    lizard_a_collected_show:
      loops: -1

  lizard_b_complete:
    lizard_b_available_show:
      action: stop
    lizard_b_collected_show:
      loops: -1

  lizard_ab_complete:
    lizard_a_collected_show:
      loops: -1
    lizard_b_collected_show:
      loops: -1

  lizard_ab_timer_restarted:
    lizard_ab_gi_show:
      loops: 2

  lizard_clear_ab:
    lizard_a_collected_show:
      action: stop
    lizard_b_collected_show:
      action: stop
    lizard_a_available_show:
      loops: -1
    lizard_b_available_show:
      loops: -1


