      lights:
        l_left_web_target: green
    - duration: 500ms
      lights:
        l_left_web_target: white
    - duration: 500ms
      lights:
        l_left_web_target: green

  lizard_serum_expired_lights:
    - duration: 2s
      lights:
        gi:
          color: off
          fade: 2s

  lizard_complete_show:
    - duration: 200ms
      lights:
        gi: green
    - duration: 200ms
      lights:
