#config_version=6

# Dr. Magneto - cross-feed A/B rollover and pop-bumper circuits.

mode:
  start_events: start_mode_dr_magneto
  stop_events:
    - dr_magneto_mode_complete
    - dr_magneto_mode_completed_summary
    - ball_ended
  code: dr_magneto.DrMagneto
  priority: 300

widget_player:
  mode_dr_magneto_started:
    dr_magneto:
      action: play
  dr_magneto_mode_complete:
    dr_magneto:
      action: remove
  mode_dr_magneto_stopping:
    dr_magneto:
      action: remove

event_player:
  # Left-side qualifiers feed the opposite-side A rollover (on the right).
  s_sling_l_active: dr_magneto_left_qualifier_hit
  s_inlane_l_active: dr_magneto_left_qualifier_hit

  # Right-side qualifiers feed the opposite-side B rollover (on the left).
  s_sling_r_active: dr_magneto_right_qualifier_hit
  s_inlane_r_active: dr_magneto_right_qualifier_hit

  # Middle rollovers: A is the right-hand switch, B is the left-hand switch.
  s_inlane_m_r_active: dr_magneto_a_rollover_hit
  s_inlane_m_l_active: dr_magneto_b_rollover_hit

  s_pop_left_active: dr_magneto_left_pop_hit
  s_pop_right_active: dr_magneto_right_pop_hit
  s_web_target_mid_active: dr_magneto_center_web_hit
  s_star_rollover_active: dr_magneto_star_hit

  # Dr. Magneto does not use the saucers.
  s_saucer_1_active: clear_saucers_delayed
  s_saucer_2_active: clear_saucers_delayed
  s_saucer_3_active: clear_saucers_delayed

  mode_dr_magneto_started:
    - rooftop_diverter_close
    - clear_saucers_delayed
  mode_dr_magneto_stopping:
    - dr_magneto_clear_all
    - rooftop_diverter_close
    - clear_saucers_delayed

show_player:
  dr_magneto_a_lit:
    dr_magneto_a_pulse:
      loops: -1
      priority: 330
  dr_magneto_a_collected:
    dr_magneto_a_pulse:
      action: stop
  dr_magneto_a_expired:
    dr_magneto_a_pulse:
      action: stop

  dr_magneto_b_lit:
    dr_magneto_b_pulse:
      loops: -1
      priority: 330
  dr_magneto_b_collected:
    dr_magneto_b_pulse:
      action: stop
  dr_magneto_b_expired:
    dr_magneto_b_pulse:
      action: stop

  dr_magneto_left_pop_flashing:
    dr_magneto_left_pop_pulse:
      loops: -1
      priority: 330
  dr_magneto_left_pop_expired:
    dr_magneto_left_pop_pulse:
      action: stop
  dr_magneto_left_pop_solid:
    dr_magneto_left_pop_pulse:
      action: stop
    dr_magneto_left_pop_solid:
      loops: -1
      priority: 330

  dr_magneto_right_pop_flashing:
    dr_magneto_right_pop_pulse:
      loops: -1
      priority: 330
  dr_magneto_right_pop_expired:
    dr_magneto_right_pop_pulse:
      action: stop
  dr_magneto_right_pop_solid:
    dr_magneto_right_pop_pulse:
      action: stop
    dr_magneto_right_pop_solid:
      loops: -1
      priority: 330

  dr_magneto_super_ready:
    dr_magneto_center_web_pulse:
      loops: -1
      priority: 340
  dr_magneto_super_collected:
    dr_magneto_center_web_pulse:
      action: stop
  dr_magneto_super_expired:
    dr_magneto_center_web_pulse:
      action: stop

  dr_magneto_star_lit:
    dr_magneto_star_pulse:
      loops: -1
      priority: 350
  dr_magneto_star_collected:
    dr_magneto_star_pulse:
      action: stop
  dr_magneto_star_expired:
    dr_magneto_star_pulse:
      action: stop

  dr_magneto_clear_all:
    dr_magneto_a_pulse: {action: stop}
    dr_magneto_b_pulse: {action: stop}
    dr_magneto_left_pop_pulse: {action: stop}
    dr_magneto_left_pop_solid: {action: stop}
    dr_magneto_right_pop_pulse: {action: stop}
    dr_magneto_right_pop_solid: {action: stop}
    dr_magneto_center_web_pulse: {action: stop}
    dr_magneto_star_pulse: {action: stop}

light_player:
  mode_dr_magneto_started:
    gi: 4060FF
  mode_dr_magneto_stopping:
    gi: E0E0E0

shows:
  dr_magneto_a_pulse:
    - duration: 300ms
      lights:
        l_right_a: yellow
    - duration: 300ms
      lights:
        l_right_a: off

  dr_magneto_b_pulse:
    - duration: 300ms
      lights:
        l_left_b: yellow
    - duration: 300ms
      lights:
        l_left_b: off

  dr_magneto_left_pop_pulse:
    - duration: 300ms
      lights:
        l_pop_1_1: 4060FF
        l_pop_1_2: 4060FF
        l_pop_1_3: 4060FF
        l_pop_1_4: 4060FF
        l_pop_1_5: 4060FF
        l_pop_1_6: 4060FF
        l_pop_1_7: 4060FF
        l_pop_1_8: 4060FF
        l_pop_1_9: 4060FF
        l_pop_1_10: 4060FF
        l_pop_1_11: 4060FF
        l_pop_1_12: 4060FF
    - duration: 300ms
      lights:
        l_pop_1_1: off
        l_pop_1_2: off
        l_pop_1_3: off
        l_pop_1_4: off
        l_pop_1_5: off
        l_pop_1_6: off
        l_pop_1_7: off
        l_pop_1_8: off
        l_pop_1_9: off
        l_pop_1_10: off
        l_pop_1_11: off
        l_pop_1_12: off

  dr_magneto_left_pop_solid:
    - duration: 1s
      lights:
        l_pop_1_1: 4060FF
        l_pop_1_2: 4060FF
        l_pop_1_3: 4060FF
        l_pop_1_4: 4060FF
        l_pop_1_5: 4060FF
        l_pop_1_6: 4060FF
        l_pop_1_7: 4060FF
        l_pop_1_8: 4060FF
        l_pop_1_9: 4060FF
        l_pop_1_10: 4060FF
        l_pop_1_11: 4060FF
        l_pop_1_12: 4060FF

  dr_magneto_right_pop_pulse:
    - duration: 300ms
      lights:
        l_pop_2_1: 4060FF
        l_pop_2_2: 4060FF
        l_pop_2_3: 4060FF
        l_pop_2_4: 4060FF
        l_pop_2_5: 4060FF
        l_pop_2_6: 4060FF
        l_pop_2_7: 4060FF
        l_pop_2_8: 4060FF
        l_pop_2_9: 4060FF
        l_pop_2_10: 4060FF
        l_pop_2_11: 4060FF
        l_pop_2_12: 4060FF
    - duration: 300ms
      lights:
        l_pop_2_1: off
        l_pop_2_2: off
        l_pop_2_3: off
        l_pop_2_4: off
        l_pop_2_5: off
        l_pop_2_6: off
        l_pop_2_7: off
        l_pop_2_8: off
        l_pop_2_9: off
        l_pop_2_10: off
        l_pop_2_11: off
        l_pop_2_12: off

  dr_magneto_right_pop_solid:
    - duration: 1s
      lights:
        l_pop_2_1: 4060FF
        l_pop_2_2: 4060FF
        l_pop_2_3: 4060FF
        l_pop_2_4: 4060FF
        l_pop_2_5: 4060FF
        l_pop_2_6: 4060FF
        l_pop_2_7: 4060FF
        l_pop_2_8: 4060FF
        l_pop_2_9: 4060FF
        l_pop_2_10: 4060FF
        l_pop_2_11: 4060FF
        l_pop_2_12: 4060FF

  dr_magneto_center_web_pulse:
    - duration: 200ms
      lights:
        l_mid_web_target: 4060FF
    - duration: 200ms
      lights:
        l_mid_web_target: off

  dr_magneto_star_pulse:
    - duration: 200ms
      lights:
        l_star: red
    - duration: 200ms
      lights:
        l_star: off
