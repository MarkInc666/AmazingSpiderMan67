#config_version=6

mode_settings:
  selectable_items:
    - title
    - last_scores_1p{machine.player1_score and not machine.player2_score}
    - last_scores_2p{machine.player2_score and not machine.player3_score}
    - last_scores_3p{machine.player3_score and not machine.player4_score}
    - last_scores_4p{machine.player4_score}
    - high_score_1
    - high_score_2
    - high_score_3
    - title
    - credits
    - mpf_logo

  next_item_events: s_right_flipper_active, timer_attract_carousel_timer_complete
  previous_item_events: s_left_flipper_active


timers:
  attract_carousel_timer:
    end_value: 1
    tick_interval: 5s
    start_running: true
    control_events:
      - event: carousel_item_highlighted
        action: restart
      - event: flipper_cradle
        action: stop
      - event: flipper_cradle_release
        action: restart    


# Physical-hardware test harness backdoor. Attract has no player, so the
# sequence arms a non-persistent machine variable. Press START normally after
# the code; the new game will enter TEST MODE SELECT instead of progression.
sequence_shots:
  test_mode_harness_code:
    switch_sequence:
      - s_left_flipper
      - s_left_flipper
      - s_right_flipper
      - s_right_flipper
      - s_left_flipper
      - s_right_flipper
      - s_left_flipper
      - s_right_flipper
    sequence_timeout: 5s
    allow_multiple_active: false

  test_mode_harness_off_code:
    switch_sequence:
      - s_right_flipper
      - s_right_flipper
      - s_left_flipper
      - s_left_flipper
      - s_right_flipper
      - s_left_flipper
      - s_right_flipper
      - s_left_flipper
    sequence_timeout: 5s
    allow_multiple_active: false

variable_player:
  test_mode_harness_code_hit:
    test_mode_session_requested:
      int: 1
      action: set_machine

  test_mode_harness_off_code_hit:
    test_mode_session_requested:
      int: 0
      action: set_machine
    chapter_progression_test_unlock_all:
      int: 0
      action: set_machine


slide_player:
  mode_attract_started: attract

  mode_attract_stopping:
    attract:
      action: remove


sound_player:
  test_mode_harness_code_hit:
    zip_out:
      action: play
      bus: effects

  test_mode_harness_off_code_hit:
    hb_bonk_1:
      action: play
      bus: effects

  mode_attract_started: 
    maintheme:
      action: play
      bus: music
      loops: 1


show_player:
  mode_attract_started: 
    attract_show:
      show: testlights
      speed: 1
