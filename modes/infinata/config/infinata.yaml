#config_version=6

mode:
  start_events: start_mode_infinata
  stop_events:
    - infinata_mode_complete
    - ball_ended
  code: infinata.Infinata
  priority: 300

widget_player:
  mode_infinata_started:
    infinata:
      action: play
  infinata_mode_complete:
    infinata:
      action: remove
  mode_infinata_stopping:
    infinata:
      action: remove

event_player:
  s_pop_left_active:
    infinata_pops_hit:
      switch: pop_left
  s_pop_right_active:
    infinata_pops_hit:
      switch: pop_right

  s_left_drops_1_active:
    infinata_left_drops_hit:
      switch: left_1
  s_left_drops_2_active:
    infinata_left_drops_hit:
      switch: left_2
  s_left_drops_3_active:
    infinata_left_drops_hit:
      switch: left_3

  s_right_drops_1_active:
    infinata_right_drops_hit:
      switch: right_1
  s_right_drops_2_active:
    infinata_right_drops_hit:
      switch: right_2
  s_right_drops_3_active:
    infinata_right_drops_hit:
      switch: right_3
  s_right_drops_4_active:
    infinata_right_drops_hit:
      switch: right_4
  s_right_drops_5_active:
    infinata_right_drops_hit:
      switch: right_5

  s_web_target_left_active:
    infinata_webs_hit:
      switch: web_left
  s_web_target_mid_active:
    infinata_webs_hit:
      switch: web_mid

  s_upper_target_left_active:
    infinata_upper_targets_hit:
      switch: upper_left
  s_upper_target_center_active:
    infinata_upper_targets_hit:
      switch: upper_center
  s_upper_target_right_active:
    infinata_upper_targets_hit:
      switch: upper_right

  s_saucer_1_active:
    - infinata_saucer_hit
    - delayed_kickout_saucer_1
  s_saucer_2_active:
    - infinata_saucer_hit
    - delayed_kickout_saucer_2
  s_saucer_3_active:
    - infinata_saucer_hit
    - delayed_kickout_saucer_3

  # Daily Bugle Mystery is disabled during Infinata, so the mode must
  # respond to VUK balls itself and kick them to the upper playfield.
  s_vuk_switch_active: infinata_vuk_hit

  mode_infinata_started:
    - disable_daily_bugle_mystery
    - clear_saucers_delayed
    - reset_drops
  mode_infinata_stopping:
    - clear_saucers_delayed
    - reset_drops
    - enable_daily_bugle_mystery
    - daily_bugle_restore_state

  drop_target_bank_dt_bank_left_down: drop_target_bank_dt_bank_left_reset
  drop_target_bank_dt_bank_right_down: drop_target_bank_dt_bank_right_reset

show_player:
  infinata_light_pops:
    infinata_pop_left_flash_show:
      loops: -1
    infinata_pop_right_flash_show:
      loops: -1
  infinata_pop_left_complete:
    infinata_pop_left_flash_show:
      action: stop
  infinata_pop_right_complete:
    infinata_pop_right_flash_show:
      action: stop

  infinata_light_webs:
    infinata_web_left_flash_show:
      loops: -1
    infinata_web_mid_flash_show:
      loops: -1
  infinata_web_left_complete:
    infinata_web_left_flash_show:
      action: stop
  infinata_web_mid_complete:
    infinata_web_mid_flash_show:
      action: stop

  infinata_light_upper_targets:
    infinata_upper_targets_flash_show:
      loops: -1

  infinata_light_left_drops:
    infinata_left_bank_flash_show:
      loops: -1

  infinata_light_right_drops:
    infinata_right_bank_flash_show:
      loops: -1

  infinata_clear_area_lights:
    infinata_pop_left_flash_show:
      action: stop
    infinata_pop_right_flash_show:
      action: stop
    infinata_web_left_flash_show:
      action: stop
    infinata_web_mid_flash_show:
      action: stop
    infinata_upper_targets_flash_show:
      action: stop
    infinata_left_bank_flash_show:
      action: stop
    infinata_right_bank_flash_show:
      action: stop

  infinata_clear_lights:
    infinata_pop_left_flash_show:
      action: stop
    infinata_pop_right_flash_show:
      action: stop
    infinata_web_left_flash_show:
      action: stop
    infinata_web_mid_flash_show:
      action: stop
    infinata_upper_targets_flash_show:
      action: stop
    infinata_left_bank_flash_show:
      action: stop
    infinata_right_bank_flash_show:
      action: stop

  mode_infinata_stopping:
    infinata_pop_left_flash_show:
      action: stop
    infinata_pop_right_flash_show:
      action: stop
    infinata_web_left_flash_show:
      action: stop
    infinata_web_mid_flash_show:
      action: stop
    infinata_upper_targets_flash_show:
      action: stop
    infinata_left_bank_flash_show:
      action: stop
    infinata_right_bank_flash_show:
      action: stop

