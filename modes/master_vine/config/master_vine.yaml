#config_version=6

# Master Vine - Vine Invasion. Upper-spinner pulses program unique lower shots.
# Programmed shots pulse; collected shots remain solid at lower intensity.

mode:
  start_events: start_mode_master_vine
  stop_events:
    - ball_will_end
    - bonus_start
    - master_vine_mode_complete
    - master_vine_mode_completed_summary
    - ball_ended
  code: master_vine.MasterVine
  priority: 300

widget_player:
  mode_master_vine_started:
    master_vine:
      action: play
  master_vine_mode_complete:
    master_vine:
      action: remove
  mode_master_vine_stopping:
    master_vine:
      action: remove

event_player:
  s_upper_entrance_opto_active: master_vine_upper_entrance
  s_trispinner_opto_active: master_vine_upper_spinner_hit
  s_web_target_left_active: master_vine_left_web_hit
  s_web_target_mid_active: master_vine_center_web_hit
  s_sling_l_active: master_vine_left_sling_hit
  s_sling_r_active: master_vine_right_sling_hit
  s_pop_left_active: master_vine_left_pop_hit
  s_pop_right_active: master_vine_right_pop_hit

  s_saucer_1_active:
    - master_vine_saucer_1_hit
    - clear_saucers_delayed
  s_saucer_2_active:
    - master_vine_saucer_2_hit
    - clear_saucers_delayed
  s_saucer_3_active:
    - master_vine_saucer_3_hit
    - clear_saucers_delayed

  s_left_drops_1_active: master_vine_left_drop_1_hit
  s_left_drops_2_active: master_vine_left_drop_2_hit
  s_left_drops_3_active: master_vine_left_drop_3_hit
  s_right_drops_1_active: master_vine_right_drop_1_hit
  s_right_drops_2_active: master_vine_right_drop_2_hit
  s_right_drops_3_active: master_vine_right_drop_3_hit
  s_right_drops_4_active: master_vine_right_drop_4_hit
  s_right_drops_5_active: master_vine_right_drop_5_hit

  s_inlane_a_active: master_vine_a_hit
  s_inlane_b_active: master_vine_b_hit
  s_inlane_m_r_active: master_vine_middle_a_hit
  s_inlane_m_l_active: master_vine_middle_b_hit
  s_star_rollover_active: master_vine_star_hit
  s_vuk_switch_active:
    - master_vine_vuk_entered
    - request_vuk_eject

  rooftop_diverter_open: master_vine_gate_open_lighting

  master_vine_reset_banks:
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
  mode_master_vine_stopping:
    - clear_saucers_delayed
    - master_vine_all_lights_off

show_player:
  master_vine_gate_open_lighting:
    shared_final_vuk_chase:
      loops: -1
      priority: 340
      show_tokens: {color: "FFD040"}
  master_vine_vuk_entered:
    shared_final_vuk_chase:
      action: stop
    master_vine_upper_spinner_pulse:
      loops: -1
      priority: 320
  master_vine_attempt_started:
    shared_final_vuk_chase:
      action: stop
    master_vine_upper_spinner_pulse:
      loops: -1
      priority: 320
  master_vine_attempt_expired:
    master_vine_upper_spinner_pulse:
      action: stop

  master_vine_shots_reset: &vine_stop_shot_shows
    master_vine_left_web_pulse: {action: stop}
    master_vine_center_web_pulse: {action: stop}
    master_vine_left_sling_pulse: {action: stop}
    master_vine_right_sling_pulse: {action: stop}
    master_vine_left_pop_pulse: {action: stop}
    master_vine_right_pop_pulse: {action: stop}
    master_vine_saucer_1_pulse: {action: stop}
    master_vine_saucer_2_pulse: {action: stop}
    master_vine_saucer_3_pulse: {action: stop}
    master_vine_left_bank_pulse: {action: stop}
    master_vine_right_drop_1_pulse: {action: stop}
    master_vine_right_drop_2_pulse: {action: stop}
    master_vine_right_drop_3_pulse: {action: stop}
    master_vine_right_drop_4_pulse: {action: stop}
    master_vine_right_drop_5_pulse: {action: stop}
    master_vine_a_pulse: {action: stop}
    master_vine_b_pulse: {action: stop}
    master_vine_middle_a_pulse: {action: stop}
    master_vine_middle_b_pulse: {action: stop}
    master_vine_star_pulse: {action: stop}

  master_vine_all_lights_off:
    <<: *vine_stop_shot_shows
    shared_final_vuk_chase: {action: stop}
    master_vine_upper_spinner_pulse: {action: stop}

  master_vine_left_web_lit:
    master_vine_left_web_pulse: &vine_pulse {loops: -1, priority: 330}
  master_vine_left_web_collected:
    master_vine_left_web_pulse: {action: stop}
  master_vine_center_web_lit:
    master_vine_center_web_pulse: *vine_pulse
  master_vine_center_web_collected:
    master_vine_center_web_pulse: {action: stop}
  master_vine_left_sling_lit:
