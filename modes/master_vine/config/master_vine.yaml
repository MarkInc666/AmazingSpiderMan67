  master_vine_saucer_2_lit:
    master_vine_saucer_2_pulse: *vine_pulse
  master_vine_saucer_2_collected:
    master_vine_saucer_2_pulse: {action: stop}
  master_vine_saucer_3_lit:
    master_vine_saucer_3_pulse: *vine_pulse
  master_vine_saucer_3_collected:
    master_vine_saucer_3_pulse: {action: stop}
  master_vine_left_bank_lit:
    master_vine_left_bank_pulse: *vine_pulse
  master_vine_left_bank_collected:
    master_vine_left_bank_pulse: {action: stop}
  master_vine_left_bank_off:
    master_vine_left_bank_pulse: {action: stop}
  master_vine_right_drop_1_lit:
