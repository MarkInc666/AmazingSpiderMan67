  master_vine_left_pop_collected:
    master_vine_left_pop_pulse: {action: stop}
  master_vine_right_pop_lit:
    master_vine_right_pop_pulse: *vine_pulse
  master_vine_right_pop_collected:
    master_vine_right_pop_pulse: {action: stop}
  master_vine_saucer_1_lit:
