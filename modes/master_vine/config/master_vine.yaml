  master_vine_right_drop_5_collected:
    master_vine_right_drop_5_pulse: {action: stop}
  master_vine_a_lit:
    master_vine_a_pulse: *vine_pulse
  master_vine_a_collected:
    master_vine_a_pulse: {action: stop}
  master_vine_b_lit:
    master_vine_b_pulse: *vine_pulse
  master_vine_b_collected:
