#config_version=6

# Skymaster placeholder. The former limited-flip roof-target rules now belong
# to Baron von Rantenraven / Sky Harbor. Skymaster needs a distinct redesign.

mode:
  start_events: start_mode_skymaster
  stop_events:
    - skymaster_mode_complete
    - skymaster_mode_completed_summary
    - ball_ended
  code: skymaster.Skymaster
  priority: 300

widget_player:
  mode_skymaster_started:
    skymaster:
      action: play
  skymaster_mode_complete:
    skymaster:
      action: remove
  mode_skymaster_stopping:
    skymaster:
      action: remove

event_player:
  s_pop_left_active: skymaster_shot_hit
  s_pop_right_active: skymaster_shot_hit
  s_trispinner_opto_active: skymaster_shot_hit
  s_web_spinner_active: skymaster_shot_hit
  s_star_rollover_active: skymaster_shot_hit
  s_upper_target_left_active: skymaster_shot_hit
  s_upper_target_center_active: skymaster_shot_hit
  s_upper_target_right_active: skymaster_shot_hit
  s_saucer_1_active:
    - skymaster_major_hit
    - clear_saucers_delayed
  s_saucer_2_active:
    - skymaster_major_hit
    - clear_saucers_delayed
  s_saucer_3_active:
    - skymaster_major_hit
    - clear_saucers_delayed
  mode_skymaster_started:
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset

light_player:
  mode_skymaster_started:
    gi: B8FF20
  mode_skymaster_stopping:
    gi: E0E0E0
