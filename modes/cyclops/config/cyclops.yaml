#config_version=6

# Cyclops - Eye of Doom
# Limited-flips mode: drops/rubbers rebuild flips and center web collects Eye.
# Banks reset immediately. More Jackpots adds a timed second Eye.

mode:
  start_events: start_mode_cyclops
  stop_events:
    - cyclops_mode_complete
    - cyclops_mode_completed_summary
    - ball_ended
  code: cyclops.Cyclops
  priority: 300


widget_player:
  mode_cyclops_started:
    cyclops:
      action: play

  cyclops_mode_complete:
    cyclops:
      action: remove

  mode_cyclops_stopping:
    cyclops:
      action: remove


ball_saves:
  cyclops_safety_net:
    active_time: 10s
    hurry_up_time: 2s
    grace_period: 1s
    balls_to_save: 1
    auto_launch: true
    enable_events: cyclops_enable_safety_net
    disable_events:
      - cyclops_disable_safety_net
      - cyclops_mode_complete
      - mode_cyclops_stopping
      - ball_ending


event_player:
  # The center web target is the Cyclops Eye.
  s_web_target_mid_active:
    - cyclops_eye_hit

  # Every drop adds 3 flips. Bank-down events immediately reset the banks.
  s_left_drops_1_active:
    - cyclops_left_drop_1_hit
  s_left_drops_2_active:
    - cyclops_left_drop_2_hit
  s_left_drops_3_active:
    - cyclops_left_drop_3_hit

  s_right_drops_1_active:
    - cyclops_right_drop_1_hit
  s_right_drops_2_active:
    - cyclops_right_drop_2_hit
  s_right_drops_3_active:
    - cyclops_right_drop_3_hit
  s_right_drops_4_active:
    - cyclops_right_drop_4_hit
  s_right_drops_5_active:
    - cyclops_right_drop_5_hit

  drop_target_bank_dt_bank_left_down:
    - drop_target_bank_dt_bank_left_reset

  drop_target_bank_dt_bank_right_down:
    - cyclops_right_bank_down
    - drop_target_bank_dt_bank_right_reset

  # Every rubber adds 1 flip, including during the second-Eye round.
  s_left_drops_rubber_active: cyclops_rubber_hit
  s_left_drops_top_left_rubber_active: cyclops_rubber_hit
  s_left_drops_top_right_rubber_active: cyclops_rubber_hit
  s_right_drops_rubber_active: cyclops_rubber_hit
  s_right_drops_top_rubber_active: cyclops_rubber_hit
  s_mid_right_rubber_active: cyclops_rubber_hit

  # Cyclops does not use saucers during gameplay; kick out any ball there.
  s_saucer_1_active: clear_saucers
  s_saucer_2_active: clear_saucers
  s_saucer_3_active: clear_saucers

  mode_cyclops_started:
    - clear_saucers
    - drop_target_bank_dt_bank_left_reset
    - drop_target_bank_dt_bank_right_reset
    - cyclops_bank_gi_start

  mode_cyclops_stopping:
    - clear_saucers
    - cyclops_disable_safety_net
    - cyclops_eye_unlit
    - cyclops_bank_gi_stop


coil_player:
  cyclops_shot_assist_drop_1:
    c_right_bank_drop_1:
      action: pulse
  cyclops_shot_assist_drop_2:
    c_right_bank_drop_2:
      action: pulse
  cyclops_shot_assist_drop_3:
    c_right_bank_drop_3:
      action: pulse
  cyclops_shot_assist_drop_4:
    c_right_bank_drop_4:
      action: pulse
  cyclops_shot_assist_drop_5:
    c_right_bank_drop_5:
      action: pulse


show_player:
  cyclops_eye_lit:
    cyclops_eye_chase_show:
      action: play
      loops: -1

  cyclops_eye_unlit:
    cyclops_eye_chase_show:
      action: stop

  cyclops_bank_gi_start:
    cyclops_bank_gi_pulse_show:
      action: play
      loops: -1

  cyclops_bank_gi_stop:
    cyclops_bank_gi_pulse_show:
      action: stop

  cyclops_mode_complete:
    cyclops_eye_chase_show:
      action: stop
    cyclops_bank_gi_pulse_show:
      action: stop

  mode_cyclops_stopping:
    cyclops_eye_chase_show:
      action: stop
    cyclops_bank_gi_pulse_show:
      action: stop


shows:
  # Bottom-to-top approach path from the Monitor layout, ending at the Eye.
  cyclops_eye_chase_show:
    - duration: 250ms
      lights:
        l_mid_multibonus: white
        l_advance_multiplier: off
        l_special: off
        l_mid_web_target: off
    - duration: 250ms
      lights:
        l_mid_multibonus: off
        l_advance_multiplier: white
        l_special: off
        l_mid_web_target: off
    - duration: 250ms
      lights:
        l_mid_multibonus: off
        l_advance_multiplier: off
        l_special: white
        l_mid_web_target: off
    - duration: 250ms
      lights:
        l_mid_multibonus: off
        l_advance_multiplier: off
        l_special: off
        l_mid_web_target: white

  cyclops_bank_gi_pulse_show:
    - duration: 500ms
      lights:
        l_gi_3bank: 9020C0
        l_gi_5bank_lower: 9020C0
        l_gi_5bank_upper: 9020C0
    - duration: 500ms
      lights:
        l_gi_3bank: 240830
        l_gi_5bank_lower: 240830
        l_gi_5bank_upper: 240830


light_player:
  # Overall Cyclops GI. Bank GI is overridden by the pulsing purple show.
  mode_cyclops_started:
    gi: D08080

  mode_cyclops_stopping:
    gi: E0E0E0
